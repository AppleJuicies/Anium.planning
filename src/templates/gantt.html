<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Redesign – Gantt</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { --bg:#F9F8F7; --surf:#fff; --surf2:#F0EFED; --bdr:#E6E5E3; --txt:#2C2C2B; --muted:#7D7A75; --acc:#2783DE; --wknd:rgba(0,0,0,0.015); --tc:rgba(39,131,222,0.04); --hov:rgba(0,0,0,0.02); }
body.dark { --bg:#141414; --surf:#1e1e1e; --surf2:#252525; --bdr:rgba(255,255,255,0.07); --txt:rgba(255,255,255,0.88); --muted:rgba(255,255,255,0.38); --acc:#5E9FE8; --wknd:rgba(255,255,255,0.012); --tc:rgba(94,159,232,0.05); --hov:rgba(255,255,255,0.025); }
body { background:var(--bg); color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size:13px; min-height:100vh; padding:24px 24px 48px; transition:background .2s,color .2s; }

.hdr { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap; }
.hdr h1 { font-size:20px; font-weight:650; letter-spacing:-.02em; margin-bottom:3px; }
.hdr p { color:var(--muted); font-size:12px; }
.hdr-right { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.legend { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.li { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--muted); font-weight:500; }
.ld { width:9px; height:9px; border-radius:2px; }

.tbtn { padding:6px 12px; border-radius:8px; border:1px solid var(--bdr); background:var(--surf2); color:var(--muted); font-size:12px; cursor:pointer; transition:all .15s; display:flex; align-items:center; gap:5px; font-family:inherit; }
.tbtn:hover { color:var(--txt); }

.chips { display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
.chip { background:var(--surf); border:1px solid var(--bdr); border-radius:8px; padding:8px 14px; display:flex; flex-direction:column; gap:1px; }
.cv { font-size:18px; font-weight:650; letter-spacing:-.02em; }
.cl { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-weight:500; }

.gantt-wrap { background:var(--surf); border:1px solid var(--bdr); border-radius:12px; overflow:auto; box-shadow:0 2px 12px rgba(0,0,0,.05); min-width:640px; }
.gantt-hdr { display:grid; grid-template-columns:280px 1fr; border-bottom:1px solid var(--bdr); background:var(--surf2); position:sticky; top:0; z-index:20; }
.ghl { padding:10px 14px; font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; border-right:1px solid var(--bdr); }
.day-cols { display:grid; grid-template-columns:repeat(14,1fr); }
.dc { padding:5px 3px; text-align:center; font-size:10px; color:var(--muted); font-weight:500; border-right:1px solid var(--bdr); line-height:1.3; }
.dc .dn { font-size:12px; font-weight:650; display:block; }
.dc.wk { color:color-mix(in srgb,var(--muted) 45%,transparent); }
.dc.td { color:var(--acc); font-weight:700; }

/* Phase */
.ph-row { display:grid; grid-template-columns:280px 1fr; background:var(--surf2); border-bottom:1px solid var(--bdr); }
.ph-lbl { padding:7px 10px 7px 12px; display:flex; align-items:center; gap:6px; border-right:1px solid var(--bdr); }
.ph-chev { width:20px; height:20px; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; border-radius:4px; transition:all .15s; color:var(--muted); border:none; background:transparent; }
.ph-chev:hover { background:rgba(0,0,0,.06); color:var(--txt); }
.ph-chev svg { width:11px; height:11px; transition:transform .15s; }
.ph-chev.coll svg { transform:rotate(-90deg); }
.ph-dot { width:8px; height:8px; border-radius:2px; flex-shrink:0; }
.ph-name { flex:1; text-overflow:ellipsis; border:none; background:transparent; color:inherit; font-family:inherit; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; cursor:text; outline:none; padding:2px 4px; border-radius:3px; min-width:0; }
.ph-name:focus { background:rgba(0,0,0,.04); }
.ph-prog { font-size:10px; color:var(--muted); white-space:nowrap; flex-shrink:0; }
.ph-del { width:20px; height:20px; border:none; background:transparent; color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; border-radius:3px; font-size:15px; flex-shrink:0; opacity:0; transition:all .12s; }
.ph-row:hover .ph-del { opacity:1; }
.ph-del:hover { background:rgba(229,100,88,.12); color:#E56458; }
.ph-bars { display:grid; grid-template-columns:repeat(14,1fr); position:relative; }
.pc { border-right:1px solid var(--bdr); height:32px; }
.pc.wk { background:var(--wknd); }
.ph-band { position:absolute; top:5px; height:22px; border-radius:4px; opacity:.1; pointer-events:none; }

/* Task */
.tr { display:grid; grid-template-columns:280px 1fr; border-bottom:1px solid var(--bdr); }
.tr:last-child { border-bottom:none; }
.tr:hover { background:var(--hov); }
.tl { padding:0 8px 0 12px; display:flex; align-items:center; gap:5px; border-right:1px solid var(--bdr); min-height:40px; }
.chk { width:14px; height:14px; border-radius:3px; border:1.5px solid var(--bdr); flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .12s; }
.chk:hover { border-color:var(--muted); }
.chk.done { background:#46A171; border-color:#46A171; }
.chk.done::after { content:''; display:block; width:7px; height:4.5px; border-left:1.5px solid #fff; border-bottom:1.5px solid #fff; transform:rotate(-45deg) translate(1px,-.5px); }
.tn { flex:1; text-overflow:ellipsis; border:none; background:transparent; color:var(--txt); font-family:inherit; font-size:12.5px; line-height:1.3; cursor:text; outline:none; padding:2px 4px; border-radius:3px; min-width:0; }
.tn:focus { background:rgba(0,0,0,.04); }
.tn.done { opacity:.4; text-decoration:line-through; }
.tp { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:2px 5px; border-radius:3px; cursor:pointer; flex-shrink:0; user-select:none; }
.tp.h { background:rgba(229,100,88,.1); color:#E56458; }
.tp.m { background:rgba(213,128,59,.1); color:#D5803B; }
.tp.l { background:rgba(70,161,113,.1); color:#46A171; }
.icon-btn { width:20px; height:20px; border:none; background:transparent; color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; border-radius:3px; font-size:13px; flex-shrink:0; opacity:0; transition:all .12s; }
.tr:hover .icon-btn { opacity:1; }
.icon-btn.has { opacity:1; color:var(--acc); }
.icon-btn.del:hover { background:rgba(229,100,88,.12); color:#E56458; }

.tb { display:grid; grid-template-columns:repeat(14,1fr); position:relative; align-items:center; }
.tc { border-right:1px solid var(--bdr); height:40px; }
.tc.wk { background:var(--wknd); }
.tc.tdc { background:var(--tc); }

.bar { position:absolute; height:20px; top:50%; transform:translateY(-50%); border-radius:5px; cursor:grab; color:#fff; font-size:10px; font-weight:600; display:flex; align-items:center; padding:0 6px; overflow:visible; user-select:none; z-index:2; transition:filter .1s; }
.bar:hover { filter:brightness(1.1); }
.bar.drag { cursor:grabbing; filter:brightness(1.15); opacity:.85; }
.bar.done { opacity:.35; }
.brz { position:absolute; right:-3px; top:0; bottom:0; width:10px; cursor:ew-resize; border-radius:0 5px 5px 0; }

.ms { position:absolute; width:13px; height:13px; top:50%; transform:translateY(-50%) rotate(45deg); z-index:3; border-radius:2px; }
.tl-line { position:absolute; top:0; bottom:0; width:2px; z-index:15; pointer-events:none; }
.tl-line::before { content:none; }

.add-tr { display:grid; grid-template-columns:280px 1fr; border-bottom:1px solid var(--bdr); }
.add-tr:last-child { border-bottom:none; }
.add-t { padding:5px 12px 5px 40px; display:flex; align-items:center; gap:5px; color:var(--muted); font-size:12px; cursor:pointer; border:none; background:transparent; font-family:inherit; text-align:left; border-right:1px solid var(--bdr); transition:all .15s; width:100%; }
.add-t:hover { color:var(--txt); background:var(--hov); }
.add-ph-row { padding:10px 14px; border-top:1px solid var(--bdr); }
.add-ph { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:12px; cursor:pointer; border:none; background:transparent; font-family:inherit; padding:6px 8px; border-radius:6px; transition:all .15s; }
.add-ph:hover { color:var(--txt); background:var(--hov); }

/* Modal */
.mo { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:3000; align-items:center; justify-content:center; backdrop-filter:blur(3px); }
.mo.open { display:flex; }
.md { background:var(--surf); border:1px solid var(--bdr); border-radius:12px; padding:20px; width:360px; box-shadow:0 16px 48px rgba(0,0,0,.2); }
.md h4 { font-size:14px; font-weight:600; line-height:1.4; margin-bottom:12px; }
.md textarea { width:100%; height:90px; background:var(--surf2); border:1px solid var(--bdr); border-radius:8px; padding:10px; color:var(--txt); font-family:inherit; font-size:13px; resize:vertical; outline:none; }
.md textarea:focus { border-color:var(--acc); }
.md-footer { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }
.mb { padding:7px 14px; border-radius:7px; border:1px solid var(--bdr); background:var(--surf2); color:var(--muted); font-size:12px; font-weight:500; cursor:pointer; transition:all .12s; font-family:inherit; }
.mb:hover { color:var(--txt); }
.mb.p { background:var(--acc); border-color:var(--acc); color:#fff; }
.mb.p:hover { filter:brightness(1.1); }

.footer { margin-top:16px; display:flex; gap:8px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
.fn { color:var(--muted); font-size:11px; }
.fb { padding:7px 13px; border-radius:7px; border:1px solid var(--bdr); background:var(--surf); color:var(--muted); font-size:12px; font-weight:500; cursor:pointer; transition:all .12s; font-family:inherit; }
.fb:hover { color:var(--txt); background:var(--surf2); }
.fb.p { background:var(--acc); border-color:var(--acc); color:#fff; }
.fb.p:hover { filter:brightness(1.1); }

@media print { .footer,.hdr-right { display:none; } body { padding:12px; } }
[hidden] { display:none !important; }

/* View switch */
.seg { display:inline-flex; gap:2px; padding:2px; border:1px solid var(--bdr); border-radius:8px; background:var(--surf2); }
.seg button { border:0; background:transparent; color:var(--muted); font:inherit; font-size:12px; font-weight:500; padding:5px 11px; border-radius:6px; cursor:pointer; transition:all .12s; }
.seg button:hover { color:var(--txt); }
.seg button.on { background:var(--surf); color:var(--txt); box-shadow:0 1px 3px rgba(0,0,0,.08); }

/* Drag to reorder */
.grip { width:14px; height:20px; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:var(--muted); cursor:grab; opacity:0; border:0; background:transparent; padding:0; border-radius:3px; touch-action:none; transition:opacity .12s; }
.ph-row:hover .grip, .tr:hover .grip { opacity:.7; }
.grip:hover { opacity:1; background:var(--hov); }
.grip svg { width:8px; height:12px; }
.ph-block > .add-tr:last-child { border-bottom:1px solid var(--bdr); }
.dragging { opacity:.35; }
body.reordering, body.reordering * { cursor:grabbing !important; user-select:none !important; }
.drop-line { position:fixed; height:2px; background:var(--acc); border-radius:2px; z-index:5000; pointer-events:none; box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 22%,transparent); }
.drop-line.v { height:auto; width:2px; }
.drag-ghost { position:fixed; left:0; top:0; z-index:5001; pointer-events:none; max-width:260px; padding:6px 10px; border-radius:8px; background:var(--surf); border:1px solid var(--bdr); box-shadow:0 8px 24px rgba(0,0,0,.18); font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* Board */
.board { display:flex; gap:12px; align-items:flex-start; overflow-x:auto; padding:2px 2px 12px; min-height:200px; }
.col { flex:0 0 280px; min-width:0; display:flex; flex-direction:column; max-height:calc(100vh - 230px); background:var(--surf2); border:1px solid var(--bdr); border-radius:12px; transition:background .12s,border-color .12s; }
.col.drop-on { border-color:var(--acc); background:color-mix(in srgb,var(--acc) 7%,var(--surf2)); }
.col-hd { display:flex; align-items:center; gap:6px; padding:10px 10px 8px 12px; user-select:none; }
.col-hd.movable { cursor:grab; touch-action:none; }
.col-hd .ph-name { cursor:text; }
.col-title { flex:1; min-width:0; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; padding:2px 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.col-ct { flex-shrink:0; font-size:10.5px; color:var(--muted); background:var(--surf); border:1px solid var(--bdr); border-radius:10px; padding:1px 7px; }
.col-hd .ph-del { opacity:0; }
.col-hd:hover .ph-del { opacity:1; }
.col-list { display:flex; flex-direction:column; gap:8px; padding:2px 8px 8px; overflow-y:auto; min-height:44px; }
.col-empty { font-size:11.5px; color:var(--muted); text-align:center; padding:12px 6px; border:1px dashed var(--bdr); border-radius:8px; }
.col .add-ph { margin:0 8px 8px; }
.col-new { flex:0 0 200px; }
.col-new .add-ph { width:100%; justify-content:center; padding:10px; border:1px dashed var(--bdr); border-radius:12px; }
.card { background:var(--surf); border:1px solid var(--bdr); border-left:3px solid var(--acc); border-radius:8px; padding:8px 8px 8px 9px; box-shadow:0 1px 2px rgba(0,0,0,.04); cursor:grab; user-select:none; touch-action:none; transition:box-shadow .12s; }
.card:hover { box-shadow:0 3px 10px rgba(0,0,0,.08); }
.card-top { display:flex; align-items:flex-start; gap:7px; }
.card-top .chk { margin-top:2px; }
.cn { flex:1; min-width:0; font-size:12.5px; line-height:1.35; word-break:break-word; cursor:text; border-radius:3px; }
.card.done .cn { opacity:.45; text-decoration:line-through; }
.cn-edit { flex:1; min-width:0; font:inherit; font-size:12.5px; line-height:1.35; padding:1px 4px; border:1px solid var(--acc); border-radius:4px; background:var(--surf); color:var(--txt); outline:none; }
.card-meta { display:flex; align-items:center; gap:6px; margin-top:7px; padding-left:21px; min-height:20px; }
.card-meta .sp { flex:1; }
.card-date { font-size:10.5px; color:var(--muted); white-space:nowrap; }
.card-ph { display:flex; align-items:center; gap:5px; margin-top:5px; padding-left:21px; font-size:10.5px; color:var(--muted); }
.card-ph span { min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card-ph i { width:7px; height:7px; border-radius:2px; flex-shrink:0; }
.card .icon-btn { opacity:0; }
.card:hover .icon-btn, .card .icon-btn.has { opacity:1; }
.card-att { font-size:10.5px; color:var(--muted); white-space:nowrap; }
@media print { .seg { display:none; } .col { max-height:none; } }

/* Details panel */
.dp-back { position:fixed; inset:0; background:rgba(0,0,0,.18); z-index:2500; opacity:0; pointer-events:none; transition:opacity .15s; }
.dp-back.open { opacity:1; pointer-events:auto; }
.dp { position:fixed; top:0; right:0; bottom:0; width:min(440px,100vw); display:flex; flex-direction:column; background:var(--surf); border-left:1px solid var(--bdr); box-shadow:-12px 0 40px rgba(0,0,0,.14); z-index:2600; transform:translateX(105%); transition:transform .18s ease; }
.dp.open { transform:none; }
.dp-hd { display:flex; align-items:center; gap:8px; padding:12px 12px 12px 18px; border-bottom:1px solid var(--bdr); }
.dp-kind { flex:1; display:flex; align-items:center; gap:7px; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); min-width:0; }
.dp-kind span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dp-x { width:28px; height:28px; border:0; background:transparent; color:var(--muted); border-radius:6px; cursor:pointer; font-size:18px; line-height:1; }
.dp-x:hover { background:var(--surf2); color:var(--txt); }
.dp-body { flex:1; overflow-y:auto; padding:16px 18px 28px; }
.dp-title { display:block; width:calc(100% + 12px); margin:-4px -6px 14px; padding:4px 6px; border:0; border-radius:6px; resize:none; overflow:hidden; background:transparent; color:var(--txt); font:inherit; font-size:18px; font-weight:650; line-height:1.3; outline:none; }
.dp-title:focus { background:var(--surf2); }
.dp-grid { display:grid; grid-template-columns:92px 1fr; gap:9px 10px; align-items:center; }
.dp-grid > .lb { font-size:11.5px; color:var(--muted); }
.dp-grid .val { font-size:12.5px; }
.dp select, .dp input[type=date], .dp input[type=url], .dp input[type=text] { font:inherit; font-size:12.5px; color:var(--txt); background:var(--surf); border:1px solid var(--bdr); border-radius:6px; padding:5px 8px; outline:none; color-scheme:light; }
body.dark .dp select, body.dark .dp input { color-scheme:dark; }
.dp select:focus, .dp input:focus { border-color:var(--acc); }
.dp .seg button { padding:4px 10px; }
.dp-dates { display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:12px; color:var(--muted); }
.dp-chk { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; cursor:pointer; }
.dp-h { display:flex; align-items:center; gap:8px; margin:22px 0 8px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
.dp-h .ct { font-weight:500; }
.dp-notes { display:block; width:100%; min-height:120px; resize:vertical; padding:10px; border:1px solid var(--bdr); border-radius:8px; background:var(--surf2); color:var(--txt); font:inherit; font-size:13px; line-height:1.5; outline:none; }
.dp-notes:focus { border-color:var(--acc); background:var(--surf); }
.dp-text { font-size:13px; line-height:1.55; white-space:pre-wrap; color:var(--txt); }
.dp-empty { font-size:12px; color:var(--muted); }
.att-list { display:flex; flex-direction:column; gap:6px; }
.att { display:flex; align-items:center; gap:10px; text-decoration:none; padding:7px 8px 7px 9px; border:1px solid var(--bdr); border-radius:8px; background:var(--surf); cursor:pointer; text-align:left; font:inherit; color:inherit; width:100%; }
.att:hover { background:var(--surf2); }
.att-ic { width:30px; height:30px; flex-shrink:0; display:grid; place-items:center; border-radius:6px; font-size:9.5px; font-weight:700; color:#fff; text-transform:uppercase; letter-spacing:.02em; }
.att-tx { flex:1; min-width:0; }
.att-nm { font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.att-sub { font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.att .icon-btn { opacity:0; }
.att:hover .icon-btn { opacity:1; }
.att.busy { opacity:.6; cursor:default; }
.att-actions { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
.att-actions .fb { padding:6px 11px; }
.dp-drop { margin-top:8px; padding:12px; border:1.5px dashed var(--bdr); border-radius:10px; text-align:center; font-size:11.5px; color:var(--muted); }
.dp.dragover .dp-drop { border-color:var(--acc); color:var(--acc); background:color-mix(in srgb,var(--acc) 6%,transparent); }
.link-row { display:flex; gap:6px; margin-top:8px; }
.link-row input { flex:1; min-width:0; }
.dp-tasks { display:flex; flex-direction:column; gap:2px; }
.dp-task { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px; cursor:pointer; font-size:12.5px; border:0; background:transparent; color:inherit; font-family:inherit; text-align:left; width:100%; }
.dp-task:hover { background:var(--surf2); }
.dp-task .nm { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dp-task .st { font-size:10.5px; color:var(--muted); white-space:nowrap; }
.dp-task.done .nm { opacity:.5; text-decoration:line-through; }
.swatches { display:flex; gap:6px; flex-wrap:wrap; }
.sw { width:20px; height:20px; border-radius:5px; cursor:pointer; border:2px solid transparent; padding:0; }
.sw.on { border-color:var(--txt); }
.dp-ft { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:12px 14px; border-top:1px solid var(--bdr); }
.dp-ft .fn { font-size:11px; }
.dp-del { border:0; background:transparent; color:#E56458; font:inherit; font-size:12px; cursor:pointer; padding:6px 8px; border-radius:6px; }
.dp-del:hover { background:rgba(229,100,88,.1); }
.ph-info { width:20px; height:20px; flex-shrink:0; border:none; background:transparent; color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; border-radius:3px; font-size:13px; opacity:0; transition:all .12s; }
.ph-row:hover .ph-info, .col-hd:hover .ph-info, .ph-info.has { opacity:1; }
.ph-info:hover { background:var(--hov); color:var(--txt); }
.ph-info.has { color:var(--acc); }
@media print { .dp, .dp-back { display:none; } }
.start-lbl { display:inline-flex; align-items:center; gap:6px; margin-top:6px; font-size:11px; color:var(--muted); }
.start-lbl input { font:inherit; font-size:11.5px; color:var(--txt); background:var(--surf); border:1px solid var(--bdr); border-radius:6px; padding:3px 6px; color-scheme:inherit; }
body.dark .start-lbl input { color-scheme:dark; }
</style>
</head>
<body>

<div class="hdr">
  <div>
    <h1>Robot Part Redesign</h1>
    <p id="date-range">2-Week Execution Plan</p>
    <label class="start-lbl">Starts <input type="date" id="start-date"></label>
  </div>
  <div class="hdr-right">
    <div class="seg" id="view-sw" role="group" aria-label="View"><button data-v="timeline">Timeline</button><button data-v="board">Board</button></div>
    <div class="seg" id="group-sw" role="group" aria-label="Board columns"><button data-g="phase">By phase</button><button data-g="status">By progress</button></div>
    <div class="legend" id="legend"></div>
    <button class="tbtn" id="theme-btn">&#9680; Dark</button>
  </div>
</div>

<div class="chips">
  <div class="chip"><span class="cv" id="days-left" style="color:#2783DE">14</span><span class="cl">Days Left</span></div>
  <div class="chip"><span class="cv" id="tasks-done" style="color:#46A171">0</span><span class="cl">Done</span></div>
  <div class="chip"><span class="cv" id="tasks-total">0</span><span class="cl">Total</span></div>
  <div class="chip"><span class="cv" id="pct-done" style="color:#D5803B">0%</span><span class="cl">Complete</span></div>
</div>

<div class="gantt-wrap">
  <div class="gantt-hdr">
    <div class="ghl">Task</div>
    <div class="day-cols" id="days-header"></div>
  </div>
  <div id="gantt-body"></div>
</div>

<div class="board" id="board" hidden></div>

<div class="footer">
  <span class="fn" id="hint"></span>
  <div style="display:flex;gap:8px">
    <button class="fb" id="btn-reset">Reset Progress</button>
    <button class="fb p" onclick="window.print()">Export / Print</button>
  </div>
</div>

<!-- Details panel (task or phase) -->
<div class="dp-back" id="dp-back"></div>
<aside class="dp" id="dp" aria-label="Details" aria-hidden="true"></aside>

<script>
const DAYS=14;
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const COLORS=['#2783DE','#9B6DD4','#D5803B','#46A171','#E56458','#4FB9C9','#DE9255'];

function uid(){return Math.random().toString(36).slice(2,8);}
function dc(o){return JSON.parse(JSON.stringify(o));}
function cl(v,a,b){return Math.min(b,Math.max(a,v));}
function pct(i,d){d=d||DAYS;return((i/d)*100).toFixed(3)+'%';}

const DEFAULT={theme:'light',phases:[
  {id:'p0',name:'Design & Research',color:'#2783DE',collapsed:false,tasks:[
    {id:'t0',name:'Finalize mood board & concept options',start:0,end:0,priority:'h',done:false,milestone:false,note:'Due today — show boss options'},
    {id:'t1',name:'Document current design pain points',start:0,end:1,priority:'h',done:false,milestone:false,note:''},
    {id:'t2',name:'Reference research & benchmarking',start:1,end:2,priority:'m',done:false,milestone:false,note:''},
    {id:'t3',name:'Sketch 2–3 design directions',start:1,end:3,priority:'h',done:false,milestone:false,note:''},
    {id:'t4',name:'Component & material feasibility check',start:2,end:4,priority:'m',done:false,milestone:false,note:''},
  ]},
  {id:'p1',name:'Boss Presentation & Approval',color:'#9B6DD4',collapsed:false,tasks:[
    {id:'t5',name:'Prepare presentation deck / visuals',start:2,end:3,priority:'h',done:false,milestone:false,note:''},
    {id:'t6',name:'Boss review meeting',start:4,end:4,priority:'h',done:false,milestone:true,note:''},
    {id:'t7',name:'Incorporate feedback & lock direction',start:4,end:5,priority:'h',done:false,milestone:false,note:''},
  ]},
  {id:'p2',name:'Prototype Build',color:'#D5803B',collapsed:false,tasks:[
    {id:'t8',name:'CAD / detailed design work',start:5,end:7,priority:'h',done:false,milestone:false,note:''},
    {id:'t9',name:'Source / order required parts',start:5,end:6,priority:'h',done:false,milestone:false,note:''},
    {id:'t10',name:'Fabrication & assembly – iteration 1',start:7,end:9,priority:'h',done:false,milestone:false,note:''},
    {id:'t11',name:'Fit check & functional test',start:9,end:10,priority:'m',done:false,milestone:false,note:''},
    {id:'t12',name:'Fix & refine from test results',start:10,end:11,priority:'m',done:false,milestone:false,note:''},
  ]},
  {id:'p3',name:'Showcase Preparation',color:'#46A171',collapsed:false,tasks:[
    {id:'t13',name:'Demo script & talking points',start:11,end:12,priority:'m',done:false,milestone:false,note:''},
    {id:'t14',name:'Rehearse & polish presentation',start:12,end:12,priority:'l',done:false,milestone:false,note:''},
    {id:'t15',name:'Prototype showcase 🏁',start:13,end:13,priority:'h',done:false,milestone:true,note:''},
  ]},
]};

const SK='gantt_v3';
let S=loadS()||dc(DEFAULT);
let barDrag=null;

function saveS(){try{localStorage.setItem(SK,JSON.stringify(S));}catch(e){}}
function loadS(){try{const r=localStorage.getItem(SK);return r?JSON.parse(r):null;}catch(e){return null;}}

// Pinned start date: the plan keeps the same dates no matter when it's opened.
function isoDay(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function startDay(){const s=S.start?new Date(S.start+'T00:00:00'):new Date();s.setHours(0,0,0,0);return s;}
function dates(){const s=startDay();return Array.from({length:DAYS},(_,i)=>{const d=new Date(s);d.setDate(d.getDate()+i);return d;});}
function todayIdx(){const t=new Date();t.setHours(0,0,0,0);return Math.round((t-startDay())/86400000);}

function applyTheme(){
  document.body.classList.toggle('dark',S.theme==='dark');
  document.getElementById('theme-btn').textContent=S.theme==='dark'?'☀️ Light':'◐ Dark';
}

function renderSummary(){
  let tot=0,dn=0;
  S.phases.forEach(p=>p.tasks.forEach(t=>{tot++;if(t.done)dn++;}));
  document.getElementById('tasks-done').textContent=dn;
  document.getElementById('tasks-total').textContent=tot;
  document.getElementById('pct-done').textContent=tot?Math.round(dn/tot*100)+'%':'0%';
  // Update date range
  const ds=dates();
  document.getElementById('date-range').textContent=`2-Week Plan · ${MN[ds[0].getMonth()]} ${ds[0].getDate()} – ${MN[ds[13].getMonth()]} ${ds[13].getDate()}`;
  const ti=todayIdx();
  document.getElementById('days-left').textContent=ti<0?DAYS:Math.max(0,DAYS-ti);
  document.getElementById('start-date').value=isoDay(ds[0]);
}

function renderLegend(){
  const el=document.getElementById('legend');
  el.innerHTML='';
  S.phases.forEach(p=>{
    const li=document.createElement('div');li.className='li';
    li.innerHTML=`<div class="ld" style="background:${p.color}"></div><span>${p.name}</span>`;
    el.appendChild(li);
  });
}

function renderDaysHdr(){
  const wrap=document.getElementById('days-header');
  wrap.innerHTML='';
  dates().forEach((d,i)=>{
    const el=document.createElement('div');
    el.className='dc'+([0,6].includes(d.getDay())?' wk':'')+(i===todayIdx()?' td':'');
    el.innerHTML=`<span class="dn">${d.getDate()}</span>${DN[d.getDay()]}`;
    wrap.appendChild(el);
  });
}

function makeTodayLine(color){
  const l=document.createElement('div');
  l.className='tl-line';
  l.style.background=color||'var(--acc)';
  l.style.color=color||'var(--acc)';
  const ti=todayIdx();
  if(ti<0||ti>=DAYS)l.style.display='none';
  l.style.left=`calc(${pct(Math.max(0,Math.min(DAYS-1,ti)))} + ${100/DAYS/2}%)`;
  return l;
}

function renderBody(){
  const body=document.getElementById('gantt-body');
  body.innerHTML='';
  const ds=dates();

  S.phases.forEach((phase,pi)=>{
    // Each phase's rows sit in one block, so the whole phase can be dragged
    const block=document.createElement('div');block.className='ph-block';block.dataset.pi=pi;
    // Phase header
    const row=document.createElement('div');row.className='ph-row';
    const lbl=document.createElement('div');lbl.className='ph-lbl';

    const pGrip=makeGrip('Drag to reorder phases');
    pGrip.addEventListener('pointerdown',e=>startDrag(e,{kind:'phase',view:'timeline',pi,el:block,label:phase.name}));

    const chev=document.createElement('button');chev.className='ph-chev'+(phase.collapsed?' coll':'');
    chev.innerHTML='<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><polyline points="2,4 6,8 10,4"/></svg>';
    chev.addEventListener('click',()=>{phase.collapsed=!phase.collapsed;saveS();renderBody();});

    const dot=document.createElement('div');dot.className='ph-dot';dot.style.background=phase.color;

    const nameEl=document.createElement('input');nameEl.className='ph-name';nameEl.style.color=phase.color;
    nameEl.value=phase.name;nameEl.title=phase.name+' · click to rename';
    nameEl.addEventListener('mousedown',e=>e.stopPropagation());
    nameEl.addEventListener('change',()=>{phase.name=nameEl.value;saveS();renderLegend();});

    const done=phase.tasks.filter(t=>t.done).length;
    const prog=document.createElement('span');prog.className='ph-prog';prog.textContent=`${done}/${phase.tasks.length}`;

    const del=document.createElement('button');del.className='ph-del';del.innerHTML='×';del.title='Delete phase';
    del.addEventListener('click',async()=>{if(!await ask(`Delete phase “${phase.name}” and its tasks?`,'Delete'))return;S.phases.splice(pi,1);saveS();renderAll();});

    const pInfo=document.createElement('button');pInfo.className='ph-info'+(phase.note||(phase.files||[]).length?' has':'');pInfo.innerHTML='ⓘ';pInfo.title='Phase details';
    pInfo.addEventListener('click',()=>openDetails({pid:phase.id}));

    lbl.appendChild(pGrip);lbl.appendChild(chev);lbl.appendChild(dot);lbl.appendChild(nameEl);lbl.appendChild(prog);lbl.appendChild(pInfo);lbl.appendChild(del);
    row.appendChild(lbl);

    // Phase bars
    const pBars=document.createElement('div');pBars.className='ph-bars';
    for(let i=0;i<DAYS;i++){const c=document.createElement('div');c.className='pc'+([0,6].includes(ds[i].getDay())?' wk':'');pBars.appendChild(c);}
    if(phase.tasks.length){
      const minS=Math.min(...phase.tasks.map(t=>t.start));
      const maxE=Math.max(...phase.tasks.map(t=>t.end));
      const band=document.createElement('div');band.className='ph-band';
      band.style.left=pct(minS);band.style.width=`calc(${pct(maxE-minS+1)} - 4px)`;band.style.background=phase.color;
      pBars.appendChild(band);
    }
    pBars.appendChild(makeTodayLine(phase.color));
    row.appendChild(pBars);
    block.appendChild(row);
    body.appendChild(block);

    if(phase.collapsed)return;

    phase.tasks.forEach((task,ti)=>{
      const tr=document.createElement('div');tr.className='tr';
      const tl=document.createElement('div');tl.className='tl';

      const grip=makeGrip('Drag to reorder, or move to another phase');
      grip.addEventListener('pointerdown',e=>startDrag(e,{kind:'task',view:'timeline',pi,ti,el:tr,label:task.name}));

      const chk=document.createElement('div');chk.className='chk'+(task.done?' done':'');
      chk.addEventListener('click',()=>{toggleDone(task);saveS();renderAll();});

      const tn=document.createElement('input');tn.className='tn'+(task.done?' done':'');
      tn.value=task.name;tn.title=task.name+' · click to edit';
      tn.addEventListener('mousedown',e=>e.stopPropagation());
      tn.addEventListener('change',()=>{task.name=tn.value;saveS();});

      const pmap={h:'h',m:'m',l:'l'};
      const plabel={h:'↑ High',m:'— Med',l:'↓ Low'};
      const tp=document.createElement('span');tp.className=`tp ${pmap[task.priority]}`;tp.textContent=plabel[task.priority].split(' ')[0];tp.title='Click to cycle priority';
      tp.addEventListener('click',()=>{const cy={h:'m',m:'l',l:'h'};task.priority=cy[task.priority];saveS();renderBody();});

      const nb=document.createElement('button');nb.className='icon-btn'+(task.note||(task.files||[]).length?' has':'');nb.innerHTML='ⓘ';nb.title='Details, notes and attachments';
      nb.addEventListener('click',()=>openDetails({tid:task.id}));

      const db=document.createElement('button');db.className='icon-btn del';db.innerHTML='×';db.title='Delete task';
      db.addEventListener('click',()=>{phase.tasks.splice(ti,1);saveS();renderAll();});

      tl.appendChild(grip);tl.appendChild(chk);tl.appendChild(tn);tl.appendChild(tp);tl.appendChild(nb);tl.appendChild(db);
      tr.appendChild(tl);

      const tbWrap=document.createElement('div');tbWrap.className='tb';tbWrap.style.position='relative';
      for(let i=0;i<DAYS;i++){const c=document.createElement('div');c.className='tc'+([0,6].includes(ds[i].getDay())?' wk':'')+(i===todayIdx()?' tdc':'');tbWrap.appendChild(c);}

      if(task.milestone){
        const m=document.createElement('div');m.className='ms';m.style.background=phase.color;m.style.cursor='pointer';
        m.addEventListener('click',()=>openDetails({tid:task.id}));
        m.style.left=`calc(${pct(task.start)} + ${100/DAYS/2}% - 6.5px)`;m.title=task.name;
        tbWrap.appendChild(m);
      } else {
        const bar=document.createElement('div');bar.className='bar'+(task.done?' done':'');
        bar.style.background=phase.color;
        bar.style.left=pct(task.start);
        bar.style.width=`calc(${pct(task.end-task.start+1)} - 4px)`;
        bar.dataset.pi=pi;bar.dataset.ti=ti;
        bar.title=task.name+(task.note?' \n\u24d8 '+task.note:'');

        const rzHandle=document.createElement('div');rzHandle.className='brz';
        bar.appendChild(rzHandle);

        bar.addEventListener('mousedown',e=>{
          if(rzHandle===e.target||rzHandle.contains(e.target))return;
          e.preventDefault();e.stopPropagation();
          const rect=tbWrap.getBoundingClientRect();
          barDrag={el:bar,barsEl:tbWrap,pi,ti,tid:task.id,type:'move',sx:e.clientX,os:task.start,oe:task.end,bw:rect.width,moved:false};
          bar.classList.add('drag');
        });
        rzHandle.addEventListener('mousedown',e=>{
          e.preventDefault();e.stopPropagation();
          const rect=tbWrap.getBoundingClientRect();
          barDrag={el:bar,barsEl:tbWrap,pi,ti,tid:task.id,type:'resize',sx:e.clientX,os:task.start,oe:task.end,bw:rect.width,moved:true};
          bar.classList.add('drag');
        });
        tbWrap.appendChild(bar);
      }
      tbWrap.appendChild(makeTodayLine(phase.color));
      tr.appendChild(tbWrap);
      block.appendChild(tr);
    });

    // Add task row
    const addTr=document.createElement('div');addTr.className='add-tr';
    const addBtn=document.createElement('button');addBtn.className='add-t';
    addBtn.innerHTML='<span style="font-size:15px">+</span> Add task';
    addBtn.addEventListener('click',()=>{
      phase.tasks.push({id:uid(),name:'New task',start:0,end:2,priority:'m',done:false,milestone:false,note:''});
      saveS();renderAll();
    });
    addTr.appendChild(addBtn);
    const addBarSide=document.createElement('div');addTr.appendChild(addBarSide);
    block.appendChild(addTr);
  });

  // Add phase
  const apRow=document.createElement('div');apRow.className='add-ph-row';
  const apBtn=document.createElement('button');apBtn.className='add-ph';
  apBtn.innerHTML='<span style="font-size:15px">+</span> Add phase';
  apBtn.addEventListener('click',()=>{
    const c=COLORS[S.phases.length%COLORS.length];
    S.phases.push({id:uid(),name:'New Phase',color:c,collapsed:false,tasks:[{id:uid(),name:'New task',start:0,end:2,priority:'m',done:false,milestone:false,note:''}]});
    saveS();renderAll();
  });
  apRow.appendChild(apBtn);
  body.appendChild(apRow);
}

// ─── Task status ──────────────────────────────────────────────────
// "In progress" is stored as status:'doing'; done stays the true/false it always was.
const STATUSES=[{id:'todo',name:'To do',color:'#7D7A75'},{id:'doing',name:'In progress',color:'#2783DE'},{id:'done',name:'Done',color:'#46A171'}];
const PLABEL={h:'High',m:'Med',l:'Low'};
function statusOf(t){return t.done?'done':t.status==='doing'?'doing':'todo';}
function setStatus(t,s){
  if(statusOf(t)!==s){const now=new Date().toISOString();if(s==='done')t.doneAt=now;if(s==='doing')t.startedAt=now;}
  t.status=s;t.done=s==='done';
}
function toggleDone(t){setStatus(t,t.done?'todo':'done');}
function fmtDay(i){const d=dates()[cl(i,0,DAYS-1)];return MN[d.getMonth()]+' '+d.getDate();}
function h(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
// In-page dialogs (browser confirm/prompt are blocked in some places this page runs)
function dialog(msg,okLabel,value){
  return new Promise(res=>{
    const mo=h('div','mo open'),md=h('div','md');md.setAttribute('role','dialog');md.setAttribute('aria-modal','true');
    md.appendChild(h('h4',null,msg));
    let inp=null;
    if(value!=null){inp=h('input');inp.type='text';inp.value=value;inp.style.cssText='width:100%;font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--bdr);border-radius:7px;background:var(--surf2);color:var(--txt);outline:none';md.appendChild(inp);}
    const ft=h('div','md-footer'),no=h('button','mb','Cancel'),ok=h('button','mb p',okLabel||'OK');
    const done=v=>{mo.remove();document.removeEventListener('keydown',key,true);res(v);};
    const key=e=>{if(e.key==='Escape'){e.stopPropagation();done(null);}if(e.key==='Enter'){e.preventDefault();done(inp?inp.value:true);}};
    no.addEventListener('click',()=>done(null));ok.addEventListener('click',()=>done(inp?inp.value:true));
    mo.addEventListener('mousedown',e=>{if(e.target===mo)done(null);});
    ft.appendChild(no);ft.appendChild(ok);md.appendChild(ft);mo.appendChild(md);document.body.appendChild(mo);
    document.addEventListener('keydown',key,true);
    setTimeout(()=>{if(inp){inp.focus();inp.select();}else ok.focus();},20);
  });
}
const ask=(msg,okLabel)=>dialog(msg,okLabel).then(v=>v===true);
const askText=(label,value)=>dialog(label,'Save',value||'');
function makeGrip(title){
  const g=h('button','grip');g.type='button';g.title=title;
  g.innerHTML='<svg viewBox="0 0 8 12" fill="currentColor"><circle cx="2" cy="2" r="1.1"/><circle cx="6" cy="2" r="1.1"/><circle cx="2" cy="6" r="1.1"/><circle cx="6" cy="6" r="1.1"/><circle cx="2" cy="10" r="1.1"/><circle cx="6" cy="10" r="1.1"/></svg>';
  return g;
}

// ─── Board view ───────────────────────────────────────────────────
function renderBoard(){
  const board=document.getElementById('board');
  const scroll=board.scrollLeft;board.innerHTML='';
  const byStatus=S.group==='status';
  const cols=byStatus
    ?STATUSES.map(s=>({status:s.id,name:s.name,color:s.color,items:[]}))
    :S.phases.map((p,pi)=>({pi,phase:p,name:p.name,color:p.color,items:[]}));
  S.phases.forEach((p,pi)=>p.tasks.forEach((t,ti)=>{
    const it={p,pi,t,ti};
    if(byStatus)cols.find(c=>c.status===statusOf(t)).items.push(it);else cols[pi].items.push(it);
  }));
  cols.forEach(c=>{
    const col=h('div','col');
    if(byStatus)col.dataset.status=c.status;else col.dataset.pi=c.pi;
    const hd=h('div','col-hd'+(byStatus?'':' movable'));
    const dot=h('div','ph-dot');dot.style.background=c.color;hd.appendChild(dot);
    if(byStatus){
      const title=h('span','col-title',c.name);title.style.color=c.color;hd.appendChild(title);
      hd.appendChild(h('span','col-ct',String(c.items.length)));
    } else {
      const phase=c.phase;
      // Plain text so the whole header can be grabbed; a click (without dragging) renames
      const title=h('span','col-title',phase.name);title.style.color=phase.color;title.title='Click for phase details · Drag to reorder';
      title.addEventListener('click',()=>{if(!justDragged)openDetails({pid:phase.id});});
      hd.appendChild(title);
      hd.appendChild(h('span','col-ct',phase.tasks.filter(t=>t.done).length+'/'+phase.tasks.length));
      const info=h('button','ph-info'+(phase.note||(phase.files||[]).length?' has':''),'ⓘ');info.title='Phase details';
      info.addEventListener('click',()=>openDetails({pid:phase.id}));
      hd.appendChild(info);
      const del=h('button','ph-del','×');del.title='Delete phase';
      del.addEventListener('click',async()=>{if(!await ask(`Delete phase “${phase.name}” and its tasks?`,'Delete'))return;S.phases.splice(c.pi,1);saveS();renderAll();});
      hd.appendChild(del);
      hd.addEventListener('pointerdown',e=>{if(e.target.closest('input,button'))return;startDrag(e,{kind:'phase',view:'board',pi:c.pi,el:col,label:phase.name});});
    }
    col.appendChild(hd);
    const list=h('div','col-list');
    c.items.forEach(it=>list.appendChild(makeCard(it,byStatus)));
    if(!c.items.length)list.appendChild(h('div','col-empty',byStatus?'Drag tasks here':'No tasks yet'));
    col.appendChild(list);
    if(!byStatus){
      const add=h('button','add-ph');add.innerHTML='<span style="font-size:15px">+</span> Add task';
      add.addEventListener('click',()=>{c.phase.tasks.push({id:uid(),name:'New task',start:0,end:2,priority:'m',done:false,milestone:false,note:''});saveS();renderAll();});
      col.appendChild(add);
    }
    board.appendChild(col);
  });
  if(!byStatus){
    const wrap=h('div','col-new');
    const add=h('button','add-ph');add.innerHTML='<span style="font-size:15px">+</span> Add phase';
    add.addEventListener('click',()=>{const c=COLORS[S.phases.length%COLORS.length];S.phases.push({id:uid(),name:'New Phase',color:c,collapsed:false,tasks:[]});saveS();renderAll();});
    wrap.appendChild(add);board.appendChild(wrap);
  }
  board.scrollLeft=scroll;
}
function makeCard({p,pi,t,ti},byStatus){
  const card=h('div','card'+(t.done?' done':''));card.style.borderLeftColor=p.color;
  const top=h('div','card-top');
  const chk=h('div','chk'+(t.done?' done':''));chk.title=t.done?'Mark not done':'Mark done';

// ─── Drag to reorder (timeline rows, board cards and columns) ─────
let drag=null,justDragged=false;
const dropLine=h('div','drop-line'),ghost=h('div','drag-ghost');
function startDrag(e,src){
  if(e.button!==0)return;
  drag={src,x0:e.clientX,y0:e.clientY,active:false,target:null};
  try{e.target.setPointerCapture(e.pointerId);}catch(err){}
}
document.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.active){
    if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<5)return;
    drag.active=true;drag.src.el.classList.add('dragging');document.body.classList.add('reordering');
    ghost.textContent=drag.src.label||'';document.body.appendChild(ghost);
  }
  e.preventDefault();
  ghost.style.transform=`translate(${e.clientX+14}px,${e.clientY+10}px)`;
  autoScroll(e.clientX,e.clientY);
  drag.target=locate(drag.src,e.clientX,e.clientY);
  showTarget(drag.target);
});
function endDrag(apply){
  const d=drag;drag=null;
  if(!d||!d.active)return;
  justDragged=true;setTimeout(()=>{justDragged=false;},0);
  d.src.el.classList.remove('dragging');document.body.classList.remove('reordering');
  ghost.remove();dropLine.remove();document.querySelectorAll('.col.drop-on').forEach(c=>c.classList.remove('drop-on'));
  if(apply&&d.target&&applyDrop(d.src,d.target)){saveS();renderAll();}
}
document.addEventListener('pointerup',()=>endDrag(true));
document.addEventListener('pointercancel',()=>endDrag(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&drag)endDrag(false);});

const rect=el=>el.getBoundingClientRect();
// Index to insert at: how many items sit before the pointer
const indexAt=(els,pos,vertical)=>els.filter(el=>{const r=rect(el);return vertical?pos>r.top+r.height/2:pos>r.left+r.width/2;}).length;
const nearest=(els,pos,vertical)=>els.reduce((best,el)=>{const r=rect(el),d=vertical?(pos<r.top?r.top-pos:pos>r.bottom?pos-r.bottom:0):(pos<r.left?r.left-pos:pos>r.right?pos-r.right:0);return !best||d<best.d?{el,d}:best;},null);
// Line just above item i, or just below the last one
function lineAt(items,i,box){
  const r=items.length?(i<items.length?rect(items[i]):rect(items[items.length-1])):box;
  const y=items.length?(i<items.length?r.top-1:r.bottom+1):box.top+4;
  const b=items.length?r:box;
  return {x:b.left,y,w:b.width};
}
function locate(src,x,y){
  if(src.view==='timeline'){
    const blocks=[...document.querySelectorAll('#gantt-body .ph-block')];
    if(src.kind==='phase'){
      const i=indexAt(blocks,y,true);
      return {kind:'phase',index:i,line:lineAt(blocks,i)};
    }
    const n=nearest(blocks,y,true);if(!n)return null;
    const pi=+n.el.dataset.pi,rows=[...n.el.querySelectorAll('.tr')],i=indexAt(rows,y,true);
    const box=rect(n.el.querySelector('.ph-row'));
    return {kind:'task',pi,index:rows.length?i:S.phases[pi].tasks.length,line:rows.length?lineAt(rows,i):{x:box.left,y:box.bottom,w:box.width}};
  }
  const cols=[...document.querySelectorAll('#board .col')];
  if(src.kind==='phase'){
    const i=indexAt(cols,x,false),r=rect(cols[Math.min(i,cols.length-1)]);
    return {kind:'phase',index:i,vline:{x:i<cols.length?r.left-7:r.right+5,y:r.top,h:r.height}};
  }
  const n=nearest(cols,x,false);if(!n)return null;
  if(n.el.dataset.status)return {kind:'status',status:n.el.dataset.status,col:n.el};
  const list=n.el.querySelector('.col-list'),cards=[...list.querySelectorAll('.card')],i=indexAt(cards,y,true),lr=rect(list);
  const l=lineAt(cards,i,lr);
  return {kind:'task',pi:+n.el.dataset.pi,index:i,line:{x:lr.left+8,y:cards.length?(i<cards.length?l.y-3:l.y+3):lr.top+4,w:lr.width-16}};
}
function showTarget(t){
  document.querySelectorAll('.col.drop-on').forEach(c=>c.classList.remove('drop-on'));
  if(!t){dropLine.remove();return;}
  if(t.col){t.col.classList.add('drop-on');dropLine.remove();return;}
  dropLine.classList.toggle('v',!!t.vline);
  Object.assign(dropLine.style,t.vline
    ?{left:t.vline.x+'px',top:t.vline.y+'px',height:t.vline.h+'px',width:''}
    :{left:t.line.x+'px',top:(t.line.y-1)+'px',width:t.line.w+'px',height:''});
  document.body.appendChild(dropLine);
}
// Returns true when something actually moved
function applyDrop(src,t){
  if(t.kind==='phase'){
    if(t.index===src.pi||t.index===src.pi+1)return false;
    const [p]=S.phases.splice(src.pi,1);S.phases.splice(t.index>src.pi?t.index-1:t.index,0,p);return true;
  }
  if(t.kind==='status'){
    const task=S.phases[src.pi].tasks[src.ti];
    if(statusOf(task)===t.status)return false;
    setStatus(task,t.status);return true;
  }
  if(t.pi===src.pi&&(t.index===src.ti||t.index===src.ti+1))return false;
  const [task]=S.phases[src.pi].tasks.splice(src.ti,1);
  let i=t.index;if(t.pi===src.pi&&i>src.ti)i--;
  S.phases[t.pi].tasks.splice(i,0,task);
  if(S.phases[t.pi].collapsed)S.phases[t.pi].collapsed=false;
  return true;
}
// Scroll the page or the board while dragging near an edge
function autoScroll(x,y){
  const edge=40,step=14;
  if(y<edge)window.scrollBy(0,-step);else if(y>innerHeight-edge)window.scrollBy(0,step);
  const board=document.getElementById('board');
  if(!board.hidden){
    const r=rect(board);
    if(x<r.left+edge)board.scrollLeft-=step;else if(x>r.right-edge)board.scrollLeft+=step;
    const list=document.elementFromPoint(x,y)?.closest?.('.col-list');
    if(list){const lr=rect(list);if(y<lr.top+edge)list.scrollTop-=step;else if(y>lr.bottom-edge)list.scrollTop+=step;}
  }
}

const FILE_COLORS={pdf:'#E56458',doc:'#2783DE',docx:'#2783DE',txt:'#7D7A75',md:'#7D7A75',xls:'#46A171',xlsx:'#46A171',csv:'#46A171',ppt:'#D5803B',pptx:'#D5803B',key:'#D5803B',zip:'#7D7A75',stl:'#4FB9C9',step:'#4FB9C9',stp:'#4FB9C9',dxf:'#4FB9C9',dwg:'#4FB9C9'};
function linkLabel(url){

    const u=new URL(url);
    if(u.hostname==='docs.google.com'){const k=u.pathname.split('/')[1];return {document:'Google Doc',spreadsheets:'Google Sheet',presentation:'Google Slides',forms:'Google Form'}[k]||'Google Docs';}

  // Footer
  if(!RO){
    const ft=h('div','dp-ft');ft.appendChild(h('span','fn','Changes save automatically'));
    const del=h('button','dp-del',isTask?'Delete task':'Delete phase');
    del.addEventListener('click',async()=>{
      if(!await ask(`Delete ${isTask?'task':'phase'} “${obj.name}”?`,'Delete'))return;
      if(isTask){const f=findTask(t.id);if(f)f.p.tasks.splice(f.ti,1);}else{const f=findPhase(p.id);if(f)S.phases.splice(f.pi,1);}
      closeDetails();dpSave(true);
    });
    ft.appendChild(del);dpEl.appendChild(ft);
  }
  body.scrollTop=scroll;
}
// Drop files onto the open panel
['dragenter','dragover'].forEach(ev=>dpEl.addEventListener(ev,e=>{
  if(!dp||RO||!B.addFiles||!e.dataTransfer||![...e.dataTransfer.types].includes('Files'))return;
  e.preventDefault();dpEl.classList.add('dragover');
}));
dpEl.addEventListener('dragleave',e=>{if(!dpEl.contains(e.relatedTarget))dpEl.classList.remove('dragover');});
dpEl.addEventListener('drop',e=>{
  if(!dp||RO)return;e.preventDefault();dpEl.classList.remove('dragover');
  const o=dpObj();if(o&&e.dataTransfer.files.length)addFilesTo(o,e.dataTransfer.files);
});

// ─── Views ────────────────────────────────────────────────────────
function applyView(){
  const board=S.view==='board',byStatus=S.group==='status';
  document.querySelector('.gantt-wrap').hidden=board;
  document.getElementById('board').hidden=!board;
  document.getElementById('group-sw').hidden=!board;
  document.querySelectorAll('#view-sw button').forEach(b=>b.classList.toggle('on',b.dataset.v===(board?'board':'timeline')));
  document.querySelectorAll('#group-sw button').forEach(b=>b.classList.toggle('on',b.dataset.g===(byStatus?'status':'phase')));
  document.getElementById('hint').textContent=!board
    ?'Drag ⋮⋮ to reorder phases and tasks · Drag bars to reschedule · Drag right edge to resize · Click a name to edit · Auto-saves'
    :byStatus?'Drag cards between To do, In progress and Done · Click a task name to rename · Auto-saves'
    :'Drag cards to reorder or move them to another phase · Drag a column by its title to reorder phases · Click a task name to rename · Auto-saves';
}
function renderView(){if(S.view==='board')renderBoard();else renderBody();}
document.querySelectorAll('#view-sw button').forEach(b=>b.addEventListener('click',()=>{S.view=b.dataset.v;saveS();renderAll();}));
document.querySelectorAll('#group-sw button').forEach(b=>b.addEventListener('click',()=>{S.group=b.dataset.g;saveS();renderAll();}));

// Bar drag
document.addEventListener('mousemove',e=>{
  if(!barDrag)return;
  const {pi,ti,type,sx,os,oe,bw}=barDrag;
  const task=S.phases[pi].tasks[ti];
  const dw=bw/DAYS;
  const dd=Math.round((e.clientX-sx)/dw);
  if(Math.abs(e.clientX-sx)>3)barDrag.moved=true;
  const dur=oe-os;
  if(type==='move'){
    const ns=cl(os+dd,0,DAYS-dur-1);
    const ne=ns+dur;
    task.start=ns;task.end=ne;
    barDrag.el.style.left=pct(ns);
    barDrag.el.style.width=`calc(${pct(ne-ns+1)} - 4px)`;
  } else {
    const ne=cl(oe+dd,os,DAYS-1);
    task.end=ne;
    barDrag.el.style.width=`calc(${pct(ne-os+1)} - 4px)`;
  }
});
document.addEventListener('mouseup',()=>{
  if(!barDrag)return;
  const b=barDrag;
  b.el.classList.remove('drag');
  barDrag=null;
  // A click on a bar (no dragging) opens the task's details
  if(!b.moved){openDetails({tid:b.tid});return;}
  saveS();renderBody();renderSummary();
});


// Start date
document.getElementById('start-date').addEventListener('change',e=>{
  if(!e.target.value)return; S.start=e.target.value; saveS(); renderAll();
});
if(!S.start){S.start=isoDay(new Date());saveS();}

// Theme
document.getElementById('theme-btn').addEventListener('click',()=>{
  S.theme=S.theme==='light'?'dark':'light';saveS();applyTheme();
});

// Reset
document.getElementById('btn-reset').addEventListener('click',async()=>{
  if(!await ask('Mark every task as not started?','Reset progress'))return;
  S.phases.forEach(p=>p.tasks.forEach(t=>setStatus(t,'todo')));
  saveS();renderAll();
});

function renderAll(){
  renderLegend();applyView();
  if(S.view==='board')renderBoard();else{renderDaysHdr();renderBody();}
  renderSummary();
}

applyTheme();
renderAll();
</script>
</body>
</html>
