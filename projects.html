<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anium.planning · Projects</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%93%90%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<style id="app-css">
:root{
  --bg:#FFFFFF; --side:#F7F7F5; --surf:#FFFFFF; --surf2:#F1F1EF; --hover:rgba(55,53,47,.06); --press:rgba(55,53,47,.1);
  --bdr:#E9E9E7; --bdr2:#DCDBD8; --txt:#37352F; --muted:#787774; --faint:#A5A29C;
  --acc:#2783DE; --acc-soft:rgba(39,131,222,.1); --ok:#46A171; --ok-soft:rgba(70,161,113,.12); --warn:#C9741F; --warn-soft:rgba(213,128,59,.12); --danger:#E56458;
  --pop:0 0 0 1px rgba(15,15,15,.05),0 3px 6px rgba(15,15,15,.1),0 9px 24px rgba(15,15,15,.2);
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  --sidew:248px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#191919; --side:#202020; --surf:#252525; --surf2:#2C2C2C; --hover:rgba(255,255,255,.055); --press:rgba(255,255,255,.09);
    --bdr:rgba(255,255,255,.09); --bdr2:rgba(255,255,255,.14); --txt:rgba(255,255,255,.88); --muted:rgba(255,255,255,.5); --faint:rgba(255,255,255,.3);
    --acc:#5E9FE8; --acc-soft:rgba(94,159,232,.15); --ok:#5DBB89; --ok-soft:rgba(93,187,137,.15); --warn:#E0A464; --warn-soft:rgba(224,164,100,.14); --danger:#EB7B70;
    --pop:0 0 0 1px rgba(255,255,255,.08),0 3px 6px rgba(0,0,0,.3),0 9px 24px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#191919; --side:#202020; --surf:#252525; --surf2:#2C2C2C; --hover:rgba(255,255,255,.055); --press:rgba(255,255,255,.09);
  --bdr:rgba(255,255,255,.09); --bdr2:rgba(255,255,255,.14); --txt:rgba(255,255,255,.88); --muted:rgba(255,255,255,.5); --faint:rgba(255,255,255,.3);
  --acc:#5E9FE8; --acc-soft:rgba(94,159,232,.15); --ok:#5DBB89; --ok-soft:rgba(93,187,137,.15); --warn:#E0A464; --warn-soft:rgba(224,164,100,.14); --danger:#EB7B70;
  --pop:0 0 0 1px rgba(255,255,255,.08),0 3px 6px rgba(0,0,0,.3),0 9px 24px rgba(0,0,0,.45);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
#app{height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:var(--sidew) minmax(0,1fr);height:100%}
.app.side-closed{grid-template-columns:0 minmax(0,1fr)}
.side{background:var(--side);border-right:1px solid var(--bdr);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.app.side-closed .side{border-right:0}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}

.ws-head{display:flex;align-items:center;gap:6px;padding:12px 10px 8px 12px}
.ws-title{flex:1;min-width:0;border:0;background:transparent;font-weight:600;font-size:14px;padding:4px 6px;border-radius:5px;text-overflow:ellipsis}
.ws-title:not([readonly]):hover{background:var(--hover)}
.ws-title:focus{outline:none;background:var(--surf);box-shadow:0 0 0 1px var(--bdr2)}
.side-sec{padding:6px 8px}
.side-label{font-size:12px;font-weight:500;color:var(--muted);padding:6px 8px 4px;display:flex;align-items:center;justify-content:space-between}
.side-scroll{flex:1;overflow-y:auto;min-height:0}
.proj{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;color:var(--muted);cursor:pointer;position:relative;min-height:30px}
.proj:hover{background:var(--hover);color:var(--txt)}
.proj.on{background:var(--press);color:var(--txt);font-weight:500}
.proj .ico{width:20px;text-align:center;flex-shrink:0;font-size:15px;line-height:1}
.proj .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj .more{opacity:0;border:0;background:transparent;width:22px;height:22px;border-radius:4px;color:var(--muted);display:grid;place-items:center;padding:0}
.proj:hover .more,.proj .more:focus-visible{opacity:1}
.proj .more:hover{background:var(--press)}
.add-proj{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;color:var(--muted);border:0;background:transparent;width:100%;text-align:left}
.add-proj:hover{background:var(--hover);color:var(--txt)}
.side-foot{border-top:1px solid var(--bdr);padding:10px 10px 12px;display:flex;flex-direction:column;gap:10px}
.seg{display:flex;background:var(--surf2);border-radius:7px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:5px;padding:4px 6px;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--surf);color:var(--txt);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.fonts{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.fonts button{border:1px solid var(--bdr);background:var(--surf);border-radius:7px;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:0;color:var(--muted)}
.fonts button .aa{font-size:17px;line-height:1.2;color:var(--txt)}
.fonts button .fl{font-size:10px}
.fonts button.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.meter{font-size:11px;color:var(--muted)}
.meter .bar{height:4px;background:var(--surf2);border-radius:2px;margin-top:4px;overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--muted);border-radius:2px}
.meter.warn .bar i{background:var(--warn)}
.linkbtn{border:0;background:transparent;color:var(--muted);font-size:12px;padding:4px 0;text-align:left;display:flex;align-items:center;gap:6px}
.linkbtn:hover{color:var(--txt)}
.linkbtn svg{width:14px;height:14px;flex-shrink:0}
.mode-note{font-size:11.5px;color:var(--muted);line-height:1.45}

/* ---------- Top bar ---------- */
.topbar{display:flex;align-items:center;gap:8px;padding:10px 14px 6px 10px;min-height:52px}
.icon-btn{border:0;background:transparent;width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--muted);flex-shrink:0;padding:0}
.icon-btn:hover{background:var(--hover);color:var(--txt)}
.icon-btn svg{width:17px;height:17px}
.p-ico{font-size:22px;line-height:1;border:0;background:transparent;border-radius:6px;width:36px;height:36px;display:grid;place-items:center;flex-shrink:0;padding:0}
.p-ico:not(:disabled):hover{background:var(--hover)}
.p-ico:disabled{cursor:default}
.p-name{flex:1;min-width:60px;border:0;background:transparent;font-size:20px;font-weight:650;letter-spacing:-.015em;padding:3px 6px;border-radius:6px;text-overflow:ellipsis}
.p-name:not([readonly]):hover{background:var(--hover)}
.p-name:focus{outline:none;background:var(--hover)}
.top-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.edited{font-size:12px;color:var(--faint);white-space:nowrap;margin-right:4px}
.btn{border:1px solid var(--bdr);background:var(--surf);border-radius:7px;padding:5px 11px;font-size:13px;color:var(--txt);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--hover);color:var(--txt)}
.btn.ghost.on{background:var(--press);color:var(--txt)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:500}
.btn.primary:hover{filter:brightness(1.07);background:var(--acc)}
.btn.primary:disabled{opacity:.55;cursor:default;filter:none}
.btn.danger{color:var(--danger)}
.save-btn .dot{width:7px;height:7px;border-radius:50%;background:#fff;opacity:.9}
.save-btn.clean{background:transparent;border-color:var(--bdr);color:var(--muted);font-weight:400}
.save-btn.clean:hover{background:var(--hover);filter:none}
.pill{font-size:12px;padding:3px 9px;border-radius:20px;background:var(--surf2);color:var(--muted);white-space:nowrap}
.pill.local{background:var(--warn-soft);color:var(--warn)}

.tabs{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--bdr);overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:7px 10px 8px;font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:7px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;border-radius:6px 6px 0 0}
.tab:hover{color:var(--txt);background:var(--hover)}
a.tab{text-decoration:none}
.tab-sep{width:1px;background:var(--bdr);margin:8px 6px;flex-shrink:0}
.tab.on{color:var(--txt);border-bottom-color:var(--txt);font-weight:500}
.tab svg{width:15px;height:15px}
.tab .dirty{width:6px;height:6px;border-radius:50%;background:var(--warn)}

.banner{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--warn-soft);color:var(--txt);font-size:13px;border-bottom:1px solid var(--bdr);flex-wrap:wrap}
.banner .grow{flex:1;min-width:200px}

/* ---------- Stage ---------- */
.stage{flex:1;display:flex;min-height:0;position:relative}
.view{flex:1;position:relative;min-width:0;min-height:0}
.frame{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:var(--bg)}
.native{position:absolute;inset:0;overflow:auto}

.drawer{width:330px;flex-shrink:0;border-left:1px solid var(--bdr);background:var(--bg);display:flex;flex-direction:column;min-height:0}
.drawer-h{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 10px 16px;border-bottom:1px solid var(--bdr)}
.drawer-h h3{margin:0;font-size:14px;font-weight:600}
.drawer-b{flex:1;overflow-y:auto;padding:8px 8px 20px}
.drawer-note{font-size:12.5px;color:var(--muted);padding:8px 8px 12px}
.ver{padding:9px 10px;border-radius:7px;display:flex;flex-direction:column;gap:2px}
.ver:hover{background:var(--hover)}
.ver .vt{font-size:13px;font-weight:500;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ver .vs{font-size:12.5px;color:var(--muted)}
.ver .vr{border:0;background:transparent;color:var(--acc);font-size:12px;padding:0}
.ver .vr:hover{text-decoration:underline}
.ver.cur{background:var(--acc-soft)}
.ver-day{font-size:11.5px;color:var(--faint);padding:12px 10px 4px;font-weight:500}

.info-img{margin:6px 8px 12px;border-radius:8px;overflow:hidden;border:1px solid var(--bdr);background:var(--surf2)}
.info-img img{display:block;width:100%;max-height:260px;object-fit:contain}
.kv{display:grid;grid-template-columns:84px 1fr;gap:6px 10px;padding:0 10px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.field-label{font-size:12px;color:var(--muted);padding:6px 10px 4px}
.ta{width:100%;border:1px solid var(--bdr);background:var(--surf);border-radius:7px;padding:8px 10px;resize:vertical;min-height:64px;line-height:1.45}
.ta:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-soft)}
.ta[readonly]{background:var(--surf2)}
.events{list-style:none;margin:0;padding:0 10px}
.events li{font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;gap:10px}
.events li span:last-child{color:var(--faint);white-space:nowrap}

/* ---------- Narrow scope ---------- */
.scope{padding:20px 24px 40px;min-width:min-content}
.scope-intro{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:16px;max-width:1400px}
.scope-intro h2{margin:0 0 2px;font-size:16px;font-weight:600}
.scope-intro p{margin:0;color:var(--muted);font-size:13px;max-width:60ch}
.crit-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:20px}
.crit-bar .lbl{font-size:12.5px;color:var(--muted);margin-right:4px}
.chip{display:inline-flex;align-items:center;border:1px solid var(--bdr);background:var(--surf);border-radius:6px;height:28px;padding:0 2px 0 0}
.chip input{border:0;background:transparent;padding:0 8px;height:100%;font-size:13px;min-width:40px;outline:none;field-sizing:content;max-width:220px}
.chip input:focus{background:var(--acc-soft);border-radius:5px 0 0 5px}
.chip button{border:0;background:transparent;width:22px;height:22px;border-radius:4px;color:var(--faint);display:grid;place-items:center;padding:0;font-size:15px;line-height:1}
.chip button:hover{background:var(--hover);color:var(--danger)}
.add-chip{border:1px dashed var(--bdr2);background:transparent;border-radius:6px;height:28px;padding:0 10px;font-size:13px;color:var(--muted)}
.add-chip:hover{color:var(--txt);border-color:var(--muted)}

.opts{display:flex;gap:16px;align-items:flex-start;padding-bottom:8px}
.opt{width:330px;flex-shrink:0;background:var(--surf);border:1px solid var(--bdr);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.opt.lead{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.opt-img{aspect-ratio:4/3;background:var(--surf2);position:relative;display:grid;place-items:center;overflow:hidden}

.opt-img .pick{border:1px dashed var(--bdr2);background:transparent;border-radius:8px;padding:10px 14px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:6px;max-width:80%}
.opt-img .pick:hover{color:var(--txt);border-color:var(--muted)}
.opt-img .pick svg{width:22px;height:22px}
.opt-img .over{position:absolute;right:8px;top:8px;display:flex;gap:4px;opacity:0;transition:opacity .12s}
.opt-img:hover .over,.opt-img:focus-within .over{opacity:1}
.opt-img .over button{border:0;background:rgba(15,15,15,.62);color:#fff;font-size:12px;padding:4px 9px;border-radius:6px;backdrop-filter:blur(4px)}
.opt-img .over button:hover{background:rgba(15,15,15,.8)}
.opt-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px}
.opt-title{border:0;background:transparent;font-size:16px;font-weight:600;padding:2px 4px;margin:0 -4px;border-radius:5px;width:calc(100% + 8px)}
.opt-title:not([readonly]):hover{background:var(--hover)}
.opt-title:focus{outline:none;background:var(--hover)}
.score{display:flex;align-items:center;gap:10px}
.score .num{font-size:24px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;min-width:52px}
.score .of{font-size:12px;color:var(--muted);font-weight:400}
.score .meter2{flex:1;height:6px;border-radius:3px;background:var(--surf2);overflow:hidden}
.score .meter2 i{display:block;height:100%;background:var(--acc);border-radius:3px}
.opt.lead .score .meter2 i{background:var(--ok)}
.lead-tag{font-size:11.5px;font-weight:500;color:var(--ok);background:var(--ok-soft);padding:2px 8px;border-radius:10px;white-space:nowrap}
.score-sub{font-size:12px;color:var(--muted);margin-top:-8px}
.rates{display:flex;flex-direction:column;gap:7px}
.rate{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}
.rate .rn{font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:flex;gap:3px}
.dots button{width:24px;height:20px;border:0;border-radius:4px;background:var(--surf2);padding:0;font-size:10.5px;color:transparent;font-variant-numeric:tabular-nums}
.dots button.f{background:var(--acc)}
.dots:not(.ro) button:hover{color:var(--muted);box-shadow:inset 0 0 0 1px var(--bdr2)}
.dots button.f:hover{color:#fff}
.dots.ro button{cursor:default}
.opt .ta{min-height:72px;font-size:13px}
.opt-foot{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--faint);padding-top:2px}
.opt-foot button{border:0;background:transparent;color:var(--faint);font-size:12px;padding:2px 6px;border-radius:4px}
.opt-foot button:hover{color:var(--danger);background:var(--hover)}
.add-opt{width:220px;flex-shrink:0;align-self:stretch;min-height:240px;border:1px dashed var(--bdr2);border-radius:12px;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:13.5px}
.add-opt:hover{color:var(--txt);border-color:var(--muted);background:var(--hover)}
.add-opt svg{width:22px;height:22px}

/* ---------- Notes ---------- */
.notes{display:grid;grid-template-columns:250px minmax(0,1fr);height:100%}
.n-list{border-right:1px solid var(--bdr);display:flex;flex-direction:column;min-height:0}
.n-list-h{display:flex;align-items:center;justify-content:space-between;padding:12px 10px 8px 14px}
.n-list-h span{font-size:12.5px;color:var(--muted);font-weight:500}
.n-items{flex:1;overflow-y:auto;padding:0 6px 16px}
.n-item{padding:8px 10px;border-radius:7px;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.n-item:hover{background:var(--hover)}
.n-item.on{background:var(--press)}
.n-item .t{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-item .t.untitled{color:var(--faint)}
.n-item .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-item .d{font-size:11px;color:var(--faint)}
.n-edit{overflow-y:auto;min-height:0}
.n-doc{max-width:760px;margin:0 auto;padding:36px 40px 80px}
.n-meta{font-size:12px;color:var(--faint);margin-bottom:6px;display:flex;gap:14px;flex-wrap:wrap}
.n-title{width:100%;border:0;background:transparent;font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.2;padding:0;margin:0 0 10px;outline:none}
.n-title::placeholder{color:var(--faint)}
.n-tools{display:flex;gap:2px;margin:0 0 10px -6px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);padding:4px 0;z-index:1}
.n-tools button{border:0;background:transparent;height:28px;min-width:28px;padding:0 7px;border-radius:5px;color:var(--muted);font-size:13px;display:grid;place-items:center}
.n-tools button:hover{background:var(--hover);color:var(--txt)}
.n-tools .sep{width:1px;background:var(--bdr);margin:5px 4px}
.n-body{outline:none;min-height:50vh;font-size:15px;line-height:1.65}
.n-body:empty::before{content:attr(data-ph);color:var(--faint)}
.n-body h1{font-size:24px;margin:22px 0 6px;line-height:1.3}
.n-body h2{font-size:19px;margin:18px 0 4px;line-height:1.35}
.n-body h3{font-size:16px;margin:14px 0 2px}
.n-body p,.n-body div{margin:0}
.n-body ul,.n-body ol{margin:4px 0;padding-left:24px}
.n-body blockquote{margin:6px 0;padding:2px 14px;border-left:3px solid var(--txt)}
.n-delete{border:0;background:transparent;color:var(--faint);font-size:12px;padding:0}
.n-delete:hover{color:var(--danger)}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;height:100%;color:var(--muted);text-align:center;padding:40px;font-size:14px}
.empty strong{color:var(--txt);font-size:15px;font-weight:600}

/* ---------- Popovers / modals / toast ---------- */
.pop{position:fixed;z-index:200;background:var(--surf);border-radius:9px;box-shadow:var(--pop);padding:5px;min-width:180px}
.pop .mi{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:6px 9px;border-radius:5px;font-size:13.5px;text-align:left}
.pop .mi:hover{background:var(--hover)}
.pop .mi.danger{color:var(--danger)}
.emoji-grid{display:grid;grid-template-columns:repeat(8,32px);gap:2px;padding:4px}

.scrim{position:fixed;inset:0;z-index:150;background:rgba(15,15,15,.45);display:grid;place-items:center;padding:24px}

.modal-h{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 12px 18px;border-bottom:1px solid var(--bdr)}

.modal-b{overflow-y:auto;padding:16px 18px 20px}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pick-grid button{border:1px solid var(--bdr);background:var(--surf);border-radius:9px;padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.pick-grid button:hover{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.pick-grid img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--surf2)}
.pick-grid span{font-size:11.5px;color:var(--muted);padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:300;box-shadow:var(--pop);max-width:min(520px,90vw);text-align:center}

@media (max-width:820px){
  .app,.app.side-closed{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:120;transform:translateX(-102%);transition:transform .18s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .app.side-open .side{transform:none;box-shadow:var(--pop)}
  .drawer{position:fixed;right:0;top:0;bottom:0;z-index:110;width:min(340px,92vw);box-shadow:var(--pop);padding-top:env(safe-area-inset-top,0px)}
  .edited{display:none}
  .p-name{font-size:17px}
  .notes{grid-template-columns:minmax(0,1fr)}
  .notes.has-open .n-list{display:none}
  .notes:not(.has-open) .n-edit{display:none}
  .n-doc{padding:20px 18px 60px}
  .scope{padding:16px}
  .opt{width:290px}
  .hide-sm{display:none!important}
}
@media (min-width:821px){ .show-sm{display:none!important} }
.drawer[hidden]{display:none!important}
.modal.confirm{width:min(420px,100%)}
.confirm-msg{margin:0 0 18px;font-size:14px;line-height:1.5}
.confirm-btns{display:flex;justify-content:flex-end;gap:8px}

/* ---------- v2: standalone app ---------- */
.app.solo,.app.solo.side-closed{grid-template-columns:minmax(0,1fr)}
.faint{color:var(--faint);font-size:13px}
.muted{color:var(--muted);font-size:13px;margin:4px 0 0;line-height:1.5}
.small{font-size:12px}
.empty.full{height:100%}
.empty.loading{position:absolute;inset:0;background:var(--bg);z-index:2}
.empty.loading[hidden],.err[hidden]{display:none}
.banner.info{background:var(--acc-soft)}
.appearance{display:flex;flex-direction:column;gap:8px}
.storage{display:flex;flex-direction:column;gap:6px}
.drive-on{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}

.drive-on a:hover{text-decoration:underline}

.drive-btn{justify-content:center;width:100%}
.status{font-size:12px;color:var(--faint);white-space:nowrap;padding:0 4px}

.status.offline{color:var(--warn)}

.shared-dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex-shrink:0}

/* picture figure (crop + markup) */
.fig{position:relative;overflow:hidden;aspect-ratio:4/3;background:var(--surf2)}
.fig img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%;display:block;user-select:none;-webkit-user-drag:none}
.fig .marks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transform-origin:50% 50%;overflow:visible}
.opt-img .fig{position:absolute;inset:0;aspect-ratio:auto}

.modal.wide{width:min(980px,100%);max-height:min(860px,94vh)}
.ed{display:flex;flex-direction:column;gap:12px}
.ed-bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}

.ed-tool{border:0;background:transparent;height:32px;padding:0 9px;border-radius:7px;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.ed-tool svg{width:16px;height:16px}
.ed-tool:hover{background:var(--hover);color:var(--txt)}
.ed-tool.on{background:var(--acc-soft);color:var(--acc)}

.sw.on{outline:2px solid var(--acc);outline-offset:2px}

.wbtn:hover{background:var(--hover)}
.wbtn.on{background:var(--acc-soft)}
.ed-stage{width:100%;border-radius:8px;border:1px solid var(--bdr)}
.ed-hit{position:absolute;inset:0;touch-action:none;cursor:crosshair;z-index:2}
.ed-stage[data-tool="move"] .ed-hit{cursor:grab}
.ed-stage[data-tool="move"] .ed-hit:active{cursor:grabbing}
.ed-stage[data-tool="text"] .ed-hit{cursor:text}
.ed-text{position:absolute;z-index:3;transform:translate(-2px,-50%);border:1px solid var(--acc);background:rgba(255,255,255,.95);border-radius:5px;padding:3px 7px;font-weight:700;font-size:15px;min-width:140px;outline:none;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.ed-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ed-zoom{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.ed-zoom[hidden]{display:none}
.ed-zoom input{width:160px;accent-color:var(--acc)}

/* share + picker */
.share{display:flex;flex-direction:column;gap:18px;max-width:560px}
.share-sec h4{margin:0 0 6px;font-size:13.5px;font-weight:600}
.share-sec+.share-sec{border-top:1px solid var(--bdr);padding-top:16px}
.share-sec .btn{margin-top:10px}
.share-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:6px 0}
.switch{width:40px;height:24px;border-radius:12px;border:0;background:var(--bdr2);position:relative;flex-shrink:0;padding:0;transition:background .15s}
.switch i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch.on{background:var(--ok)}
.switch.on i{transform:translateX(16px)}
.switch:disabled{opacity:.6}
.link-row,.add-row{display:flex;gap:8px;margin-top:10px;align-items:center}
.link-row .btn,.add-row .btn{margin-top:0}
.link-in{flex:1;min-width:0;border:1px solid var(--bdr);background:var(--surf);border-radius:7px;padding:7px 10px;font-size:13px}
.link-in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-soft)}
.add-row{margin:0 0 6px}
.err{font-size:12.5px;color:var(--danger);background:rgba(229,100,88,.1);border-radius:7px;padding:8px 10px;margin:4px 0 8px}
.modal .pick-grid{margin-top:12px}
@media (max-width:820px){ .ed-group{border-right:0;padding-right:0} .add-row{flex-wrap:wrap} }
.ed-stage{width:min(100%, calc((94vh - 230px) * 4 / 3));align-self:center;flex-shrink:0}
/* Progress for Google (status report + slides) */
.rep-pop{width:340px;padding:8px}
.rep-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:4px 6px 8px}
.rep-item{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:7px}
.rep-item:hover{background:var(--hover)}
.rep-tx{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.rep-tx strong{font-size:13.5px;font-weight:600}
.rep-tx span{font-size:12px;color:var(--muted);line-height:1.4}
.rep-tip{font-size:12px;color:var(--muted);line-height:1.45;padding:10px 8px 4px;border-top:1px solid var(--bdr);margin-top:4px}
.rep-row{display:flex;gap:8px;flex-wrap:wrap;padding:8px}

ex; align-items:center; gap:4px; background:var(--surf); border:1px solid var(--bdr); border-radius:10px; padding:5px 8px; z-index:1000; box-shadow:0 2px 8px var(--shadow2); }\n.zbtn { width:26px; height:26px; border:none; background:transparent; color:var(--muted); cursor:pointer; border-radius:6px; font-size:16px; display:flex; align-items:center; justify-content:center; transition:all .12s; }\n.zbtn:hover { background:var(--surf2); color:var(--txt); }\n#zoom-pct { font-size:11px; font-weight:600; color:var(--muted); min-width:38px; text-align:center; font-family:inherit; }\n\n/* Expand indicator */\n#expand-badge { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--surf); border:1px solid var(--bdr); border-radius:8px; padding:5px 12px; font-size:11px; color:var(--muted); z-index:1000; pointer-events:none; opacity:0; transition:opacity .4s; }\n#expand-badge.show { opacity:1; }\n\n/* Hint */\n#hint { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); color:var(--muted); font-size:11px; pointer-events:none; z-index:1000; letter-spacing:.02em; opacity:.7; }\n\n/* Saved badge */\n#saved { position:fixed; bottom:22px; left:22px; background:rgba(70,161,113,.12); border:1px solid rgba(70,161,113,.3); color:#46A171; font-size:11px; font-weight:600; padding:5px 10px; border-radius:6px; z-index:1000; opacity:0; transition:opacity .3s; pointer-events:none; }\n#saved.show { opacity:1; }\n\n/* Drop overlay */\n#drop-ov { display:none; position:fixed; inset:0; background:rgba(39,131,222,.08); border:2px dashed rgba(39,131,222,.5); z-index:500; pointer-events:none; align-items:center; justify-content:center; color:rgba(39,131,222,.8); font-size:18px; font-weight:500; gap:10px; flex-direction:column; }\n#drop-ov.on { display:flex; }\n\n/* Cards */\n.card { position:absolute; cursor:grab; border-radius:8px; box-shadow:0 2px 12px var(--shadow2),0 1px 3px var(--shadow2); transition:box-shadow .15s; }\n.card:hover { box-shadow:0 6px 2 center; }\n.lc span { font-size:12px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; cursor:text; outline:none; white-space:nowrap; }\n\n/* Context menu */\n#ctx { display:none; position:fixed; background:var(--surf); border:1px solid var(--bdr); border-radius:10px; padding:5px; z-index:5000; box-shadow:0 8px 24px var(--shadow),0 2px 8px var(--shadow2); min-width:160px; }\n#ctx.open { display:block; }\n.cm-item { padding:7px 12px; font-size:12.5px; color:var(--txt); cursor:pointer; border-radius:6px; display:flex; align-items:center; gap:8px; transition:background .1s; }\n.cm-item:hover { background:var(--surf2); }\n.cm-sep { height:1px; background:var(--bdr); margin:4px 0; }\n.cm-item.danger { color:#E56458; }\n.cm-colors { display:flex; gap:5px; padding:5px 12px 7px; flex-wrap:wrap; }\n.cm-sw { width:20px; height:20px; border-radius:50%; cursor:pointer; border:2px solid transparent; transition:all .12s; flex-shrink:0; }\n.cm-sw:hover,.cm-sw.act { border-color:#fff; transform:scale(1.2); }\nbody:not(.dark) .cm-sw:hover, body:not(.dark) .cm-sw.act { border-color:#2C2C2B; }\n\n/* Modals */\n.mo { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:4000; align-items:center; justify-content:center; backdrop-filter:blur(3px); }\n.mo.open { display:flex; }\n.md { background:var(--surf); border:1px solid var(--bdr); border-radius:14px; padding:22px; width:360px; box-shadow:0 16px 48px var(--shadow); }\n.md h3 { font-size:14px; font-weight:600; margin-bottom:12px; }\n.md input { width:100%; background:var(--surf2); border:1px solid var(--bdr); border-radius:8px; padding:9px 12px; color:var(--txt); font-size:13px; outline:none; margin-bottom:12px; font-family:inherit; transition:border-color .15s; }\n.md input:focus { border-color:var(--acc); }\n.md input::placeholder { color:var(--muted); }\n.md-btns { display:flex; gap:8px; justify-content:flex-end; }\n.mdbtn { padding:7px 14px; border-radius:8px; border:1px solid var(--bdr); background:var(--surf2); color:var(--muted); font-size:12px; font-weight:500; cursor:pointer; transition:all .15s; font-family:inherit; }\n.mdbtn:hover { color:var(--txt); }\n.mdbtn.p { background:var(--acc); border-color:var(--acc); color:#fff; }\n.mdbtn.p:hover { filter:brightness(1.1); }\n.md-colors { display:flex; gap:7px; margin-bottom:12px; flex-wrap:wrap; }\n.md-sw { width:24px; height:24px; border-radius:50%; cursor:pointer; border:2px solid transparent; transition:all .12s; }\n.md-sw.act { border-color:var(--txt); transform:scale(1.15); }\n\u003c/style>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap\">\u003cstyle>#btn-theme,#theme-btn,#saved{display:none!important}\u003c/style>\u003c/head>\n\u003cbody>\n\u003cdiv id=\"canvas\">\n  \u003cdiv id=\"world\">\u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"toolbar\">\n  \u003cbutton class=\"tbtn\" id=\"btn-note\">\n    \u003csvg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\">\u003crect x=\"2\" y=\"2\" width=\"12\" height=\"12\" rx=\"2\"/>\u003cline x1=\"5\" y1=\"6\" x2=\"11\" y2=\"6\"/>\u003cline x1=\"5\" y1=\"9\" x2=\"9\" y2=\"9\"/>\u003c/svg>Note\n  \u003c/button>\n  \u003cdiv class=\"div\">\u003c/div>\n  \u003cbutton class=\"tbtn\" id=\"btn-img\">\n    \u003csvg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\">\u003crect x=\"2\" y=\"3\" width=\"12\" height=\"10\" rx=\"2\"/>\u003ccircle cx=\"6\" cy=\"7\" r=\"1.2\"/>\u003cpath d=\"M2 11l3-3 2.5 2.5L10 8l4 4\"/>\u003c/svg>Image\n  \u003c/button>\n  \u003cdiv class=\"div\">\u003c/div>\n  \u003cbutton class=\"tbtn\" id=\"btn-lbl\">\n    \u003csvg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\">\u003cpath d=\"M3 8h10M9 5l4 3-4 3\"/>\u003c/svg>Label\n  \u003c/button>\n  \u003cdiv class=\"div\">\u003c/div>\n  \u003cbutton class=\"tbtn\" id=\"btn-expand\" title=\"Add 2000px of canvas space downward\">\n    \u003csvg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\">\u003cline x1=\"8\" y1=\"3\" x2=\"8\" y2=\"13\"/>\u003cpolyline points=\"5,10 8,13 11,10\"/>\u003cline x1=\"3\" y1=\"15\" x2=\"13\" y2=\"15\"/>\u003c/svg>Expand ↓\n  \u003c/button>\n  \u003cdiv class=\"div\">\u003c/div>\n  \u003cbutton class=\"tbtn\" id=\"btn-undo\" title=\"Undo (Ctrl+Z)\">\n    \u003csvg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\">\u003cpath d=\"M3 8a5 5 0 1 1 1.5 3.5\"/>\u003cpolyline points=\"3,5 3,8 6,8\"/>\u003c/svg>Undo\n  \u003c/button>\n  \u003cdiv class=\"div\">\u003c/div>\n  \u003cbutton class=\"tbtn\" id=\"btn-theme\">\n    \u003csvg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\">\u003ccircle cx=\"8\" cy=\"8\" r=\"5\"/>\u003cpath d=\"M8 3v10M3 8h10\" opacity=\".4\"/>\u003c/svg>\u003cspan id=\"theme-lbl\">Dark\u003c/span>\n  \u003c/button>\n  \u003cdiv class=\"div\">\u003c/div>\n  \u003cbutton class=\"tbtn\" id=\"btn-clear\" style=\"color:#E56458\">\n    \u003csvg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\">\u003cpath d=\"M3 3l10 10M13 3L3 13\"/>\u003c/svg>Clear\n  \u003c/button>\n\u003c/div>\n\n\u003cdiv id=\"zoom-ctrl\">\n  \u003cbutton class=\"zbtn\" id=\"z-out\" title=\"Zoom out\">&#x2212;\u003c/button>\n  \u003cspan id=\"zoom-pct\">100%\u003c/span>\n  \u003cbutton class=\"zbtn\" id=\"z-in\" title=\"Zoom in\">&#x2b;\u003c/button>\n  \u003cbutton class=\"zbtn\" id=\"z-fit\" title=\"Reset view\" style=\"font-size:11px;width:auto;padding:0 4px\">&#x2b3b;\u003c/button>\n\u003c/div>\n\n\u003cdiv id=\"hint\">Space+drag to pan · Scroll to zoom · Right-click cards · Del to delete · Ctrl+D duplicate · Expand ↓ adds canvas space\u003c/div>\n\u003cdiv id=\"saved\">✓ Saved\u003c/div>\n\u003cdiv id=\"expand-badge\" aria-live=\"polite\">\u003c/div>\n\u003cdiv id=\"drop-ov\">\n  \u003csvg width=\"36\" height=\"36\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\">\u003crect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/>\u003ccircle cx=\"8.5\" cy=\"8.5\" r=\"1.5\"/>\u003cpath d=\"M3 15l5-5 4 4 3-3 6 6\"/>\u003c/svg>\n  Drop image here\n\u003c/div>\n\n\u003c!-- Context menu -->\n\u003cdiv id=\"ctx\">\n  \u003cdiv class=\"cm-item\" id=\"cm-color-label\" style=\"font-size:11px;color:var(--muted);padding-bottom:2px;cursor:default\">Color\u003c/div>\n  \u003cdiv class=\"cm-colors\" id=\"cm-colors\">\u003c/div>\n  \u003cdiv class=\"cm-sep\">\u003c/div>\n  \u003cdiv class=\"cm-item\" id=\"cm-dup\">🗂 Duplicate\u003c/div>\n  \u003cdiv class=\"cm-item\" id=\"cm-front\">⬆ Bring to front\u003c/div>\n  \u003cdiv class=\"cm-item\" id=\"cm-back\">⬇ Send to back\u003c/div>\n  \u003cdiv class=\"cm-sep\">\u003c/div>\n  \u003cdiv class=\"cm-item danger\" id=\"cm-del\">🗑 Delete\u003c/div>\n\u003c/div>\n\n\u003c!-- Image URL modal -->\n\u003cdiv class=\"mo\" id=\"img-modal\">\n  \u003cdiv class=\"md\">\n    \u003ch3>Add Image\u003c/h3>\n    \u003cinput id=\"img-url\" type=\"text\" placeholder=\"Paste image URL or web address…\" />\n    \u003cdiv class=\"md-btns\">\n      \u003cbutton class=\"mdbtn\" id=\"img-cancel\">Cancel\u003c/button>\n      \u003cbutton class=\"mdbtn p\" id=\"img-ok\">Add\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- Note modal -->\n\u003cdiv class=\"mo\" id=\"note-modal\">\n  \u003cdiv class=\"md\">\n    \u003ch3>Add Note\u003c/h3>\n    \u003cdiv class=\"md-colors\" id=\"note-colors\">\u003c/div>\n    \u003cinput id=\"note-text\" type=\"text\" placeholder=\"Note text (optional, can type later)…\" />\n    \u003cdiv class=\"md-btns\">\n      \u003cbutton class=\"mdbtn\" id=\"note-cancel\">Cancel\u003c/button>\n      \u003cbutton class=\"mdbtn p\" id=\"note-ok\">Add\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript>window.__WS_INIT=/*__WS_INIT__*/null;\u003c/script>\u003cscript>(function(){\n  // Workspace bridge: connects this embedded template to the workspace app.\n  // Replaces the template's localStorage with the workspace's shared save,\n  // and lets the app control theme and font. The template code is otherwise untouched.\n  var I = window.__WS_INIT || {};\n  function post(m){ m.__ws = 1; m.mod = I.mod; try { window.parent.postMessage(m, '*'); } catch(e){} }\n\n  var waiting = {}, seq = 0;\n  window.__bridge = {\n    load: function(){ return I.data ? JSON.stringify(I.data) : null; },\n    save: function(o){ post({ type:'save', data: JSON.parse(JSON.stringify(o)) }); },\n    readOnly: !!I.readOnly,\n    // Attachments: the app stores the files (in Google Drive when connected) and hands back their details.\n    addFiles: function(files){\n      return new Promise(function(resolve){ var id = ++seq; waiting[id] = resolve; post({ type:'file-add', reqId: id, files: Array.prototype.slice.call(files) }); });\n    },\n    openFile: function(id){ post({ type:'file-open', id: id }); }\n  };\n\n  function setFont(f){\n    var s = document.getElementById('__ws_font');\n    if(!s){ s = document.createElement('style'); s.id = '__ws_font'; (document.head || document.documentElement).appendChild(s); }\n    s.textContent = 'body,body input,body textarea,body button,body select{font-family:' + f + ' !important}';\n  }\n  function setTheme(dark){\n    try {\n      if(I.mod === 'gantt'){ S.theme = dark ? 'dark' : 'light'; applyTheme(); }\n      else if(I.mod === 'moodboard'){\n        S.theme = dark ? 'dark' : 'light';\n        document.body.classList.toggle('dark', dark);\n        var l = document.getElementById('theme-lbl'); if(l) l.textContent = dark ? 'Light' : 'Dark';\n        world.querySelectorAll('.card.nc').forEach(function(c){ applyNoteColor(c, parseInt(c.dataset.ci || '0')); });\n        updateTransform();\n      }\n    } catch(e){}\n  }\n\n  setFont(I.font || 'inherit');\n  window.addEventListener('message', function(e){\n    var m = e.data; if(!m || !m.__wsParent) return;\n    if(m.type === 'theme') setTheme(!!m.dark);\n    if(m.type === 'font') setFont(m.font);\n    if(m.type === 'file-added' && waiting[m.reqId]){ waiting[m.reqId](m.items || []); delete waiting[m.reqId]; }\n    // The app saved its own copy of a web picture: show the copy instead of the link.\n    if(m.type === 'img-swap') document.querySelectorAll('img').forEach(function(i){ if(i.getAttribute('src') === m.from) i.setAttribute('src', m.to); });\n    // The app couldn't get a picture from that address: drop a card that was just added, otherwise mark it.\n    if(m.type === 'img-failed') document.querySelectorAll('.card img').forEach(function(i){\n      if(i.getAttribute('src') !== m.from) return;\n      var card = i.closest('.card');\n      if(m.remove){ card.remove(); try { save(); } catch(e){} }\n      else { card.classList.remove('ws-pending'); card.classList.add('ws-missing'); }\n    });\n  });\n  document.addEventListener('DOMContentLoaded', function(){ setTheme(!!I.dark); });\n  document.addEventListener('keydown', function(e){\n    if((e.metaKey || e.ctrlKey) && (e.key === 's' || e.key === 'S')){ e.preventDefault(); post({ type:'save-shortcut' }); }\n  }, true);\n\n  if(I.mod === 'moodboard'){\n    // When a web picture doesn't load, the template would remove it from its card, and the next save\n    // would then lose the picture for good. Catch the error first (this runs before the template's own\n    // handler) and show \"Getting picture…\" while the app saves its own copy.\n    var st = document.createElement('style');\n    st.textContent = '.card.ws-pending img,.card.ws-missing img{visibility:hidden}'\n      + '.card.ws-pending::after,.card.ws-missing::after{position:absolute;inset:0;display:grid;place-items:center;padding:12px;text-align:center;font-size:12px;line-height:1.4;color:#8a8a8a;pointer-events:none}'\n      + '.card.ws-pending::after{content:\"Getting picture…\"}.card.ws-missing::after{content:\"This picture couldn’t be loaded. Drag the file in again.\"}';\n    (document.head || document.documentElement).appendChild(st);\n    document.addEventListener('error', function(e){\n      var t = e.target, card = t && t.tagName === 'IMG' && t.closest && t.closest('.card');\n      if(!card) return;\n      e.stopPropagation();\n      var src = t.getAttribute('src') || '', web = /^https?:/i.test(src);\n      if(!card.classList.contains('ws-missing')) card.classList.add(web ? 'ws-pending' : 'ws-missing');\n    }, true);\n    document.addEventListener('load', function(e){\n      var t = e.target, card = t && t.tagName === 'IMG' && t.closest && t.closest('.card');\n      if(card) card.classList.remove('ws-pending', 'ws-missing');\n    }, true);\n    function addFiles(files, pos){\n      files.filter(function(f){ return f.type.indexOf('image/') === 0; }).forEach(function(f, i){\n        var r = new FileReader();\n        r.onload = function(ev){\n          var o = { src: ev.target.result, w: 240, h: 200 };\n          if(pos) o.pos = { x: pos.x + i * 30, y: pos.y + i * 30 };\n          makeCard('image', o);\n        };\n        r.readAsDataURL(f);\n      });\n    }\n    var fileIn = document.createElement('input');\n    fileIn.type = 'file'; fileIn.accept = 'image/*'; fileIn.multiple = true; fileIn.style.display = 'none';\n    fileIn.addEventListener('change', function(){\n      var files = Array.prototype.slice.call(fileIn.files || []);\n      var cancel = document.getElementById('img-cancel'); if(cancel) cancel.click();\n      addFiles(files); fileIn.value = '';\n    });\n    document.addEventListener('DOMContentLoaded', function(){\n      document.body.appendChild(fileIn);\n      // \"Upload from computer\" inside the existing Add Image dialog\n      var url = document.getElementById('img-url');\n      if(url){\n        var up = document.createElement('button');\n        up.type = 'button'; up.className = 'mdbtn p'; up.textContent = 'Upload from computer…';\n        up.style.cssText = 'width:100%;padding:10px;font-size:13px;margin-bottom:10px;display:block';\n        up.addEventListener('click', function(){ fileIn.click(); });\n        var tip = document.createElement('div');\n        tip.textContent = 'Paste a picture’s address, or right-click a picture → Copy image and paste it in the box (Ctrl/⌘+V).';\n        tip.style.cssText = 'font-size:11.5px;color:var(--muted);line-height:1.45;margin:10px 0 2px';\n        url.parentNode.insertBefore(up, url);\n        url.parentNode.insertBefore(tip, url.nextSibling);\n        url.placeholder = 'Paste a copied picture or image address…';\n        var err = document.createElement('div');\n        err.style.cssText = 'display:none;font-size:12px;line-height:1.45;color:#E56458;background:rgba(229,100,88,.1);border-radius:7px;padding:8px 10px;margin-top:8px';\n        url.parentNode.insertBefore(err, url.nextSibling);\n        var showErr = function(t){ err.textContent = t; err.style.display = t ? 'block' : 'none'; };\n        url.addEventListener('input', function(){ showErr(''); });\n        // Paste the picture itself into the box\n        url.addEventListener('paste', function(e){\n          var files = Array.prototype.slice.call((e.clipboardData && e.clipboardData.files) || []).filter(function(f){ return f.type.indexOf('image/') === 0; });\n          if(!files.length) return;\n          e.preventDefault(); showErr('');\n          var cancel = document.getElementById('img-cancel'); if(cancel) cancel.click();\n          addFiles(files);\n        });\n        // Picture or page addresses (e.g. a Pinterest pin) go straight in: the app fetches and keeps its own copy.\n        var modal = document.getElementById('img-modal');\n        if(modal) new MutationObserver(function(){ if(!modal.classList.contains('open')) showErr(''); }).observe(modal, { attributes:true, attributeFilter:['class'] });\n      }\n    });\n    // Tell the app which picture was clicked (for the image info panel)\n    document.addEventListener('click', function(e){\n      var c = e.target.closest && e.target.closest('.card');\n      if(c && c.dataset.type === 'image'){ var img = c.querySelector('img'); post({ type:'img-select', src: img ? img.src : '' }); }\n      else if(e.target.closest && e.target.closest('#canvas') && !e.target.closest('#toolbar,#zoom-ctrl')) post({ type:'img-select', src: null });\n    }, true);\n    // Paste images from the clipboard straight onto the board\n    document.addEventListener('paste', function(e){\n      if(e.target.matches && e.target.matches('input,textarea,[contenteditable]')) return;\n      var files = (e.clipboardData && e.clipboardData.files) || [];\n      for(var i = 0; i \u003c files.length; i++){\n        (function(f){\n          if(f.type.indexOf('image/') !== 0) return;\n          e.preventDefault();\n          var r = new FileReader();\n          r.onload = function(ev){ makeCard('image', { src: ev.target.result, w: 240, h: 200 }); };\n          r.readAsDataURL(f);\n        })(files[i]);\n      }\n    });\n  }\n})();\n\u003c/script>\u003cscript>\nconst SK='mb_v3';\nconst world=document.getElementById('world');\nconst canvas=document.getElementById('canvas');\n\n// ─── World size ───────────────────────────────────────────────────\nlet worldW=4000, worldH=4000;\nfunction applyWorldSize(){\n  world.style.width=worldW+'px';\n  world.style.height=worldH+'px';\n}\napplyWorldSize();\n\n// ─── Expand down ─────────────────────────────────────────────────\nconst EXPAND_STEP=2000;\nconst badge=document.getElementById('expand-badge');\nlet badgeTimer=null;\nfunction expandDown(){\n  worldH+=EXPAND_STEP;\n  applyWorldSize();\n  save();\n  // Show badge\n  badge.textContent='Canvas height: '+(worldH/1000).toFixed(0)+'k px — pan down to reach new space';\n  badge.classList.add('show');\n  clearTimeout(badgeTimer);\n  badgeTimer=setTimeout(()=>badge.classList.remove('show'),2600);\n  // Smoothly pan so the new space is hinted at\n  const target=pan.y-80*zoom;\n  const start=pan.y;\n  const dur=400;\n  const t0=performance.now();\n  function step(now){\n    const p=Math.min(1,(now-t0)/dur);\n    const ease=1-Math.pow(1-p,3);\n    pan.y=start+(target-start)*ease;\n    updateTransform();\n    if(p\u003c1)requestAnimationFrame(step);\n  }\n  requestAnimationFrame(step);\n}\ndocument.getElementById('btn-expand').addEventListener('click',expandDown);\n\n// ─── Theme colors ────────────────────────────────────────────────\nconst NOTE_LIGHT=[\n  {bg:'#FFFFFF',text:'#2C2C2B',border:'#E6E5E3'},\n  {bg:'#E5F2FC',text:'#1a5f9e',border:'#b8d8f4'},\n  {bg:'#EEE8F8',text:'#6b3fad',border:'#d4c3f0'},\n  {bg:'#E8F1EC',text:'#2d7a52',border:'#b3d9c4'},\n  {bg:'#FEF3E2',text:'#a05c10',border:'#f5d9a8'},\n  {bg:'#FCE9E7',text:'#b33a30',border:'#f0bbb8'},\n];\nconst NOTE_DARK=[\n  {bg:'#2e2e2e',text:'rgba(255,255,255,0.85)',border:'rgba(255,255,255,0.08)'},\n  {bg:'#1e3040',text:'#7fb8e0',border:'rgba(127,184,224,0.2)'},\n  {bg:'#2b1e3a',text:'#c49ae0',border:'rgba(196,154,224,0.2)'},\n  {bg:'#1e3028',text:'#7bc99a',border:'rgba(123,201,154,0.2)'},\n  {bg:'#3a2c1e',text:'#e0b37a',border:'rgba(224,179,122,0.2)'},\n  {bg:'#3a1e20',text:'#e07f7f',border:'rgba(224,127,127,0.2)'},\n];\nfunction noteColors(){return document.body.classList.contains('dark')?NOTE_DARK:NOTE_LIGHT;}\n\n// ─── State ───────────────────────────────────────────────────────\nlet pan={x:0,y:0},zoom=1,zCounter=10;\nlet selCard=null,dragState=null,resizeState=null;\nlet spaceDown=false,isPanning=false,panStart={x:0,y:0},panOrigin={x:0,y:0};\nlet noteColorIdx=0;\nlet history=[],historyIdx=-1;\nlet ctxCard=null;\nlet saveTimer=null;\n\nconst S={theme:'light'};\n\nfunction worldToScreen(wx,wy){return{x:wx*zoom+pan.x,y:wy*zoom+pan.y};}\nfunction screenToWorld(sx,sy){return{x:(sx-pan.x)/zoom,y:(sy-pan.y)/zoom};}\nfunction updateTransform(){\n  world.style.transform=`translate(${pan.x}px,${pan.y}px) scale(${zoom})`;\n  document.getElementById('zoom-pct').textContent=Math.round(zoom*100)+'%';\n  // Infinite grid: tile the background on the canvas itself, synced to pan/zoom\n  const dark=document.body.classList.contains('dark');\n  const maj=80*zoom, min=20*zoom;\n  const ox=(pan.x%maj+maj)%maj, oy=(pan.y%maj+maj)%maj;\n  const oxm=(pan.x%min+min)%min, oym=(pan.y%min+min)%min;\n  const majC=dark?'rgba(255,255,255,0.05)':'rgba(0,0,0,0.08)';\n  const minC=dark?'rgba(255,255,255,0.02)':'rgba(0,0,0,0.03)';\n  canvas.style.backgroundImage=[\n    `linear-gradient(${majC} 1px,transparent 1px)`,\n    `linear-gradient(90deg,${majC} 1px,transparent 1px)`,\n    `linear-gradient(${minC} 1px,transparent 1px)`,\n    `linear-gradient(90deg,${minC} 1px,transparent 1px)`\n  ].join(',');\n  canvas.style.backgroundSize=`${maj}px ${maj}px,${maj}px ${maj}px,${min}px ${min}px,${min}px ${min}px`;\n  canvas.style.backgroundPosition=`${ox}px ${oy}px,${ox}px ${oy}px,${oxm}px ${oym}px,${oxm}px ${oym}px`;\n}\n\n// ─── Persist ─────────────────────────────────────────────────────\nfunction collectCards(){\n  const cards=[];\n  world.querySelectorAll('.card').forEach(c=>{\n    const b={type:c.dataset.type,x:parseFloat(c.style.left),y:parseFloat(c.style.top),w:c.offsetWidth,h:c.offsetHeight,z:parseInt(c.style.zIndex)||10,ci:parseInt(c.dataset.ci||'0')};\n    if(b.type==='note'){b.text=c.querySelector('textarea').value;}\n    else if(b.type==='image'){const img=c.querySelector('img');b.src=img?img.src:'';}\n    else if(b.type==='label'){b.text=c.querySelector('span').textContent;}\n    cards.push(b);\n  });\n  return cards;\n}\nfunction save(){\n  clearTimeout(saveTimer);\n  saveTimer=setTimeout(()=>{\n    try{\n      const data={cards:collectCards(),pan,zoom,zCounter,theme:S.theme,worldW,worldH};\n      __bridge.save(data);\n      showSaved();\n    }catch(e){}\n  },400);\n}\nfunction showSaved(){const b=document.getElementById('saved');b.classList.add('show');setTimeout(()=>b.classList.remove('show'),1400);}\nfunction loadData(){\n  try{const r=__bridge.load();return r?JSON.parse(r):null;}catch(e){return null;}\n}\n\n// ─── Undo ─────────────────────────────────────────────────────────\nfunction pushHistory(){\n  const snap=JSON.stringify(collectCards());\n  if(historyIdx\u003chistory.length-1)history=history.slice(0,historyIdx+1);\n  history.push(snap);\n  if(history.length>30)history.shift();\n  historyIdx=history.length-1;\n}\nfunction undo(){\n  if(historyIdx\u003c=0)return;\n  historyIdx--;\n  const cards=JSON.parse(history[historyIdx]);\n  world.querySelectorAll('.card').forEach(c=>c.remove());\n  selCard=null;\n  zCounter=10;\n  cards.forEach(c=>makeCard(c.type,{pos:{x:c.x,y:c.y},w:c.w,h:c.h,z:c.z,ci:c.ci,src:c.src,text:c.text},true));\n  save();\n}\n\n// ─── Cards ───────────────────────────────────────────────────────\nfunction randomPos(w,h){\n  const vw=canvas.clientWidth,vh=canvas.clientHeight;\n  const wp=screenToWorld(vw/2,vh/2);\n  return{x:wp.x-w/2+Math.random()*60-30,y:wp.y-h/2+Math.random()*60-30};\n}\n\nfunction makeCard(type,opts={},skipHistory=false){\n  const card=document.createElement('div');\n  card.className='card';\n  card.dataset.type=type;\n  const z=opts.z||++zCounter;\n  card.style.zIndex=z;\n  if(opts.z&&opts.z>zCounter)zCounter=opts.z;\n  const ci=opts.ci!=null?opts.ci:noteColorIdx;\n  card.dataset.ci=ci;\n\n  const xb=document.createElement('button');xb.className='xbtn';xb.innerHTML='×';\n  xb.addEventListener('click',e=>{e.stopPropagation();pushHistory();card.remove();if(selCard===card)selCard=null;save();});\n  card.appendChild(xb);\n\n  const rz=document.createElement('div');rz.className='rz';card.appendChild(rz);\n\n  const pos=opts.pos||randomPos(opts.w||200,opts.h||160);\n  card.style.left=pos.x+'px';card.style.top=pos.y+'px';\n  if(opts.w)card.style.width=opts.w+'px';\n  if(opts.h)card.style.height=opts.h+'px';\n\n  if(type==='image'){\n    card.classList.add('ic');\n    const img=document.createElement('img');\n    img.src=opts.src||'';\n    img.draggable=false;\n    img.onerror=()=>{card.style.background='var(--surf2)';card.style.border='1px solid var(--bdr)';card.style.display='flex';card.style.alignItems='center';card.style.justifyContent='center';img.remove();const m=document.createElement('span');m.style.cssText='color:var(--muted);font-size:11px;text-align:center;padding:12px;pointer-events:none';m.textContent='⚠️ Could not load';card.insertBefore(m,rz);};\n    card.insertBefore(img,rz);\n  } else if(type==='note'){\n    card.classList.add('nc');\n    const col=noteColors()[ci%noteColors().length];\n    applyNoteColor(card,ci);\n    const ta=document.createElement('textarea');\n    ta.placeholder='Write a note…';ta.value=opts.text||'';\n    ta.style.color=col.text;\n    ta.addEventListener('mousedown',e=>e.stopPropagation());\n    ta.addEventListener('input',save);\n    card.insertBefore(ta,rz);\n    const cb=document.createElement('div');cb.className='nc-color-btn';cb.style.background=col.bg==='#FFFFFF'?'#ccc':col.bg;\n    cb.title='Change color';cb.addEventListener('click',e=>{e.stopPropagation();cycleNoteColor(card);});\n    card.insertBefore(cb,rz);\n  } else if(type==='label'){\n    card.classList.add('lc');\n    card.style.background='var(--surf)';card.style.border='1px solid var(--bdr)';\n    const sp=document.createElement('span');sp.contentEditable='true';sp.spellcheck=false;\n    sp.style.color='var(--muted)';sp.textContent=opts.text||'LABEL';\n    sp.addEventListener('mousedown',e=>e.stopPropagation());\n    sp.addEventListener('input',save);\n    sp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sp.blur();}});\n    card.insertBefore(sp,rz);\n  }\n\n  setupCardEvents(card,rz);\n  world.appendChild(card);\n  if(!skipHistory)pushHistory();\n  if(!skipHistory)save();\n  return card;\n}\n\nfunction applyNoteColor(card,ci){\n  const cols=noteColors();\n  const col=cols[ci%cols.length];\n  card.style.background=col.bg;\n  card.style.border='1px solid '+col.border;\n  card.dataset.ci=ci;\n  const ta=card.querySelector('textarea');\n  if(ta)ta.style.color=col.text;\n  const cb=card.querySelector('.nc-color-btn');\n  if(cb)cb.style.background=col.bg==='#FFFFFF'?'#ccc':col.bg;\n}\n\nfunction cycleNoteColor(card){\n  const ci=(parseInt(card.dataset.ci||'0')+1)%noteColors().length;\n  applyNoteColor(card,ci);\n  save();\n}\n\nfunction setupCardEvents(card,rz){\n  card.addEventListener('mousedown',e=>{\n    if(e.target===rz||rz.contains(e.target))return;\n    if(e.target.tagName==='BUTTON'||e.target.closest('.xbtn'))return;\n    if(e.button!==0)return;\n    e.preventDefault();\n    selectCard(card);\n    card.style.zIndex=++zCounter;\n    const wp=screenToWorld(e.clientX,e.clientY);\n    dragState={card,ox:wp.x-parseFloat(card.style.left),oy:wp.y-parseFloat(card.style.top)};\n    card.classList.add('drag');\n  });\n  rz.addEventListener('mousedown',e=>{\n    e.preventDefault();e.stopPropagation();\n    selectCard(card);\n    resizeState={card,sx:e.clientX,sy:e.clientY,sw:card.offsetWidth,sh:card.offsetHeight};\n  });\n  card.addEventListener('contextmenu',e=>{\n    e.preventDefault();e.stopPropagation();\n    showCtxMenu(e.clientX,e.clientY,card);\n  });\n}\n\nfunction selectCard(card){\n  if(selCard&&selCard!==card)selCard.classList.remove('sel');\n  selCard=card;card.classList.add('sel');\n}\n\n// ─── Mouse events ─────────────────────────────────────────────────\ndocument.addEventListener('mousemove',e=>{\n  if(isPanning){\n    pan.x=panOrigin.x+(e.clientX-panStart.x);\n    pan.y=panOrigin.y+(e.clientY-panStart.y);\n    updateTransform();\n  }\n  if(dragState){\n    const wp=screenToWorld(e.clientX,e.clientY);\n    const nx=wp.x-dragState.ox,ny=wp.y-dragState.oy;\n    dragState.card.style.left=nx+'px';dragState.card.style.top=ny+'px';\n  }\n  if(resizeState){\n    const dx=(e.clientX-resizeState.sx)/zoom;\n    const dy=(e.clientY-resizeState.sy)/zoom;\n    resizeState.card.style.width=Math.max(80,resizeState.sw+dx)+'px';\n    resizeState.card.style.height=Math.max(50,resizeState.sh+dy)+'px';\n  }\n});\ndocument.addEventListener('mouseup',e=>{\n  if(isPanning){isPanning=false;canvas.style.cursor=spaceDown?'grab':'default';}\n  if(dragState){dragState.card.classList.remove('drag');dragState=null;save();}\n  if(resizeState){resizeState=null;save();}\n});\n\ncanvas.addEventListener('mousedown',e=>{\n  if(e.button===1||(e.button===0&&spaceDown)){\n    isPanning=true;panStart={x:e.clientX,y:e.clientY};panOrigin={x:pan.x,y:pan.y};\n    canvas.style.cursor='grabbing';e.preventDefault();\n    return;\n  }\n  if(e.target===canvas||e.target===world){if(selCard){selCard.classList.remove('sel');selCard=null;}}\n});\n\n// Scroll to zoom\ncanvas.addEventListener('wheel',e=>{\n  e.preventDefault();\n  const rect=canvas.getBoundingClientRect();\n  const cx=e.clientX-rect.left,cy=e.clientY-rect.top;\n  const factor=e.deltaY>0?0.9:1.1;\n  const nz=Math.min(4,Math.max(0.15,zoom*factor));\n  pan.x=cx-(cx-pan.x)*(nz/zoom);\n  pan.y=cy-(cy-pan.y)*(nz/zoom);\n  zoom=nz;\n  updateTransform();\n},{passive:false});\n\n// Keyboard\ndocument.addEventListener('keydown',e=>{\n  if(e.code==='Space'&&!e.target.matches('input,textarea,[contenteditable]')){\n    spaceDown=true;canvas.style.cursor='grab';e.preventDefault();\n  }\n  if((e.key==='Delete'||e.key==='Backspace')&&selCard&&!e.target.matches('input,textarea,[contenteditable]')){\n    pushHistory();selCard.remove();selCard=null;save();\n  }\n  if(e.key==='d'&&(e.ctrlKey||e.metaKey)&&selCard){\n    e.preventDefault();\n    const c=selCard;\n    const type=c.dataset.type;\n    const opts={pos:{x:parseFloat(c.style.left)+20,y:parseFloat(c.style.top)+20},w:c.offsetWidth,h:c.offsetHeight,ci:parseInt(c.dataset.ci||'0')};\n    if(type==='note')opts.text=c.querySelector('textarea').value;\n    else if(type==='image'){const img=c.querySelector('img');opts.src=img?img.src:'';}\n    else if(type==='label')opts.text=c.querySelector('span').textContent;\n    makeCard(type,opts);\n  }\n  if(e.key==='z'&&(e.ctrlKey||e.metaKey)&&!e.shiftKey){e.preventDefault();undo();}\n  if(e.key==='Escape'){if(selCard){selCard.classList.remove('sel');selCard=null;}closeCtx();}\n});\ndocument.addEventListener('keyup',e=>{if(e.code==='Space'){spaceDown=false;canvas.style.cursor='default';}});\n\n// ─── Context menu ─────────────────────────────────────────────────\nconst ctxEl=document.getElementById('ctx');\nconst cmColors=document.getElementById('cm-colors');\n\nfunction buildCmColors(){\n  cmColors.innerHTML='';\n  const hasCi=ctxCard&&ctxCard.dataset.type==='note';\n  document.getElementById('cm-color-label').style.display=hasCi?'':'none';\n  cmColors.style.display=hasCi?'':'none';\n  if(!hasCi)return;\n  noteColors().forEach((c,i)=>{\n    const sw=document.createElement('div');sw.className='cm-sw'+(parseInt(ctxCard.dataset.ci||'0')===i?' act':'');\n    sw.style.background=c.bg==='#FFFFFF'?'#E6E5E3':c.bg;\n    sw.addEventListener('click',()=>{applyNoteColor(ctxCard,i);save();closeCtx();});\n    cmColors.appendChild(sw);\n  });\n}\n\nfunction showCtxMenu(x,y,card){\n  ctxCard=card;selectCard(card);\n  buildCmColors();\n  ctxEl.style.left=x+'px';ctxEl.style.top=y+'px';\n  ctxEl.classList.add('open');\n  requestAnimationFrame(()=>{\n    const r=ctxEl.getBoundingClientRect();\n    if(r.right>window.innerWidth)ctxEl.style.left=(x-r.width)+'px';\n    if(r.bottom>window.innerHeight)ctxEl.style.top=(y-r.height)+'px';\n  });\n}\nfunction closeCtx(){ctxEl.classList.remove('open');ctxCard=null;}\n\ndocument.getElementById('cm-dup').addEventListener('click',()=>{\n  if(!ctxCard)return;\n  const type=ctxCard.dataset.type;\n  const opts={pos:{x:parseFloat(ctxCard.style.left)+24,y:parseFloat(ctxCard.style.top)+24},w:ctxCard.offsetWidth,h:ctxCard.offsetHeight,ci:parseInt(ctxCard.dataset.ci||'0')};\n  if(type==='note')opts.text=ctxCard.querySelector('textarea').value;\n  else if(type==='image'){const img=ctxCard.querySelector('img');opts.src=img?img.src:'';}\n  else if(type==='label')opts.text=ctxCard.querySelector('span').textContent;\n  makeCard(type,opts);closeCtx();\n});\ndocument.getElementById('cm-front').addEventListener('click',()=>{\n  if(!ctxCard)return;ctxCard.style.zIndex=++zCounter;save();closeCtx();\n});\ndocument.getElementById('cm-back').addEventListener('click',()=>{\n  if(!ctxCard)return;ctxCard.style.zIndex=1;save();closeCtx();\n});\ndocument.getElementById('cm-del').addEventListener('click',()=>{\n  if(!ctxCard)return;pushHistory();ctxCard.remove();if(selCard===ctxCard)selCard=null;save();closeCtx();\n});\ndocument.addEventListener('click',e=>{if(!ctxEl.contains(e.target))closeCtx();});\n\n// ─── Toolbar ──────────────────────────────────────────────────────\nlet noteResolve=null,imgResolve=null;\n\nfunction openNoteModal(){\n  const modal=document.getElementById('note-modal');\n  const colors=document.getElementById('note-colors');\n  colors.innerHTML='';\n  noteColors().forEach((c,i)=>{\n    const sw=document.createElement('div');sw.className='md-sw'+(i===noteColorIdx?' act':'');\n    sw.style.background=c.bg==='#FFFFFF'?'#E6E5E3':c.bg;\n    sw.addEventListener('click',()=>{noteColorIdx=i;colors.querySelectorAll('.md-sw').forEach((s,j)=>s.classList.toggle('act',j===i));});\n    colors.appendChild(sw);\n  });\n  document.getElementById('note-text').value='';\n  modal.classList.add('open');\n  setTimeout(()=>document.getElementById('note-text').focus(),50);\n  return new Promise(r=>{noteResolve=r;});\n}\nfunction openImgModal(){\n  document.getElementById('img-url').value='';\n  document.getElementById('img-modal').classList.add('open');\n  setTimeout(()=>document.getElementById('img-url').focus(),50);\n  return new Promise(r=>{imgResolve=r;});\n}\n\ndocument.getElementById('note-ok').addEventListener('click',()=>{document.getElementById('note-modal').classList.remove('open');if(noteResolve){noteResolve(document.getElementById('note-text').value);noteResolve=null;}});\ndocument.getElementById('note-cancel').addEventListener('click',()=>{document.getElementById('note-modal').classList.remove('open');if(noteResolve){noteResolve(null);noteResolve=null;}});\ndocument.getElementById('note-text').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('note-ok').click();}});\n\ndocument.getElementById('img-ok').addEventListener('click',()=>{document.getElementById('img-modal').classList.remove('open');if(imgResolve){imgResolve(document.getElementById('img-url').value.trim());imgResolve=null;}});\ndocument.getElementById('img-cancel').addEventListener('click',()=>{document.getElementById('img-modal').classList.remove('open');if(imgResolve){imgResolve(null);imgResolve=null;}});\ndocument.getElementById('img-url').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('img-ok').click();});\n\ndocument.getElementById('btn-note').addEventListener('click',async()=>{\n  const text=await openNoteModal();\n  if(text!==null)makeCard('note',{text,ci:noteColorIdx,w:220,h:140});\n});\ndocument.getElementById('btn-img').addEventListener('click',async()=>{\n  const src=await openImgModal();\n  if(src)makeCard('image',{src,w:240,h:200});\n});\ndocument.getElementById('btn-lbl').addEventListener('click',()=>makeCard('label',{w:120,h:36}));\ndocument.getElementById('btn-undo').addEventListener('click',undo);\ndocument.getElementById('btn-clear').addEventListener('click',()=>{\n  if(!confirm('Clear all cards?'))return;\n  pushHistory();\n  world.querySelectorAll('.card').forEach(c=>c.remove());\n  selCard=null;save();\n});\ndocument.getElementById('btn-theme').addEventListener('click',()=>{\n  S.theme=S.theme==='dark'?'light':'dark';\n  document.body.classList.toggle('dark',S.theme==='dark');\n  document.getElementById('theme-lbl').textContent=S.theme==='dark'?'Light':'Dark';\n  world.querySelectorAll('.card.nc').forEach(c=>applyNoteColor(c,parseInt(c.dataset.ci||'0')));\n  save();\n});\n\n// Zoom buttons\ndocument.getElementById('z-in').addEventListener('click',()=>{setZoom(zoom*1.2);});\ndocument.getElementById('z-out').addEventListener('click',()=>{setZoom(zoom/1.2);});\ndocument.getElementById('z-fit').addEventListener('click',()=>{pan={x:0,y:0};zoom=1;updateTransform();});\nfunction setZoom(nz){\n  const cx=canvas.clientWidth/2,cy=canvas.clientHeight/2;\n  nz=Math.min(4,Math.max(0.15,nz));\n  pan.x=cx-(cx-pan.x)*(nz/zoom);\n  pan.y=cy-(cy-pan.y)*(nz/zoom);\n  zoom=nz;updateTransform();\n}\n\n// Drag & drop images\nconst dropOv=document.getElementById('drop-ov');\ndocument.addEventListener('dragover',e=>{e.preventDefault();dropOv.classList.add('on');});\ndocument.addEventListener('dragleave',e=>{if(!e.relatedTarget)dropOv.classList.remove('on');});\ndocument.addEventListener('drop',e=>{\n  e.preventDefault();dropOv.classList.remove('on');\n  const wp=screenToWorld(e.clientX,e.clientY);\n  const pos={x:wp.x-120,y:wp.y-100};\n  const files=Array.from(e.dataTransfer.files).filter(f=>f.type.startsWith('image/'));\n  files.forEach(f=>{const r=new FileReader();r.onload=ev=>makeCard('image',{src:ev.target.result,w:240,h:200,pos});r.readAsDataURL(f);});\n  if(!files.length){\n    const src=droppedPicture(e.dataTransfer);\n    if(src)makeCard('image',{src,w:240,h:200,pos});\n  }\n});\n// A picture dragged from another site: use the picture itself (its largest size), not the link around it.\nfunction droppedPicture(dt){\n  const html=dt.getData('text/html');\n  const img=html&&new DOMParser().parseFromString(html,'text/html').querySelector('img');\n  if(img){\n    let best=img.getAttribute('src')||'',bw=0;\n    (img.getAttribute('srcset')||'').split(',').forEach(s=>{const[u,d]=s.trim().split(/\\s+/);const w=parseFloat(d)||0;if(/^https?:/i.test(u||'')&&w>bw){bw=w;best=u;}});\n    if(/^(https?:|data:image\\/)/i.test(best))return best;\n  }\n  const txt=(dt.getData('text/uri
