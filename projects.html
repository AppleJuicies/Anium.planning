unction(i){ if(i.getAttribute('src') === m.from) i.setAttribute('src', m.to); });\n    // The app couldn't get a picture from that address: drop a card that was just added, otherwise mark it.\n    if(m.type === 'img-failed') document.querySelectorAll('.card img').forEach(function(i){\n      if(i.getAttribute('src') !== m.from) return;\n      var card = i.closest('.card');\n      if(m.remove){ card.remove(); try { save(); } catch(e){} }\n      else { card.classList.remove('ws-pending'); card.classList.add('ws-missing'); }\n    });\n  });\n  document.addEventListener('DOMContentLoaded', function(){ setTheme(!!I.dark); });\n  document.addEventListener('keydown', function(e){\n    if((e.metaKey || e.ctrlKey) && (e.key === 's' || e.key === 'S')){ e.preventDefault(); post({ type:'save-shortcut' }); }\n  }, true);\n\n  if(I.mod === 'moodboard'){\n    // When a web picture doesn't load, the template would remove it from its card, and the next save\n    // would then lose the picture for good. Catch the error first (this runs before the template's own\n    // handler) and show \"Getting picture…\" while the app saves its own copy.\n    var st = document.createElement('style');\n    st.textContent = '.card.ws-pending img,.card.ws-missing img{visibility:hidden}'\n      + '.card.ws-pending::after,.card.ws-missing::after{position:absolute;inset:0;display:grid;place-items:center;padding:12px;text-align:center;font-size:12px;line-height:1.4;color:#8a8a8a;pointer-events:none}'\n      + '.card.ws-pending::after{content:\"Getting picture…\"}.card.ws-missing::after{content:\"This picture couldn’t be loaded. Drag the file in again.\"}';\n    (document.head || document.documentElement).appendChild(st);\n    document.addEventListener('error', function(e){\n      var t = e.target, card = t && t.tagName === 'IMG' && t.closest && t.closest('.card');\n      if(!card) return;\n      e.stopPropagation();\n      var src = t.getAttribute('src') || '', web = /^https?:/i.test(src);\n      if(!card.classList.contains('ws-missing')) card.classList.add(web ? 'ws-pending' : 'ws-missing');\n    }, true);\n    document.addEventListener('load', function(e){\n      var t = e.target, card = t && t.tagName === 'IMG' && t.closest && t.closest('.card');\n      if(card) card.classList.remove('ws-pending', 'ws-missing');\n    }, true);\n    function addFiles(files, pos){\n      files.filter(function(f){ return f.type.indexOf('image/') === 0; }).forEach(function(f, i){\n        var r = new FileReader();\n        r.onload = function(ev){\n          var o = { src: ev.target.result, w: 240, h: 200 };\n          if(pos) o.pos = { x: pos.x + i * 30, y: pos.y + i * 30 };\n          makeCard('image', o);\n        };\n        r.readAsDataURL(f);\n      });\n    }\n    var fileIn = document.createElement('input');\n    fileIn.type = 'file'; fileIn.accept = 'image/*'; fileIn.multiple = true; fileIn.style.display = 'none';\n    fileIn.addEventListener('change', function(){\n      var files = Array.prototype.slice.call(fileIn.files || []);\n      var cancel = document.getElementById('img-cancel'); if(cancel) cancel.click();\n      addFiles(files); fileIn.value = '';\n    });\n    document.addEventListener('DOMContentLoaded', function(){\n      document.body.appendChild(fileIn);\n      // \"Upload from computer\" inside the existing Add Image dialog\n      var url = document.getElementById('img-url');\n      if(url){\n        var up = document.createElement('button');\n        up.type = 'button'; up.className = 'mdbtn p'; up.textContent = 'Upload from computer…';\n        up.style.cssText = 'width:100%;padding:10px;font-size:13px;margin-bottom:10px;display:block';\n        up.addEventListener('click', function(){ fileIn.click(); });\n        var tip = document.createElement('div');\n        tip.textContent = 'Paste a picture’s address, or right-click a picture → Copy image and paste it in the box (Ctrl/⌘+V).';\n        tip.style.cssText = 'font-size:11.5px;color:var(--muted);line-height:1.45;margin:10px 0 2px';\n        url.parentNode.insertBefore(up, url);\n        url.parentNode.insertBefore(tip, url.nextSibling);\n        url.placeholder = 'Paste a copied picture or image address…';\n        var err = document.createElement('div');\n        err.style.cssText = 'display:none;font-size:12px;line-height:1.45;color:#E56458;background:rgba(229,100,88,.1);border-radius:7px;padding:8px 10px;margin-top:8px';\n        url.parentNode.insertBefore(err, url.nextSibling);\n        var showErr = function(t){ err.textContent = t; err.style.display = t ? 'block' : 'none'; };\n        url.addEventListener('input', function(){ showErr(''); });\n        // Paste the picture itself into the box\n        url.addEventListener('paste', function(e){\n          var files = Array.prototype.slice.call((e.clipboardData && e.clipboardData.files) || []).filter(function(f){ return f.type.indexOf('image/') === 0; });\n          if(!files.length) return;\n          e.preventDefault(); showErr('');\n          var cancel = document.getElementById('img-cancel'); if(cancel) cancel.click();\n          addFiles(files);\n        });\n        // Picture or page addresses (e.g. a Pinterest pin) go straight in: the app fetches and keeps its own copy.\n        var modal = document.getElementById('img-modal');\n        if(modal) new MutationObserver(function(){ if(!modal.classList.contains('open')) showErr(''); }).observe(modal, { attributes:true, attributeFilter:['class'] });\n      }\n    });\n    // Tell the app which picture was clicked (for the image info panel)\n    document.addEventListener('click', function(e){\n      var c = e.target.closest && e.target.closest('.card');\n      if(c && c.dataset.type === 'image'){ var img = c.querySelector('img'); post({ type:'img-select', src: img ? img.src : '' }); }\n      else if(e.target.closest && e.target.closest('#canvas') && !e.target.closest('#toolbar,#zoom-ctrl')) post({ type:'img-select', src: null });\n    }, true);\n    // Paste images from the clipboard straight onto the board\n    document.addEventListener('paste', function(e){\n      if(e.target.matches && e.target.matches('input,textarea,[contenteditable]')) return;\n      var files = (e.clipboardData && e.clipboardData.files) || [];\n      for(var i = 0; i \u003c files.length; i++){\n        (function(f){\n          if(f.type.indexOf('image/') !== 0) return;\n          e.preventDefault();\n          var r = new FileReader();\n          r.onload = function(ev){ makeCard('image', { src: ev.target.result, w: 240, h: 200 }); };\n          r.readAsDataURL(f);\n        })(files[i]);\n      }\n    });\n  }\n})();\n\u003c/script>\u003cscript>\nconst DAYS=14;\nconst DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];\nconst MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\nconst COLORS=['#2783DE','#9B6DD4','#D5803B','#46A171','#E56458','#4FB9C9','#DE9255'];\n\nfunction uid(){return Math.random().toString(36).slice(2,8);}\nfunction dc(o){return JSON.parse(JSON.stringify(o));}\nfunction cl(v,a,b){return Math.min(b,Math.max(a,v));}\nfunction pct(i,d){d=d||DAYS;return((i/d)*100).toFixed(3)+'%';}\n\nconst DEFAULT={theme:'light',phases:[\n  {id:'p0',name:'Design & Research',color:'#2783DE',collapsed:false,tasks:[\n    {id:'t0',name:'Finalize mood board & concept options',start:0,end:0,priority:'h',done:false,milestone:false,note:'Due today — show boss options'},\n    {id:'t1',name:'Document current design pain points',start:0,end:1,priority:'h',done:false,milestone:false,note:''},\n    {id:'t2',name:'Reference research & benchmarking',start:1,end:2,priority:'m',done:false,milestone:false,note:''},\n    {id:'t3',name:'Sketch 2–3 design directions',start:1,end:3,priority:'h',done:false,milestone:false,note:''},\n    {id:'t4',name:'Component & material feasibility check',start:2,end:4,priority:'m',done:false,milestone:false,note:''},\n  ]},\n  {id:'p1',name:'Boss Presentation & Approval',color:'#9B6DD4',collapsed:false,tasks:[\n    {id:'t5',name:'Prepare presentation deck / visuals',start:2,end:3,priority:'h',done:false,milestone:false,note:''},\n    {id:'t6',name:'Boss review meeting',start:4,end:4,priority:'h',done:false,milestone:true,note:''},\n    {id:'t7',name:'Incorporate feedback & lock direction',start:4,end:5,priority:'h',done:false,milestone:false,note:''},\n  ]},\n  {id:'p2',name:'Prototype Build',color:'#D5803B',collapsed:false,tasks:[\n    {id:'t8',name:'CAD / detailed design work',start:5,end:7,priority:'h',done:false,milestone:false,note:''},\n    {id:'t9',name:'Source / order required parts',start:5,end:6,priority:'h',done:false,milestone:false,note:''},\n    {id:'t10',name:'Fabrication & assembly – iteration 1',start:7,end:9,priority:'h',done:false,milestone:false,note:''},\n    {id:'t11',name:'Fit check & functional test',start:9,end:10,priority:'m',done:false,milestone:false,note:''},\n    {id:'t12',name:'Fix & refine from test results',start:10,end:11,priority:'m',done:false,milestone:false,note:''},\n  ]},\n  {id:'p3',name:'Showcase Preparation',color:'#46A171',collapsed:false,tasks:[\n    {id:'t13',name:'Demo script & talking points',start:11,end:12,priority:'m',done:false,milestone:false,note:''},\n    {id:'t14',name:'Rehearse & polish presentation',start:12,end:12,priority:'l',done:false,milestone:false,note:''},\n    {id:'t15',name:'Prototype showcase 🏁',start:13,end:13,priority:'h',done:false,milestone:true,note:''},\n  ]},\n]};\n\nconst SK='gantt_v3';\nlet S=loadS()||dc(DEFAULT);\nlet barDrag=null;\n\nfunction saveS(){try{__bridge.save(S);}catch(e){}}\nfunction loadS(){try{const r=__bridge.load();return r?JSON.parse(r):null;}catch(e){return null;}}\n\n// Pinned start date: the plan keeps the same dates no matter when it's opened.\nfunction isoDay(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}\nfunction startDay(){const s=S.start?new Date(S.start+'T00:00:00'):new Date();s.setHours(0,0,0,0);return s;}\nfunction dates(){const s=startDay();return Array.from({length:DAYS},(_,i)=>{const d=new Date(s);d.setDate(d.getDate()+i);return d;});}\nfunction todayIdx(){const t=new Date();t.setHours(0,0,0,0);return Math.round((t-startDay())/86400000);}\n\nfunction applyTheme(){\n  document.body.classList.toggle('dark',S.theme==='dark');\n  document.getElementById('theme-btn').textContent=S.theme==='dark'?'☀️ Light':'◐ Dark';\n}\n\nfunction renderSummary(){\n  let tot=0,dn=0;\n  S.phases.forEach(p=>p.tasks.forEach(t=>{tot++;if(t.done)dn++;}));\n  document.getElementById('tasks-done').textContent=dn;\n  document.getElementById('tasks-total').textContent=tot;\n  document.getElementById('pct-done').textContent=tot?Math.round(dn/tot*100)+'%':'0%';\n  // Update date range\n  const ds=dates();\n  document.getElementById('date-range').textContent=`2-Week Plan · ${MN[ds[0].getMonth()]} ${ds[0].getDate()} – ${MN[ds[13].getMonth()]} ${ds[13].getDate()}`;\n  const ti=todayIdx();\n  document.getElementById('days-left').textContent=ti\u003c0?DAYS:Math.max(0,DAYS-ti);\n  document.getElementById('start-date').value=isoDay(ds[0]);\n}\n\nfunction renderLegend(){\n  const el=document.getElementById('legend');\n  el.innerHTML='';\n  S.phases.forEach(p=>{\n    const li=document.createElement('div');li.className='li';\n    li.innerHTML=`\u003cdiv class=\"ld\" style=\"background:${p.color}\">\u003c/div>\u003cspan>${p.name}\u003c/span>`;\n    el.appendChild(li);\n  });\n}\n\nfunction renderDaysHdr(){\n  const wrap=document.getElementById('days-header');\n  wrap.innerHTML='';\n  dates().forEach((d,i)=>{\n    const el=document.createElement('div');\n    el.className='dc'+([0,6].includes(d.getDay())?' wk':'')+(i===todayIdx()?' td':'');\n    el.innerHTML=`\u003cspan class=\"dn\">${d.getDate()}\u003c/span>${DN[d.getDay()]}`;\n    wrap.appendChild(el);\n  });\n}\n\nfunction makeTodayLine(color){\n  const l=document.createElement('div');\n  l.className='tl-line';\n  l.style.background=color||'var(--acc)';\n  l.style.color=color||'var(--acc)';\n  const ti=todayIdx();\n  if(ti\u003c0||ti>=DAYS)l.style.display='none';\n  l.style.left=`calc(${pct(Math.max(0,Math.min(DAYS-1,ti)))} + ${100/DAYS/2}%)`;\n  return l;\n}\n\nfunction renderBody(){\n  const body=document.getElementById('gantt-body');\n  body.innerHTML='';\n  const ds=dates();\n\n  S.phases.forEach((phase,pi)=>{\n    // Each phase's rows sit in one block, so the whole phase can be dragged\n    const block=document.createElement('div');block.className='ph-block';block.dataset.pi=pi;\n    // Phase header\n    const row=document.createElement('div');row.className='ph-row';\n    const lbl=document.createElement('div');lbl.className='ph-lbl';\n\n    const pGrip=makeGrip('Drag to reorder phases');\n    pGrip.addEventListener('pointerdown',e=>startDrag(e,{kind:'phase',view:'timeline',pi,el:block,label:phase.name}));\n\n    const chev=document.createElement('button');chev.className='ph-chev'+(phase.collapsed?' coll':'');\n    chev.innerHTML='\u003csvg viewBox=\"0 0 12 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\u003cpolyline points=\"2,4 6,8 10,4\"/>\u003c/svg>';\n    chev.addEventListener('click',()=>{phase.collapsed=!phase.collapsed;saveS();renderBody();});\n\n    const dot=document.createElement('div');dot.className='ph-dot';dot.style.background=phase.color;\n\n    const nameEl=document.createElement('input');nameEl.className='ph-name';nameEl.style.color=phase.color;\n    nameEl.value=phase.name;nameEl.title='Click to rename';\n    nameEl.addEventListener('mousedown',e=>e.stopPropagation());\n    nameEl.addEventListener('change',()=>{phase.name=nameEl.value;saveS();renderLegend();});\n\n    const done=phase.tasks.filter(t=>t.done).length;\n    const prog=document.createElement('span');prog.className='ph-prog';prog.textContent=`${done}/${phase.tasks.length}`;\n\n    const del=document.createElement('button');del.className='ph-del';del.innerHTML='×';del.title='Delete phase';\n    del.addEventListener('click',async()=>{if(!await ask(`Delete phase “${phase.name}” and its tasks?`,'Delete'))return;S.phases.splice(pi,1);saveS();renderAll();});\n\n    const pInfo=document.createElement('button');pInfo.className='ph-info'+(phase.note||(phase.files||[]).length?' has':'');pInfo.innerHTML='ⓘ';pInfo.title='Phase details';\n    pInfo.addEventListener('click',()=>openDetails({pid:phase.id}));\n\n    lbl.appendChild(pGrip);lbl.appendChild(chev);lbl.appendChild(dot);lbl.appendChild(nameEl);lbl.appendChild(prog);lbl.appendChild(pInfo);lbl.appendChild(del);\n    row.appendChild(lbl);\n\n    // Phase bars\n    const pBars=document.createElement('div');pBars.className='ph-bars';\n    for(let i=0;i\u003cDAYS;i++){const c=document.createElement('div');c.className='pc'+([0,6].includes(ds[i].getDay())?' wk':'');pBars.appendChild(c);}\n    if(phase.tasks.length){\n      const minS=Math.min(...phase.tasks.map(t=>t.start));\n      const maxE=Math.max(...phase.tasks.map(t=>t.end));\n      const band=document.createElement('div');band.className='ph-band';\n      band.style.left=pct(minS);band.style.width=`calc(${pct(maxE-minS+1)} - 4px)`;band.style.background=phase.color;\n      pBars.appendChild(band);\n    }\n    pBars.appendChild(makeTodayLine(phase.color));\n    row.appendChild(pBars);\n    block.appendChild(row);\n    body.appendChild(block);\n\n    if(phase.collapsed)return;\n\n    phase.tasks.forEach((task,ti)=>{\n      const tr=document.createElement('div');tr.className='tr';\n      const tl=document.createElement('div');tl.className='tl';\n\n      const grip=makeGrip('Drag to reorder, or move to another phase');\n      grip.addEventListener('pointerdown',e=>startDrag(e,{kind:'task',view:'timeline',pi,ti,el:tr,label:task.name}));\n\n      const chk=document.createElement('div');chk.className='chk'+(task.done?' done':'');\n      chk.addEventListener('click',()=>{toggleDone(task);saveS();renderAll();});\n\n      const tn=document.createElement('input');tn.className='tn'+(task.done?' done':'');\n      tn.value=task.name;tn.title='Click to edit';\n      tn.addEventListener('mousedown',e=>e.stopPropagation());\n      tn.addEventListener('change',()=>{task.name=tn.value;saveS();});\n\n      const pmap={h:'h',m:'m',l:'l'};\n      const plabel={h:'↑ High',m:'— Med',l:'↓ Low'};\n      const tp=document.createElement('span');tp.className=`tp ${pmap[task.priority]}`;tp.textContent=plabel[task.priority].split(' ')[0];tp.title='Click to cycle priority';\n      tp.addEventListener('click',()=>{const cy={h:'m',m:'l',l:'h'};task.priority=cy[task.priority];saveS();renderBody();});\n\n      const nb=document.createElement('button');nb.className='icon-btn'+(task.note||(task.files||[]).length?' has':'');nb.innerHTML='ⓘ';nb.title='Details, notes and attachments';\n      nb.addEventListener('click',()=>openDetails({tid:task.id}));\n\n      const db=document.createElement('button');db.className='icon-btn del';db.innerHTML='×';db.title='Delete task';\n      db.addEventListener('click',()=>{phase.tasks.splice(ti,1);saveS();renderAll();});\n\n      tl.appendChild(grip);tl.appendChild(chk);tl.appendChild(tn);tl.appendChild(tp);tl.appendChild(nb);tl.appendChild(db);\n      tr.appendChild(tl);\n\n      const tbWrap=document.createElement('div');tbWrap.className='tb';tbWrap.style.position='relative';\n      for(let i=0;i\u003cDAYS;i++){const c=document.createElement('div');c.className='tc'+([0,6].includes(ds[i].getDay())?' wk':'')+(i===todayIdx()?' tdc':'');tbWrap.appendChild(c);}\n\n      if(task.milestone){\n        const m=document.createElement('div');m.className='ms';m.style.background=phase.color;m.style.cursor='pointer';\n        m.addEventListener('click',()=>openDetails({tid:task.id}));\n        m.style.left=`calc(${pct(task.start)} + ${100/DAYS/2}% - 6.5px)`;m.title=task.name;\n        tbWrap.appendChild(m);\n      } else {\n        const bar=document.createElement('div');bar.className='bar'+(task.done?' done':'');\n        bar.style.background=phase.color;\n        bar.style.left=pct(task.start);\n        bar.style.width=`calc(${pct(task.end-task.start+1)} - 4px)`;\n        bar.dataset.pi=pi;bar.dataset.ti=ti;\n        bar.title=task.name+(task.note?' \\n\\u24d8 '+task.note:'');\n\n        const rzHandle=document.createElement('div');rzHandle.className='brz';\n        bar.appendChild(rzHandle);\n\n        bar.addEventListener('mousedown',e=>{\n          if(rzHandle===e.target||rzHandle.contains(e.target))return;\n          e.preventDefault();e.stopPropagation();\n          const rect=tbWrap.getBoundingClientRect();\n          barDrag={el:bar,barsEl:tbWrap,pi,ti,tid:task.id,type:'move',sx:e.clientX,os:task.start,oe:task.end,bw:rect.width,moved:false};\n          bar.classList.add('drag');\n        });\n        rzHandle.addEventListener('mousedown',e=>{\n          e.preventDefault();e.stopPropagation();\n          const rect=tbWrap.getBoundingClientRect();\n          barDrag={el:bar,barsEl:tbWrap,pi,ti,tid:task.id,type:'resize',sx:e.clientX,os:task.start,oe:task.end,bw:rect.width,moved:true};\n          bar.classList.add('drag');\n        });\n        tbWrap.appendChild(bar);\n      }\n      tbWrap.appendChild(makeTodayLine(phase.color));\n      tr.appendChild(tbWrap);\n      block.appendChild(tr);\n    });\n\n    // Add task row\n    const addTr=document.createElement('div');addTr.className='add-tr';\n    const addBtn=document.createElement('button');addBtn.className='add-t';\n    addBtn.innerHTML='\u003cspan style=\"font-size:15px\">+\u003c/span> Add task';\n    addBtn.addEventListener('click',()=>{\n      phase.tasks.push({id:uid(),name:'New task',start:0,end:2,priority:'m',done:false,milestone:false,note:''});\n      saveS();renderAll();\n    });\n    addTr.appendChild(addBtn);\n    const addBarSide=document.createElement('div');addTr.appendChild(addBarSide);\n    block.appendChild(addTr);\n  });\n\n  // Add phase\n  const apRow=document.createElement('div');apRow.className='add-ph-row';\n  const apBtn=document.createElement('button');apBtn.className='add-ph';\n  apBtn.innerHTML='\u003cspan style=\"font-size:15px\">+\u003c/span> Add phase';\n  apBtn.addEventListener('click',()=>{\n    const c=COLORS[S.phases.length%COLORS.length];\n    S.phases.push({id:uid(),name:'New Phase',color:c,collapsed:false,tasks:[{id:uid(),name:'New task',start:0,end:2,priority:'m',done:false,milestone:false,note:''}]});\n    saveS();renderAll();\n  });\n  apRow.appendChild(apBtn);\n  body.appendChild(apRow);\n}\n\n// ─── Task status ──────────────────────────────────────────────────\n// \"In progress\" is stored as status:'doing'; done stays the true/false it always was.\nconst STATUSES=[{id:'todo',name:'To do',color:'#7D7A75'},{id:'doing',name:'In progress',color:'#2783DE'},{id:'done',name:'Done',color:'#46A171'}];\nconst PLABEL={h:'High',m:'Med',l:'Low'};\nfunction statusOf(t){return t.done?'done':t.status==='doing'?'doing':'todo';}\nfunction setStatus(t,s){\n  if(statusOf(t)!==s){const now=new Date().toISOString();if(s==='done')t.doneAt=now;if(s==='doing')t.startedAt=now;}\n  t.status=s;t.done=s==='done';\n}\nfunction toggleDone(t){setStatus(t,t.done?'todo':'done');}\nfunction fmtDay(i){const d=dates()[cl(i,0,DAYS-1)];return MN[d.getMonth()]+' '+d.getDate();}\nfunction h(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}\n// In-page dialogs (browser confirm/prompt are blocked in some places this page runs)\nfunction dialog(msg,okLabel,value){\n  return new Promise(res=>{\n    const mo=h('div','mo open'),md=h('div','md');md.setAttribute('role','dialog');md.setAttribute('aria-modal','true');\n    md.appendChild(h('h4',null,msg));\n    let inp=null;\n    if(value!=null){inp=h('input');inp.type='text';inp.value=value;inp.style.cssText='width:100%;font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--bdr);border-radius:7px;background:var(--surf2);color:var(--txt);outline:none';md.appendChild(inp);}\n    const ft=h('div','md-footer'),no=h('button','mb','Cancel'),ok=h('button','mb p',okLabel||'OK');\n    const done=v=>{mo.remove();document.removeEventListener('keydown',key,true);res(v);};\n    const key=e=>{if(e.key==='Escape'){e.stopPropagation();done(null);}if(e.key==='Enter'){e.preventDefault();done(inp?inp.value:true);}};\n    no.addEventListener('click',()=>done(null));ok.addEventListener('click',()=>done(inp?inp.value:true));\n    mo.addEventListener('mousedown',e=>{if(e.target===mo)done(null);});\n    ft.appendChild(no);ft.appendChild(ok);md.appendChild(ft);mo.appendChild(md);document.body.appendChild(mo);\n    document.addEventListener('keydown',key,true);\n    setTimeout(()=>{if(inp){inp.focus();inp.select();}else ok.focus();},20);\n  });\n}\nconst ask=(msg,okLabel)=>dialog(msg,okLabel).then(v=>v===true);\nconst askText=(label,value)=>dialog(label,'Save',value||'');\nfunction makeGrip(title){\n  const g=h('button','grip');g.type='button';g.title=title;\n  g.innerHTML='\u003csvg viewBox=\"0 0 8 12\" fill=\"currentColor\">\u003ccircle cx=\"2\" cy=\"2\" r=\"1.1\"/>\u003ccircle cx=\"6\" cy=\"2\" r=\"1.1\"/>\u003ccircle cx=\"2\" cy=\"6\" r=\"1.1\"/>\u003ccircle cx=\"6\" cy=\"6\" r=\"1.1\"/>\u003ccircle cx=\"2\" cy=\"10\" r=\"1.1\"/>\u003ccircle cx=\"6\" cy=\"10\" r=\"1.1\"/>\u003c/svg>';\n  return g;\n}\n\n// ─── Board view ───────────────────────────────────────────────────\nfunction renderBoard(){\n  const board=document.getElementById('board');\n  const scroll=board.scrollLeft;board.innerHTML='';\n  const byStatus=S.group==='status';\n  const cols=byStatus\n    ?STATUSES.map(s=>({status:s.id,name:s.name,color:s.color,items:[]}))\n    :S.phases.map((p,pi)=>({pi,phase:p,name:p.name,color:p.color,items:[]}));\n  S.phases.forEach((p,pi)=>p.tasks.forEach((t,ti)=>{\n    const it={p,pi,t,ti};\n    if(byStatus)cols.find(c=>c.status===statusOf(t)).items.push(it);else cols[pi].items.push(it);\n  }));\n  cols.forEach(c=>{\n    const col=h('div','col');\n    if(byStatus)col.dataset.status=c.status;else col.dataset.pi=c.pi;\n    const hd=h('div','col-hd'+(byStatus?'':' movable'));\n    const dot=h('div','ph-dot');dot.style.background=c.color;hd.appendChild(dot);\n    if(byStatus){\n      const title=h('span','col-title',c.name);title.style.color=c.color;hd.appendChild(title);\n      hd.appendChild(h('span','col-ct',String(c.items.length)));\n    } else {\n      const phase=c.phase;\n      // Plain text so the whole header can be grabbed; a click (without dragging) renames\n      const title=h('span','col-title',phase.name);title.style.color=phase.color;title.title='Click for phase details · Drag to reorder';\n      title.addEventListener('click',()=>{if(!justDragged)openDetails({pid:phase.id});});\n      hd.appendChild(title);\n      hd.appendChild(h('span','col-ct',phase.tasks.filter(t=>t.done).length+'/'+phase.tasks.length));\n      const info=h('button','ph-info'+(phase.note||(phase.files||[]).length?' has':''),'ⓘ');info.title='Phase details';\n      info.addEventListener('click',()=>openDetails({pid:phase.id}));\n      hd.appendChild(info);\n      const del=h('button','ph-del','×');del.title='Delete phase';\n      del.addEventListener('click',async()=>{if(!await ask(`Delete phase “${phase.name}” and its tasks?`,'Delete'))return;S.phases.splice(c.pi,1);saveS();renderAll();});\n      hd.appendChild(del);\n      hd.addEventListener('pointerdown',e=>{if(e.target.closest('input,button'))return;startDrag(e,{kind:'phase',view:'board',pi:c.pi,el:col,label:phase.name});});\n    }\n    col.appendChild(hd);\n    const list=h('div','col-list');\n    c.items.forEach(it=>list.appendChild(makeCard(it,byStatus)));\n    if(!c.items.length)list.appendChild(h('div','col-empty',byStatus?'Drag tasks here':'No tasks yet'));\n    col.appendChild(list);\n    if(!byStatus){\n      const add=h('button','add-ph');add.innerHTML='\u003cspan style=\"font-size:15px\">+\u003c/span> Add task';\n      add.addEventListener('click',()=>{c.phase.tasks.push({id:uid(),name:'New task',start:0,end:2,priority:'m',done:false,milestone:false,note:''});saveS();renderAll();});\n      col.appendChild(add);\n    }\n    board.appendChild(col);\n  });\n  if(!byStatus){\n    const wrap=h('div','col-new');\n    const add=h('button','add-ph');add.innerHTML='\u003cspan style=\"font-size:15px\">+\u003c/span> Add phase';\n    add.addEventListener('click',()=>{const c=COLORS[S.phases.length%COLORS.length];S.phases.push({id:uid(),name:'New Phase',color:c,collapsed:false,tasks:[]});saveS();renderAll();});\n    wrap.appendChild(add);board.appendChild(wrap);\n  }\n  board.scrollLeft=scroll;\n}\nfunction makeCard({p,pi,t,ti},byStatus){\n  const card=h('div','card'+(t.done?' done':''));card.style.borderLeftColor=p.color;\n  const top=h('div','card-top');\n  const chk=h('div','chk'+(t.done?' done':''));chk.title=t.done?'Mark not done':'Mark done';\n  chk.addEventListener('click',()=>{toggleDone(t);saveS();renderAll();});\n  const name=h('div','cn',t.name);\n  top.appendChild(chk);top.appendChild(name);\n  card.appendChild(top);\n  if(byStatus){const ph=h('div','card-ph');const i=h('i');i.style.background=p.color;ph.appendChild(i);ph.appendChild(h('span',null,p.name));card.appendChild(ph);}\n  const meta=h('div','card-meta');\n  meta.appendChild(h('span','card-date',(t.milestone?'◆ ':'')+fmtDay(t.start)+(t.end>t.start?' – '+fmtDay(t.end):'')));\n  const n=(t.files||[]).length;\n  if(n)meta.appendChild(h('span','card-att','📎 '+n));\n  meta.appendChild(h('span','sp'));\n  const tp=h('span','tp '+t.priority,PLABEL[t.priority]);tp.title='Click to change priority';\n  tp.addEventListener('click',()=>{const cy={h:'m',m:'l',l:'h'};t.priority=cy[t.priority];saveS();renderView();});\n  const nb=h('button','icon-btn'+(t.note?' has':''),'ⓘ');nb.title='Details, notes and attachments';\n  nb.addEventListener('click',()=>openDetails({tid:t.id}));\n  const db=h('button','icon-btn del','×');db.title='Delete task';\n  db.addEventListener('click',()=>{p.tasks.splice(ti,1);saveS();renderAll();});\n  meta.appendChild(tp);meta.appendChild(nb);meta.appendChild(db);\n  card.appendChild(meta);\n  card.title='Click for details · Drag to move';\n  card.addEventListener('pointerdown',e=>{if(e.target.closest('input,button,.chk,.tp'))return;startDrag(e,{kind:'task',view:'board',pi,ti,el:card,label:t.name});});\n  card.addEventListener('click',e=>{if(justDragged||e.target.closest('input,button,.chk,.tp'))return;openDetails({tid:t.id});});\n  return card;\n}\n\n// ─── Drag to reorder (timeline rows, board cards and columns) ─────\nlet drag=null,justDragged=false;\nconst dropLine=h('div','drop-line'),ghost=h('div','drag-ghost');\nfunction startDrag(e,src){\n  if(e.button!==0)return;\n  drag={src,x0:e.clientX,y0:e.clientY,active:false,target:null};\n  try{e.target.setPointerCapture(e.pointerId);}catch(err){}\n}\ndocument.addEventListener('pointermove',e=>{\n  if(!drag)return;\n  if(!drag.active){\n    if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)\u003c5)return;\n    drag.active=true;drag.src.el.classList.add('dragging');document.body.classList.add('reordering');\n    ghost.textContent=drag.src.label||'';document.body.appendChild(ghost);\n  }\n  e.preventDefault();\n  ghost.style.transform=`translate(${e.clientX+14}px,${e.clientY+10}px)`;\n  autoScroll(e.clientX,e.clientY);\n  drag.target=locate(drag.src,e.clientX,e.clientY);\n  showTarget(drag.target);\n});\nfunction endDrag(apply){\n  const d=drag;drag=null;\n  if(!d||!d.active)return;\n  justDragged=true;setTimeout(()=>{justDragged=false;},0);\n  d.src.el.classList.remove('dragging');document.body.classList.remove('reordering');\n  ghost.remove();dropLine.remove();document.querySelectorAll('.col.drop-on').forEach(c=>c.classList.remove('drop-on'));\n  if(apply&&d.target&&applyDrop(d.src,d.target)){saveS();renderAll();}\n}\ndocument.addEventListener('pointerup',()=>endDrag(true));\ndocument.addEventListener('pointercancel',()=>endDrag(false));\ndocument.addEventListener('keydown',e=>{if(e.key==='Escape'&&drag)endDrag(false);});\n\nconst rect=el=>el.getBoundingClientRect();\n// Index to insert at: how many items sit before the pointer\nconst indexAt=(els,pos,vertical)=>els.filter(el=>{const r=rect(el);return vertical?pos>r.top+r.height/2:pos>r.left+r.width/2;}).length;\nconst nearest=(els,pos,vertical)=>els.reduce((best,el)=>{const r=rect(el),d=vertical?(pos\u003cr.top?r.top-pos:pos>r.bottom?pos-r.bottom:0):(pos\u003cr.left?r.left-pos:pos>r.right?pos-r.right:0);return !best||d\u003cbest.d?{el,d}:best;},null);\n// Line just above item i, or just below the last one\nfunction lineAt(items,i,box){\n  const r=items.length?(i\u003citems.length?rect(items[i]):rect(items[items.length-1])):box;\n  const y=items.length?(i\u003citems.length?r.top-1:r.bottom+1):box.top+4;\n  const b=items.length?r:box;\n  return {x:b.left,y,w:b.width};\n}\nfunction locate(src,x,y){\n  if(src.view==='timeline'){\n    const blocks=[...document.querySelectorAll('#gantt-body .ph-block')];\n    if(src.kind==='phase'){\n      const i=indexAt(blocks,y,true);\n      return {kind:'phase',index:i,line:lineAt(blocks,i)};\n    }\n    const n=nearest(blocks,y,true);if(!n)return null;\n    const pi=+n.el.dataset.pi,rows=[...n.el.querySelectorAll('.tr')],i=indexAt(rows,y,true);\n    const box=rect(n.el.querySelector('.ph-row'));\n    return {kind:'task',pi,index:rows.length?i:S.phases[pi].tasks.length,line:rows.length?lineAt(rows,i):{x:box.left,y:box.bottom,w:box.width}};\n  }\n  const cols=[...document.querySelectorAll('#board .col')];\n  if(src.kind==='phase'){\n    const i=indexAt(cols,x,false),r=rect(cols[Math.min(i,cols.length-1)]);\n    return {kind:'phase',index:i,vline:{x:i\u003ccols.length?r.left-7:r.right+5,y:r.top,h:r.height}};\n  }\n  const n=nearest(cols,x,false);if(!n)return null;\n  if(n.el.dataset.status)return {kind:'status',status:n.el.dataset.status,col:n.el};\n  const list=n.el.querySelector('.col-list'),cards=[...list.querySelectorAll('.card')],i=indexAt(cards,y,true),lr=rect(list);\n  const l=lineAt(cards,i,lr);\n  return {kind:'task',pi:+n.el.dataset.pi,index:i,line:{x:lr.left+8,y:cards.length?(i\u003ccards.length?l.y-3:l.y+3):lr.top+4,w:lr.width-16}};\n}\nfunction showTarget(t){\n  document.querySelectorAll('.col.drop-on').forEach(c=>c.classList.remove('drop-on'));\n  if(!t){dropLine.remove();return;}\n  if(t.col){t.col.classList.add('drop-on');dropLine.remove();return;}\n  dropLine.classList.toggle('v',!!t.vline);\n  Object.assign(dropLine.style,t.vline\n    ?{left:t.vline.x+'px',top:t.vline.y+'px',height:t.vline.h+'px',width:''}\n    :{left:t.line.x+'px',top:(t.line.y-1)+'px',width:t.line.w+'px',height:''});\n  document.body.appendChild(dropLine);\n}\n// Returns true when something actually moved\nfunction applyDrop(src,t){\n  if(t.kind==='phase'){\n    if(t.index===src.pi||t.index===src.pi+1)return false;\n    const [p]=S.phases.splice(src.pi,1);S.phases.splice(t.index>src.pi?t.index-1:t.index,0,p);return true;\n  }\n  if(t.kind==='status'){\n    const task=S.phases[src.pi].tasks[src.ti];\n    if(statusOf(task)===t.status)return false;\n    setStatus(task,t.status);return true;\n  }\n  if(t.pi===src.pi&&(t.index===src.ti||t.index===src.ti+1))return false;\n  const [task]=S.phases[src.pi].tasks.splice(src.ti,1);\n  let i=t.index;if(t.pi===src.pi&&i>src.ti)i--;\n  S.phases[t.pi].tasks.splice(i,0,task);\n  if(S.phases[t.pi].collapsed)S.phases[t.pi].collapsed=false;\n  return true;\n}\n// Scroll the page or the board while dragging near an edge\nfunction autoScroll(x,y){\n  const edge=40,step=14;\n  if(y\u003cedge)window.scrollBy(0,-step);else if(y>innerHeight-edge)window.scrollBy(0,step);\n  const board=document.getElementById('board');\n  if(!board.hidden){\n    const r=rect(board);\n    if(x\u003cr.left+edge)board.scrollLeft-=step;else if(x>r.right-edge)board.scrollLeft+=step;\n    const list=document.elementFromPoint(x,y)?.closest?.('.col-list');\n    if(list){const lr=rect(list);if(y\u003clr.top+edge)list.scrollTop-=step;else if(y>lr.bottom-edge)list.scrollTop+=step;}\n  }\n}\n\n// ─── Details panel (click a task or a phase) ──────────────────────\n// Files are stored by the workspace app (in Google Drive when connected); links are stored here.\nconst B=window.__bridge||{};\nconst RO=!!B.readOnly;\nconst dpEl=document.getElementById('dp'),dpBack=document.getElementById('dp-back');\nlet dp=null,dpBusy=0,dpSaveT=null;\nfunction findTask(tid){for(let pi=0;pi\u003cS.phases.length;pi++){const ti=S.phases[pi].tasks.findIndex(t=>t.id===tid);if(ti>=0)return {p:S.phases[pi],pi,t:S.phases[pi].tasks[ti],ti};}return null;}\nfunction findPhase(pid){const pi=S.phases.findIndex(p=>p.id===pid);return pi\u003c0?null:{p:S.phases[pi],pi};}\nfunction dpObj(){if(!dp)return null;const f=dp.tid?findTask(dp.tid):findPhase(dp.pid);return f?(dp.tid?f.t:f.p):null;}\nfunction openDetails(ctx){dp=ctx;renderDetails();dpEl.classList.add('open');dpBack.classList.add('open');dpEl.setAttribute('aria-hidden','false');}\nfunction closeDetails(){\n  if(document.activeElement&&dpEl.contains(document.activeElement))document.activeElement.blur();\n  dp=null;dpEl.classList.remove('open','dragover');dpBack.classList.remove('open');dpEl.setAttribute('aria-hidden','true');\n}\ndpBack.addEventListener('click',closeDetails);\ndocument.addEventListener('keydown',e=>{if(e.key==='Escape'&&dp&&!drag)closeDetails();});\n// Typing saves after a short pause; finished edits also refresh the timeline/board behind the panel.\nfunction dpSave(refresh){clearTimeout(dpSaveT);if(refresh){saveS();renderAll();}else dpSaveT=setTimeout(saveS,400);}\nfunction autosize(ta){ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';}\nfunction fmtSize(n){return n\u003c1024?n+' B':n\u003c1048576?Math.round(n/1024)+' KB':(n/1048576).toFixed(n\u003c10485760?1:0)+' MB';}\nfunction fmtStamp(iso){const d=new Date(iso);return isNaN(d)?'':MN[d.getMonth()]+' '+d.getDate();}\nfunction segCtl(opts,cur,on){\n  if(RO)return h('span',null,(opts.find(o=>o[0]===cur)||opts[0])[1]);\n  const g=h('div','seg');\n  opts.forEach(([v,l])=>{const b=h('button',v===cur?'on':'',l);b.type='button';b.addEventListener('click',()=>on(v));g.appendChild(b);});\n  return g;\n}\nconst FILE_COLORS={pdf:'#E56458',doc:'#2783DE',docx:'#2783DE',txt:'#7D7A75',md:'#7D7A75',xls:'#46A171',xlsx:'#46A171',csv:'#46A171',ppt:'#D5803B',pptx:'#D5803B',key:'#D5803B',zip:'#7D7A75',stl:'#4FB9C9',step:'#4FB9C9',stp:'#4FB9C9',dxf:'#4FB9C9',dwg:'#4FB9C9'};\nfunction linkLabel(url){\n  try{\n    const u=new URL(url);\n    if(u.hostname==='docs.google.com'){const k=u.pathname.split('/')[1];return {document:'Google Doc',spreadsheets:'Google Sheet',presentation:'Google Slides',forms:'Google Form'}[k]||'Google Docs';}\n    if(u.hostname==='drive.google.com')return 'Google Drive';\n    return u.hostname.replace(/^www\\./,'');\n  }catch(e){return 'Link';}\n}\nfunction attIcon(f){\n  if(f.kind==='link')return ['↗','#2783DE'];\n  const ext=(f.name.split('.').pop()||'').toLowerCase();\n  if(/^image\\//.test(f.type||''))return [ext.slice(0,4)||'img','#9B6DD4'];\n  if(/^video\\//.test(f.type||''))return [ext.slice(0,4)||'vid','#4FB9C9'];\n  return [ext.slice(0,4)||'file',FILE_COLORS[ext]||'#7D7A75'];\n}\nfunction openAttachment(f){if(!f.url&&B.openFile)B.openFile(f.id);}\nfunction addFilesTo(obj,list){\n  const files=[...list];if(!files.length||!B.addFiles)return;\n  dpBusy+=files.length;renderDetails();\n  B.addFiles(files).then(items=>{\n    obj.files=obj.files||[];\n    items.forEach(it=>obj.files.push(Object.assign({id:it.id,kind:'file',name:it.name,type:it.type,size:it.size,addedAt:it.addedAt},it.url?{url:it.url}:{})));\n    dpBusy-=files.length;dpSave(true);renderDetails();\n  });\n}\nfunction attachmentsSection(obj){\n  const wrap=h('div'),files=obj.files||[];\n  const hd=h('div','dp-h','Attachments');if(files.length)hd.appendChild(h('span','ct',String(files.length)));\n  wrap.appendChild(hd);\n  const list=h('div','att-list');\n  files.forEach(f=>{\n    // Anything with an address opens as a normal link (new tab); other files ask the app to open them\n    const row=f.url?h('a','att'):h('div','att');\n    if(f.url){row.href=f.url;row.target='_blank';row.rel='noopener';}else{row.setAttribute('role','button');row.tabIndex=0;}\n    row.title=f.kind==='link'?f.url:'Open '+f.name;\n    const [lbl,col]=attIcon(f);const ic=h('div','att-ic',lbl);ic.style.background=col;\n    const tx=h('div','att-tx');\n    tx.appendChild(h('div','att-nm',f.name));\n    tx.appendChild(h('div','att-sub',f.kind==='link'?linkLabel(f.url):[fmtSize(f.size||0),fmtStamp(f.addedAt)].filter(Boolean).join(' · ')));\n    row.appendChild(ic);row.appendChild(tx);\n    if(!f.url){row.addEventListener('click',()=>openAttachment(f));row.addEventListener('keydown',e=>{if(e.key==='Enter')openAttachment(f);});}\n    if(!RO){\n      const rn=h('button','icon-btn','✎');rn.title='Rename';\n      rn.addEventListener('click',async e=>{e.preventDefault();e.stopPropagation();const v=await askText('Name for this attachment',f.name);if(v&&v.trim()){f.name=v.trim();dpSave(true);renderDetails();}});\n      row.appendChild(rn);\n      const rm=h('button','icon-btn del','×');rm.title='Remove attachment';\n      rm.addEventListener('click',async e=>{e.preventDefault();e.stopPropagation();if(!await ask(`Remove “${f.name}” from this ${dp.tid?'task':'phase'}?`,'Remove'))return;obj.files=obj.files.filter(x=>x!==f);dpSave(true);renderDetails();});\n      row.appendChild(rm);\n    }\n    list.appendChild(row);\n  });\n  if(dpBusy)list.appendChild(h('div','att busy',`Adding ${dpBusy} file${dpBusy>1?'s':''}…`));\n  if(!files.length&&!dpBusy)list.appendChild(h('div','dp-empty',RO?'No attachments.':'Add files (drawings, specs, photos, PDFs…) or links to keep them with this '+(dp.tid?'task':'phase')+'.'));\n  wrap.appendChild(list);\n  if(RO)return wrap;\n  const acts=h('div','att-actions');\n  const linkRow=h('div','link-row');linkRow.hidden=true;\n  const linkIn=h('input');linkIn.type='url';linkIn.placeholder='Paste a link (Google Doc, Sheet, website…)';\n  const linkAdd=h('button','fb p','Add');\n  const addLink=()=>{\n    let v=linkIn.value.trim();if(!v)return;if(!/^https?:\\/\\//i.test(v))v='https://'+v;\n    try{new URL(v);}catch(e){linkIn.focus();return;}\n    const u=new URL(v);\n    obj.files=obj.files||[];\n    // Google files get a short name (e.g. \"Google Doc\"); other links show the site and page\n    const g=/google\\.com$/.test(u.hostname)?linkLabel(v):null;\n    obj.files.push({id:uid(),kind:'link',url:v,name:g||(u.hostname.replace(/^www\\./,'')+(u.pathname.length>1?u.pathname:'')).slice(0,80),addedAt:new Date().toISOString()});\n    dpSave(true);renderDetails();\n  };\n  linkAdd.addEventListener('click',addLink);\n  linkIn.addEventListener('keydown',e=>{if(e.key==='Enter')addLink();if(e.key==='Escape')linkRow.hidden=true;});\n  linkRow.appendChild(linkIn);linkRow.appendChild(linkAdd);\n  if(B.addFiles){\n    const fin=h('input');fin.type='file';fin.multiple=true;fin.hidden=true;\n    fin.addEventListener('change',()=>{addFilesTo(obj,fin.files);fin.value='';});\n    const addF=h('button','fb','📎 Add files');addF.addEventListener('click',()=>fin.click());\n    acts.appendChild(addF);acts.appendChild(fin);\n  }\n  const addL=h('button','fb','🔗 Add link');addL.addEventListener('click',()=>{linkRow.hidden=!linkRow.hidden;if(!linkRow.hidden)linkIn.focus();});\n  acts.appendChild(addL);\n  wrap.appendChild(acts);wrap.appendChild(linkRow);\n  if(B.addFiles)wrap.appendChild(h('div','dp-drop','Or drop files anywhere on this panel'));\n  return wrap;\n}\nfunction renderDetails(){\n  if(!dp)return;\n  const isTask=!!dp.tid,found=isTask?findTask(dp.tid):findPhase(dp.pid);\n  if(!found){closeDetails();return;}\n  const {p}=found,t=found.t,obj=isTask?t:p;\n  const scroll=dpEl.querySelector('.dp-body')?dpEl.querySelector('.dp-body').scrollTop:0;\n  dpEl.innerHTML='';\n  // Header\n  const hd=h('div','dp-hd'),kind=h('div','dp-kind'),dot=h('div','ph-dot');dot.style.background=p.color;\n  kind n.appendChild(h('span',null,fmtDay(t.start)+(t.end>t.start?' – '+fmtDay(t.end):'')));\n    else{\n      const si=h('input');si.type='date';si.min=toIso(0);si.max=toIso(DAYS-1);si.value=toIso(t.start);\n      si.addEventListener('change',()=>{if(!si.value)return;const i=toIdx(si.value),dur=t.end-t.start;t.start=i;t.end=t.milestone?i:cl(i+dur,i,DAYS-1);dpSave(true);renderDetails();});\n      dn.appendChild(si);\n      if(!t.milestone){\n        const ei=h('input');ei.type='date';ei.min=toIso(0);ei.max=toIso(DAYS-1);ei.value=toIso(t.end);\n        ei.addEventListener('change',()=>{if(!ei.value)return;t.end=Math.max(t.start,toIdx(ei.value));dpSave(true);renderDetails();});\n        dn.appendChild(h('span',null,'→'));dn.appendChild(ei);\n      }\n    }\n    row(t.milestone?'Date':'Dates',dn);\n    if(!RO){\n      const lb=h('label','dp-chk'),cb=h('input');cb.type='checkbox';cb.checked=!!t.milestone;\n      cb.addEventListener('change',()=>{t.milestone=cb.checked;if(cb.checked)t.end=t.start;dpSave(true);renderDetails();});\n      lb.appendChild(cb);lb.appendChild(document.createTextNode('Milestone (a single key date)'));row('Type',lb);\n    }\n    const stamps=[t.startedAt&&'Started '+fmtStamp(t.startedAt),t.done&&t.doneAt&&'Completed '+fmtStamp(t.doneAt)].filter(Boolean);\n    if(stamps.length)row('Progress',h('span',null,stamps.join(' · ')));\n  } else {\n    if(RO){const d=h('div','ph-dot');d.style.background=p.color;row('Color',d);}\n    else{\n      const sw=h('div','swatches');\n      COLORS.forEach(c=>{const b=h('button','sw'+(c===p.color?' on':''));b.type='button';b.style.background=c;b.title=c;b.addEventListener('click',()=>{p.color=c;dpSave(true);renderDetails();});sw.appendChild(b);});\n      row('Color',sw);\n    }\n    const n=p.tasks.length,done=p.tasks.filter(x=>x.done).length;\n    const span=n?' · '+fmtDay(Math.min(...p.tasks.map(x=>x.start)))+' – '+fmtDay(Math.max(...p.tasks.map(x=>x.end))):'';\n    row('Progress',h('span',null,`${done} of ${n} task${n== ton').forEach(b=>b.addEventListener('click',()=>{S.view=b.dataset.v;saveS();renderAll();}));\ndocument.querySelectorAll('#group-sw button').forEach(b=>b.addEventListener('click',()=>{S.group=b.dataset.g;saveS();renderAll();}));\n\n// Bar drag\ndocument.addEventListener('mousemove',e=>{\n  if(!barDrag)return;\n  const {pi,ti,type,sx,os,oe,bw}=barDrag;\n  const task=S.phases[pi].tasks[ti];\n  const dw=bw/DAYS;\n  const dd=Math.round((e.clientX-sx)/dw);\n  if(Math.abs(e.clientX-sx)>3)barDrag.moved=true;\n  const dur=oe-os;\n  if(type==='move'){\n    const ns=cl(os+dd,0,DAYS-dur-1);\n    const ne=ns+dur;\n    task.start=ns;task.end=ne;\n    barDrag.el.style.left=pct(ns);\n    barDrag.el.style.width=`calc(${pct(ne-ns+1)} - 4px)`;\n  } else {\n    const ne=cl(oe+dd,os,DAYS-1);\n    task.end=ne;\n    barDrag.el.style.width=`calc(${pct(ne-os+1)} - 4px)`;\n  }\n});\ndocument.addEventListener('mouseup',()=>{\n  if(!barDrag)return;\n  const b=barDrag;\n  b.el.classList.remove('drag');\n  barDrag=null;\n  // A click on a bar (no dragging) opens the task's details\n  if(!b.moved){openDetails({tid:b.tid});return;}\n  saveS();renderBody();renderSummary();\n});\n\n\n// Start date\ndocument.getElementById('start-date').addEventListener('change',e=>{\n  if(!e.target.value)return; S.start=e.target.value; saveS(); renderAll();\n});\nif(!S.start){S.start=isoDay(new Date());saveS();}\n\n// Theme\ndocument.getElementById('theme-btn').addEventListener('click',()=>{\n  S.theme=S.theme==='light'?'dark':'light';saveS();applyTheme();\n});\n\n// Reset\ndocument.getElementById('btn-reset').addEventListener('click',async()=>{\n  if(!await ask('Mark every task as not started?','Reset progress'))return;\n  S.phases.forEach(p=>p.tasks.forEach(t=>setStatus(t,'todo')));\n  saveS();renderAll();\n});\n\nfunction renderAll(){\n  renderLegend();applyView();\n  if(S.view==='board')renderBoard();else{renderDaysHdr();renderBody();}\n  renderSummary();\n}\n\napplyTheme();\nrenderAll();\n\u003c/script>\n\u003c   srcMap(p).set(src, id); srcMap(p).set(c.data, id);
  if(!p.images[id]) p.images[id] = { id, src:c.data, w:c.w, h:c.h, addedAt:nowISO(), caption:'', events:[], url: from || undefined };

}
function addUrlImage(p, url){

// Gets a picture from another site as a data URL. This site's server does the download (other sites
// can't block it, and it finds the picture on page links such as Pinterest pins); a direct download is the fallback.
// Returns null when there's no picture at that address; throws { code:'network' } when nothing could be reached.
async function downloadPicture(url){
  let reached = false;
  for(const [src, opts] of [['/api/image?url=' + encodeURIComponent(url)], [url, { mode:'cors' }]]){
    try {
      const r = await fetch(src, opts); reached = reached || r.status < 500;
      if(!r.ok) continue;
      const b = await r.blob(); if(/^image\//.test(b.type)) return await blobToDataURL(b);
    } catch(e){}
  }
  if(!reached) throw { code:'network' };
  return null;
}
// Keeps our own copy of a web picture, so it never depends on the other site staying up.
const copying = new Set();
async function keepCopy(p, id, justAdded){
  const im = p.images[id], key = p.id + ':' + id;
  if(!canEdit() || !im || !im.url || im.src || copying.has(key)) return;
  copying.add(key);
  try {
    let raw;
    try { raw = await downloadPicture(im.url); } catch(e){ return; } // offline: keep it and try again next time
    if(!raw){
      frames.forEach(f => { if(f.pid === p.id) postFrame(f, { type:'img-failed', from: im.url, remove: !!justAdded }); });
      if(justAdded) toast('Couldn’t get a picture from that address. Right-click the picture on the website → Copy image, then press Ctrl/⌘+V on the board.', 8000);
      return;
    }
    const c = await compress(raw);
    im.src = c.data; im.w = c.w; im.h = c.h; srcMap(p).set(c.data, id);
    frames.forEach(f => { if(f.pid === p.id) postFrame(f, { type:'img-swap', from: im.url, to: c.data }); });

}
// Pictures still saved only as links (the site was down, or the app was offline) get another try every time the app opens.
function rescuePictures(){
  if(canEdit()) W.projects.forEach(p => Object.values(p.images).forEach(im => { if(im.url && !im.src && !im.driveId) keepCopy(p, im.id); }));
}
/* =====================================================================
   CORE · attachments (files on Gantt tasks and phases)
   The file itself is kept in this browser (IndexedDB) and uploaded to the project's Drive folder;
   the project only stores its name, size and Drive id.
   ===================================================================== */
const MAX_FILE = 200 * 1024 * 1024;
async function addFiles(p, files){
  const items = [];
  for(const file of files){
    if(!(file instanceof Blob)) continue;
    if(file.size > MAX_FILE){ toast('“' + file.name + '” is over 200 MB. Put it in Google Drive and attach a link to it instead.', 7000); continue; }
    const meta = { id: 'f' + uid() + uid(), name: file.name || 'file', type: file.type || '', size: file.size, addedAt: nowISO() };
    try { await IDB.set('file:' + meta.id, file); }
    catch(e){ toast('Couldn’t save “' + meta.name + '” in this browser. It may be out of space.', 6000); continue; }
    p.files[meta.id] = meta;
    items.push(meta);
  }
  if(items.length){
    markChanged(p);
    if(!driveOn) toast('Attached. Connect Google Drive to keep attachments safe and available on your other devices.', 6000);
  }
  return items;
}
async function openFile(p, id){
  const f = p.files && p.files[id];
  if(!f){ toast('That attachment isn’t available any more.', 4000); return; }
  if(f.driveId){ window.open('https://drive.google.com/file/d/' + encodeURIComponent(f.driveId) + '/view', '_blank', 'noopener'); return; }
  let blob = null; try { blob = await IDB.get('file:' + id); } catch(e){}
  if(!blob){ toast('This file is still uploading from the computer it was added on. It will be available once that computer saves to Drive.', 7000); return; }
  const url = URL.createObjectURL(blob);
  const viewable = /^(image\/|video\/|audio\/|text\/plain|application\/pdf)/.test(f.type);
  const a = el('a', { href: url, target:'_blank', rel:'noopener' }); if(!viewable) a.download = f.name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
function pruneFiles(p){
  const refs = new Set();
  [p.mods.gantt.data].concat((p.history || []).filter(h => h.mod === 'gantt').map(h => h.snap)).forEach(d => MODULES.gantt.fileRefs(d).forEach(id => refs.add(id)));
  Object.keys(p.files || {}).forEach(id => {
    if(refs.has(id)) return;
    const f = p.files[id];
    if(f.driveId) p._trash = (p._trash || []).concat(f.driveId);
    delete p.files[id];
    IDB.del('file:' + id).catch(() => {});
  });
}

async function ensureImages(p){
  if(ROLE !== 'owner' || !driveOn) return;
  const need = Object.values(p.images).filter(im => im.driveId && !im.src);
  for(const im of need){ try { im.src = await Drive.readImage(im.driveId); } catch(e){ if(e && e.code === 'auth') throw e; } }
  if(need.length) saveCache();
}
function projectImageRefs(p){
  const refs = new Set();
  TAB_IDS.forEach(m => (MODULES[m].imageRefs(p.mods[m].data) || []).forEach(r => refs.add(r)));
  (p.history || []).forEach(h => (MODULES[h.mod].imageRefs(h.snap) || []).forEach(r => refs.add(r)));
  return refs;
}

/* =====================================================================
   CORE · project lifecycle, history, saving
   ===================================================================== */
function blankProject(name){
  const t = nowISO();
  const p = { id:uid(), name: name || 'Untitled project', icon:'📐', createdAt:t, updatedAt:t, history:[], images:{}, files:{}, mods:{} };
  TAB_IDS.forEach(m => p.mods[m] = { data: MODULES[m].defaultData(), editedAt:null });
  return p;
}
function localDay(iso){ const d = iso ? new Date(iso) : new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
// Schedules made before start dates were pinned: pin them to the day they were first saved.
function pinGanttStart(p){
  const g = p.mods.gantt && p.mods.gantt.data;
  if(!g || g.start) return false;
  const first = (p.history || []).filter(h => h.mod === 'gantt').map(h => h.t).sort()[0];
  g.start = localDay(first || p.mods.gantt.editedAt || p.createdAt);
  (p.history || []).forEach(h => { if(h.mod === 'gantt' && h.snap && !h.snap.start) h.snap.start = g.start; });
  return true;
}
function prepareProject(p){
  p.images = p.images || {}; p.files = p.files || {}; p.history = p.history || [];
  TAB_IDS.forEach(m => { if(!p.mods[m]) p.mods[m] = { data: MODULES[m].defaultData(), editedAt:null }; });
  if(pinGanttStart(p) && ROLE === 'owner') p._dirty = true;
  p._norm = {}; p._base = {};
  TAB_IDS.forEach(m => { p._norm[m] = JSON.stringify(MODULES[m].normalize(p.mods[m].data)); p._base[m] = clone(p.mods[m].data); });
  p._refs = new Set(MODULES.moodboard.imageRefs(p.mods.moodboard.data));
  p._picks = pickMap(p);
  return p;
}
function pickMap(p){ const m = {}; ((p.mods.scope.data && p.mods.scope.data.options) || []).forEach(o => { if(o.img) m[o.id] = o.img; }); return m; }
const restoreNotes = {};
const GROUP_MS = 10 * 60 * 1000;
function recordHistory(p){
  const t = nowISO();
  TAB_IDS.forEach(m => {
    const M = MODULES[m], cur = p.mods[m].data, n = JSON.stringify(M.normalize(cur));
    if(p._norm[m] === n) return;
    p._norm[m] = n;
    const list = p.history.filter(h => h.mod === m), last = list[list.length - 1], prev = list[list.length - 2];
    const note = restoreNotes[p.id + ':' + m]; delete restoreNotes[p.id + ':' + m];
    if(last && !note && !last.restore && Date.now() - new Date(last.t).getTime() < GROUP_MS){
      last.t = t; last.snap = clone(cur); last.summary = M.summarize(prev ? prev.snap : p._base[m], cur) || 'Edited';
    } else {
      p.history.push({ id:uid(), t, mod:m, summary: note || M.summarize(last ? last.snap : p._base[m], cur) || 'Edited', snap: clone(cur), restore: !!note || undefined });
    }
    const all = p.history.filter(h => h.mod === m);
    if(all.length > 30){ const drop = new Set(all.slice(0, all.length - 30).map(h => h.id)); p.history = p.history.filter(h => !drop.has(h.id)); }
  });
}
function recordImageEvents(p){
  const t = nowISO();
  const ev = (id, text) => { const im = p.images[id]; if(im){ im.events = (im.events || []).concat({ t, text }).slice(-30); } };
  const refs = new Set(MODULES.moodboard.imageRefs(p.mods.moodboard.data));
  refs.forEach(id => { if(!p._refs.has(id)){ const im = p.images[id]; ev(id, im && im.url ? 'Added to the mood board from ' + host(im.url) : 'Added to the mood board'); } });
  p._refs.forEach(id => { if(!refs.has(id)) ev(id, 'Removed from the mood board'); });
  p._refs = refs;
  const picks = pickMap(p), opts = (p.mods.scope.data && p.mods.scope.data.options) || [];
  Object.keys(picks).forEach(oid => { if(p._picks[oid] !== picks[oid]){ const o = opts.find(x => x.id === oid); ev(picks[oid], 'Picked for “' + ((o && o.title) || 'Untitled option') + '”'); } });
  p._picks = picks;
}
function pruneImages(p){
  const refs = projectImageRefs(p);
  Object.keys(p.images).forEach(id => {
    if(refs.has(id)) return;
    const im = p.images[id];
    if(im.driveId){ p._trash = (p._trash || []).concat(im.driveId); }
    delete p.images[id];
  });
}

let driveOn = false, syncState = HAS_GOOGLE ? 'local' : 'local', lastSync = null, flushTimer = null, flushing = null, ingestChain = Promise.resolve();
function markChanged(p){
  if(!canEdit()) return;
  if(p){ p.updatedAt = nowISO(); p._dirty = true; p.pristine = undefined; } else W._indexDirty = true;
  scheduleFlush(); renderStatus(); renderTabs();
}
function setModData(pid, mod, data){
  const p = W.projects.find(x => x.id === pid); if(!p) return;
  const N = MODULES[mod].normalize;
  const same = JSON.stringify(N(p.mods[mod].data)) === JSON.stringify(N(data));
  p.mods[mod].data = data;
  if(!same){ p.mods[mod].editedAt = nowISO(); markChanged(p); }
}
function scheduleFlush(ms){ clearTimeout(flushTimer); flushTimer = setTimeout(() => { flushTimer = null; flush(); }, ms == null ? 1500 : ms); }
async function flush(){
  if(!canEdit()) return;
  if(flushing){ await flushing; if(!W.projects.some(p => p._dirty) && !W._indexDirty) return; }
  flushing = (async () => {
    await ingestChain;
    W.projects.forEach(p => { recordHistory(p); recordImageEvents(p); if(driveOn){ pruneImages(p); pruneFiles(p); } });
    await saveCache();
    if(driveOn){
      syncState = 'saving'; renderStatus();
      try {
        for(const p of W.projects) if(p._dirty){ await Drive.saveProject(p); scheduleReport(p); }
        if(W._indexDirty){ await Drive.saveIndex(); W._indexDirty = false; }
        syncState = 'saved'; lastSync = nowISO();
        await saveCache();
      } catch(e){ driveError(e); }
    } else syncState = 'local';
    renderStatus(); renderTabs();
  })();
  try { await flushing; } finally { flushing = null; }
}
function driveError(e){
  if(e && e.code === 'auth'){ driveOn = false; syncState = 'reconnect'; }
  else if(e && e.code === 'network'){ syncState = 'offline'; scheduleFlush(15000); }
  else { syncState = 'error'; console.warn('Drive error', e); }
  renderStatus();
}
async function connectDrive(){
  if(!HAS_GOOGLE){ toast('Google Drive isn’t set up yet. Follow SETUP.md in the repo.', 5000); return; }
  await flush();
  Drive.connect();
}
// Tries the saved sign-in; quietly keeps retrying while offline.
function resumeDrive(){
  Drive.refresh().then(syncWithDrive, e => {
    if(e && e.code === 'network'){ setTimeout(resumeDrive, 15000); return; }
    if(LS.get('dw-drive') === '1'){ syncState = 'reconnect'; renderSidebar(); renderStatus(); renderHeader(); }
  });
}
async function signOutDrive(){
  await flush();
  await Drive.signOut();
  driveOn = false; syncState = 'local';
  renderSidebar(); renderStatus(); renderHeader();
  toast('Signed out of Google Drive. Your projects stay saved in your Drive.', 4500);
}
async function syncWithDrive(){
  syncState = 'saving'; renderStatus();
  try {
    await Drive.ensureRoot();
    const ix = Drive.indexId ? await Drive.readJSON(Drive.indexId) : null;
    if(ix && ix.projects){
      const remoteIds = (ix.order || Object.keys(ix.projects)).filter(id => ix.projects[id]);
      if(remoteIds.length){ W.projects = W.projects.filter(p => !(p.pristine && !p.drive)); }
      if(ix.title && !W._indexDirty) W.title = renamed(ix.title);
      for(const pid of remoteIds){
        const meta = ix.projects[pid];
        let remote; try { remote = await Drive.readJSON(meta.fileId); } catch(e){ if(e && e.code === 'auth') throw e; continue; }
        remote.drive = Object.assign({}, remote.drive || {}, { fileId: meta.fileId, folderId: meta.folderId });
        const local = W.projects.find(x => x.id === pid);
        if(local && local._dirty && (local.updatedAt || '') > (remote.updatedAt || '')){ local.drive = Object.assign({}, remote.drive, local.drive || {}); continue; }
        if(local) Object.values(remote.images || {}).forEach(im => { const li = local.images[im.id]; if(li && li.src) im.src = li.src; });
        prepareProject(remote);
        if(local) W.projects[W.projects.indexOf(local)] = remote; else W.projects.push(remote);
      }
      if(ix.order) W.projects.sort((a, b) => { const ia = ix.order.indexOf(a.id), ib = ix.order.indexOf(b.id); return (ia < 0 ? 1e9 : ia) - (ib < 0 ? 1e9 : ib); });
    }
    if(!W.projects.length) W.projects.push(prepareProject(blankProject('First project')));
    W.projects.forEach(p => { if(!p.drive || !p.drive.fileId) p._dirty = true; });
    W._indexDirty = true; driveOn = true;
    if(!W.projects.some(p => p.id === ui.project)) ui.project = W.projects[0].id;
    destroyFrames();
    await ensureImages(proj());
    await flush();
    renderAll(true);
    rescuePictures();
    W.projects.forEach(p => { if(!p.drive || !p.drive.reportId) scheduleReport(p, 8000); });
  } catch(e){ driveError(e); renderAll(false); }
}

/* =====================================================================
   MODULE · Mood board (your moodboard.html, embedded)
   ===================================================================== */
const MoodboardModule = {
  label:'Mood board', icon:'board', frame:true,
  defaultData: () => null,
  hydrate(p, d){ (d.cards || []).forEach(c => { if(c.type === 'image' && typeof c.src === 'string' && c.src.startsWith('img:')) c.src = imgURL(p, c.src.slice(4)); }); return d; },
  ingest(p, raw){
    ingestChain = ingestChain.then(async () => {
      for(const c of (raw.cards || [])){
        // A card whose picture is missing reports the app's own address as its picture.
        if(c.type === 'image' && c.src === location.origin + location.pathname) c.src = '';
        if(c.type !== 'image' || !c.src || c.src.startsWith('img:')) continue;
        const known = srcMap(p).get(c.src);
        if(known){ c.src = 'img:' + known; continue; }
        if(c.src.startsWith('data:image/')) c.src = 'img:' + await addDataImage(p, c.src);
        else if(/^https?:/i.test(c.src)) c.src = 'img:' + addUrlImage(p, c.src);
      }
      setModData(p.id, 'moodboard', raw);
    }).catch(e => console.warn(e));
  },
  normalize: d => d ? { c: d.cards || [], w: d.worldW, h: d.worldH } : null,
  imageRefs: d => ((d && d.cards) || []).filter(c => c.type === 'image' && typeof c.src === 'string' && c.src.startsWith('img:')).map(c => c.src.slice(4)),
  summarize(a, b){
    const cards = (d, t) => ((d && d.cards) || []).filter(c => c.type === t);
    const parts = [];
    const ia = cards(a, 'image').map(c => c.src), ib = cards(b, 'image').map(c => c.src);
    const add = ib.filter(x => !ia.includes(x)).length, rem = ia.filter(x => !ib.includes(x)).length;
    if(add) parts.push('Added ' + plural(add, 'picture')); if(rem) parts.push('Removed ' + plural(rem, 'picture'));
    ['note', 'label'].forEach(t => {
      const ta = cards(a, t).map(c => c.text || ''), tb = cards(b, t).map(c => c.text || '');
      if(tb.length > ta.length) parts.push('Added ' + plural(tb.length - ta.length, t));
      else if(tb.length < ta.length) parts.push('Removed ' + plural(ta.length - tb.length, t));
      else if(ta.slice().sort().join('\u0000') !== tb.slice().sort().join('\u0000')) parts.push('Edited ' + t + 's');
    });
    if(!a) return parts.length ? 'Started the board · ' + parts.join(', ') : 'Started the board';
    return parts.length ? parts.join(', ') : 'Rearranged the board';
  }
};

/* =====================================================================
   MODULE · Gantt (your gantt.html, embedded)
   ===================================================================== */
const GanttModule = {
  label:'Gantt', icon:'gantt', frame:true,
  defaultData: () => null,
  ingest(p, raw){
    const was = p.mods.gantt.data;
    setModData(p.id, 'gantt', raw);
    // Switching between timeline and board isn't an edit, but it's saved so the plan reopens the same way.
    if(raw && (!was || was.view !== raw.view || was.group !== raw.group)) markChanged(p);
  },
  normalize: d => d ? Object.assign({}, d, { theme: undefined, view: undefined, group: undefined }) : null,
  imageRefs: () => [],
  fileRefs: d => ((d && d.phases) || []).flatMap(p => (p.files || []).concat(...(p.tasks || []).map(t => t.files || []))).filter(f => f.kind === 'file').map(f => f.id),
  summarize(a, b){
    const phases = d => (d && d.phases) || [];
    const tasks = d => phases(d).flatMap(p => p.tasks || []);
    const ta = tasks(a), tb = tasks(b), ids = new Set(ta.map(t => t.id)), idsB = new Set(tb.map(t => t.id));
    const parts = [];
    const added = tb.filter(t => !ids.has(t.id)).length, removed = ta.filter(t => !idsB.has(t.id)).length;
    if(added) parts.push('Added ' + plural(added, 'task')); if(removed) parts.push('Removed ' + plural(removed, 'task'));
    const done = tb.filter(t => t.done && ta.some(x => x.id === t.id && !x.done)).length;
    const reop = tb.filter(t => !t.done && ta.some(x => x.id === t.id && x.done)).length;
    const started = tb.filter(t => !t.done && t.status === 'doing' && ta.some(x => x.id === t.id && x.status !== 'doing')).length;
    if(done) parts.push('Completed ' + plural(done, 'task')); if(reop) parts.push('Reopened ' + plural(reop, 'task'));
    if(started) parts.push('Started ' + plural(started, 'task'));
    const atts = d => phases(d).flatMap(p => (p.files || []).concat(...(p.tasks || []).map(t => t.files || []))).map(f => f.id);
    const attA = new Set(atts(a)), attB = atts(b), attached = attB.filter(id => !attA.has(id)).length;
    if(attached) parts.push('Attached ' + plural(attached, 'file'));
    if(!a) return 'Started the schedule';
    if(parts.length) return parts.join(', ');
    const order = (d, inner) => phases(d).map(p => inner ? p.id + ':' + (p.tasks || []).map(t => t.id).join(',') : p.id).join('|');
    if(order(a) !== order(b)) return 'Reordered phases';
    if(order(a, true) !== order(b, true)) return 'Reordered tasks';
    return 'Adjusted dates or details';
  }
};

/* =====================================================================
   PICTURE MARKUP · reposition + pen / arrow / box / text
   ===================================================================== */
const MARK_COLORS = ['#E5484D', '#2783DE', '#F5B800', '#2FA36B', '#111111', '#FFFFFF'];
const WIDTHS = [{ k:'Thin', w:2.5, t:14 }, { k:'Medium', w:4, t:18 }, { k:'Thick', w:7, t:26 }];
const cropOf = o => Object.assign({ x:0, y:0, s:1 }, o && o.crop);
const cropTransform = c => 'translate(' + (c.x * 100) + '%,' + (c.y * 100) + '%) scale(' + c.s + ')';
const isLight = c => /^#(fff|ffffff|f5b800)$/i.test(c);
function drawMark(m){
  const g = svgEl('g', {}), sw = m.w || 4;
  if(m.t === 'pen'){
    g.append(svgEl('path', { d: 'M' + m.pts.map(q => q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' L'), fill:'none', stroke:m.c, 'stroke-width':sw, 'stroke-linecap':'round', 'stroke-linejoin':'round' }));
  } else if(m.t === 'box'){
    g.append(svgEl('rect', { x:Math.min(m.a[0], m.b[0]), y:Math.min(m.a[1], m.b[1]), width:Math.abs(m.b[0] - m.a[0]), height:Math.abs(m.b[1] - m.a[1]), rx:3, fill:'none', stroke:m.c, 'stroke-width':sw }));
  } else if(m.t === 'arrow'){
    const [x1, y1] = m.a, [x2, y2] = m.b, ang = Math.atan2(y2 - y1, x2 - x1), L = Math.max(10, sw * 3.2);
    g.append(svgEl('line', { x1, y1, x2: x2 - L * 0.7 * Math.cos(ang), y2: y2 - L * 0.7 * Math.sin(ang), stroke:m.c, 'stroke-width':sw, 'stroke-linecap':'round' }));
    const pt = a => [x2 - L * Math.cos(a), y2 - L * Math.sin(a)];
    g.append(svgEl('polygon', { points: [[x2, y2], pt(ang - 0.45), pt(ang + 0.45)].map(q => q.join(',')).join(' '), fill:m.c, stroke:m.c, 'stroke-width':1.5, 'stroke-linejoin':'round' }));
  } else if(m.t === 'text'){
    const t = svgEl('text', { x:m.p[0], y:m.p[1], fill:m.c, 'font-size':m.size || 18, 'font-weight':700, 'paint-order':'stroke', stroke: isLight(m.c) ? 'rgba(0,0,0,.6)' : 'rgba(255,255,255,.92)', 'stroke-width':3, 'stroke-linejoin':'round', 'dominant-baseline':'middle' });
    t.textContent = m.s; t.style.fontFamily = 'var(--font)'; g.append(t);
  }

function planOf(p){
  const g = p.mods.gantt && p.mods.gantt.data;
  if(!g || !Array.isArray(g.phases)) return null;
  const start = new Date((g.start || localDay(p.createdAt)) + 'T00:00:00');
  const day = i => { const d = new Date(start); d.setDate(d.getDate() + i); return d; };
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const ti = Math.round((today - start) / 86400000);

  const tasks = g.phases.flatMap(ph => (ph.tasks || []).map(t => ({ t, ph, st: st(t) })));

    overdue: tasks.filter(x => x.st !== 'done' && x.t.end < ti),
    upNext: todo.filter(x => x.t.start <= ti + 7),
    nextMilestone: tasks.filter(x => x.t.milestone && x.st !== 'done').sort((a, b) => a.t.start - b.t.start)[0] || null,
    pct: tasks.length ? Math.round(done.length / tasks.length * 100) : 0,
    daysLeft: ti < 0 ? PLAN_DAYS : Math.max(0, PLAN_DAYS - ti),

// Keeps simple formatting from a note; drops anything else.
function noteToHTML(html){
  const doc = new DOMParser().parseFromString('<div>' + (html || '') + '</div>', 'text/html');
  const ok = new Set(['P','BR','B','STRONG','I','EM','U','UL','OL','LI','H1','H2','H3','BLOCKQUOTE','A','DIV','SPAN']);
  const walk = n => [...n.childNodes].map(c => {
    if(c.nodeType === 3) return escH(c.textContent);
    if(c.nodeType !== 1) return '';
    const inner = walk(c), tag = c.tagName;
    if(!ok.has(tag)) return inner;
    if(tag === 'A'){ const h = c.getAttribute('href') || ''; return /^https?:/i.test(h) ? `<a href="${escH(h)}">${inner}</a>` : inner; }
    if(tag === 'DIV' || tag === 'SPAN') return tag === 'DIV' ? `<p>${inner}</p>` : inner;
    const t = tag === 'H1' || tag === 'H2' ? 'h3' : tag.toLowerCase();
    return t === 'br' ? '<br>' : `<${t}>${inner}</${t}>`;

function thumbnail(src, max){

const reportTimers = {};
function scheduleReport(p, ms){
  if(!driveOn || ROLE !== 'owner') return;
  clearTimeout(reportTimers[p.id]);
  reportTimers[p.id] = setTimeout(() => { delete reportTimers[p.id]; refreshReport(p).catch(e => console.warn('Status report', e)); }, ms == null ? 20000 : ms);
}
async function refreshReport(p){
  if(!driveOn) return null;
  if(!p.drive || !p.drive.folderId) await flush();
  if(!p.drive || !p.drive.folderId) return null;
  const name = (p.name || 'Untitled project') + ' — Status report';
  const blob = new Blob([await reportHTML(p)], { type:'text/html' });
  if(p.drive.reportId){
    try {
      await Drive.update(p.drive.reportId, blob);
      if(p.drive.reportName !== name){ await Drive.json('PATCH', '/files/' + p.drive.reportId + '?fields=id', { name }); p.drive.reportName = name; p._dirty = true; scheduleFlush(); }
      return p.drive.reportId;
    } catch(e){ if(!(e && e.status === 404)) throw e; p.drive.reportId = null; }
  }
  const r = await Drive.upload({ name, mimeType:'application/vnd.google-apps.document', parents:[p.drive.folderId], appProperties:{ dwReport: p.id } }, blob);
  p.drive.reportId = r.id; p.drive.reportName = name; p._dirty = true; scheduleFlush();
  return r.id;
}

const PPTX_TYPE = 'application/vnd.openxmlformats-officedocument.presentationml.presentation';
let pptxLib = null;
function loadPptx(){

async function buildDeck(p){

  const pptx = new PptxGenJS(); pptx.layout = 'LAYOUT_WIDE'; pptx.title = (p.name || 'Project') + ' — Status update';
  const C = { ink:'2C2C2B', muted:'7D7A75', line:'E6E5E3', soft:'F4F3F1', acc:'2783DE', ok:'46A171', warn:'D5803B', bad:'E56458' }, F = 'Arial', W = 13.333;
  const hex = c => String(c || '#2783DE').replace('#', '').slice(0, 6).toUpperCase();

    objects:[ { rect:{ x:0, y:7.12, w:W, h:0.38, fill:{ color:C.soft } } }, { text:{ text:(p.name || 'Project') + '  ·  Status update ' + fmtD(today), options:{ x:0.5, y:7.16, w:9, h:0.3, fontSize:9, color:C.muted, fontFace:F } } } ],
    slideNumber:{ x:12.2, y:7.16, w:0.7, h:0.3, fontSize:9, color:C.muted, fontFace:F } });
  const head = (s, t, sub) => { s.addText(t, { x:0.5, y:0.32, w:W - 1, h:0.62, fontSize:26, bold:true, color:C.ink, fontFace:F }); if(sub) s.addText(sub, { x:0.5, y:0.92, w:W - 1, h:0.36, fontSize:13, color:C.muted, fontFace:F }); };
  const dot = (s, x, y, color) => s.addShape(pptx.ShapeType.ellipse, { x, y, w:0.14, h:0.14, fill:{ color:hex(color) }, line:{ color:hex(color) } });
  // A list of tasks, continuing onto more slides when long
  const taskSlides = (titleText, items, empty, extra) => {
    const per = 6;
    for(let i = 0; i < Math.max(1, items.length); i += per){
      const s = pptx.addSlide({ masterName:'BODY' });

      if(!items.length){ s.addText(empty, { x:0.5, y:1.6, w:W - 1, h:0.5, fontSize:16, color:C.muted, fontFace:F }); return; }
