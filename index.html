<script type="application/json" id="tpl-data">{"moodboard":"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>Mood Board\u003c/title>\n\u003cstyle>\n* { margin:0; padding:0; box-sizing:border-box; }\nbody { --bg:#EFEFED; --surf:#fff; --surf2:#F0EFED; --bdr:#E6E5E3; --txt:#2C2C2B; --muted:#7D7A75; --acc:#2783DE; --shadow:rgba(0,0,0,0.1); --shadow2:rgba(0,0,0,0.06); }\nbody.dark { --bg:#181818; --surf:#242424; --surf2:#2e2e2e; --bdr:rgba(255,255,255,0.1); --txt:rgba(255,255,255,0.88); --muted:rgba(255,255,255,0.4); --acc:#5E9FE8; --shadow:rgba(0,0,0,0.5); --shadow2:rgba(0,0,0,0.3); }\n\nbody { background:var(--bg); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; overflow:hidden; width:100vw; height:100vh; user-select:none; transition:background .2s; }\n\n#canvas { position:relative; width:100%; height:100%; overflow:hidden; cursor:default; }\n\n#world {\n  position:absolute; left:0; top:0;\n  width:4000px; height:4000px;\n  transform-origin:0 0;\n}\n\n/* Toolbar */\n#toolbar { position:fixed; top:18px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:5px; background:var(--surf); border:1px solid var(--bdr); border-radius:14px; padding:7px 10px; z-index:1000; box-shadow:0 4px 20px var(--shadow2),0 1px 4px var(--shadow2); transition:background .2s,border-color .2s; }\n.tbtn { display:flex; align-items:center; gap:5px; padding:6px 12px; border-radius:9px; border:none; background:transparent; color:var(--muted); font-size:12.5px; font-weight:500; cursor:pointer; transition:all .15s; white-space:nowrap; font-family:inherit; }\n.tbtn:hover { background:var(--surf2); color:var(--txt); }\n.tbtn svg { width:15px; height:15px; flex-shrink:0; }\n.div { width:1px; height:20px; background:var(--bdr); margin:0 2px; }\n\n/* Zoom controls */\n#zoom-ctrl { position:fixed; bottom:22px; right:22px; display:flex; align-items:center; gap:4px; background:var(--surf); border:1px solid var(--bdr); border-radius:10px; padding:5px 8px; z-index:1000; box-shadow:0 2px 8px var(--shadow2); }\n.zbtn { width:26px; height:26px; border:none; background:transparent; color:var(--muted); cursor:pointer; border-radius:6px; font-size:16px; display:flex; align-items:center; justify-content:center; transition:all .12s; }\n.zbtn:hover { background:var(--surf2); color:var(--txt); }\n#zoom-pct { font-size:11px; font-weight:600; color:var(--muted); min-width:38px; text-align:center; font-family:inherit; }\n\n/* Expand indicator */\n#expand-badge { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--surf); border:1px solid var(--bdr); border-radius:8px; padding:5px 12px; font-size:11px; color:var(--muted); z-index:1000; pointer-events:none; opacity:0; transition:opacity .4s; }\n#expand-badge.show { opacity:1; }\n\n/* Hint */\n#hint { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); color:var(--muted); font-size:11px; pointer-events:none; z-index:1000; letter-spacing:.02em; opacity:.7; }\n\n/* Saved badge */\n#saved { position:fixed; bottom:22px; left:22px; background:rgba(70,161,113,.12); border:1px solid rgba(70,161,113,.3); color:#46A171; font-size:11px; font-weight:600; padding:5px 10px; border-radius:6px; z-index:1000; opacity:0; transition:opacity .3s; pointer-events:none; }\n#saved.show { opacity:1; }\n\n/* Drop overlay */\n#drop-ov { display:none; position:fixed; inset:0; background:rgba(39,131,222,.08); border:2px dashed rgba(39,131,222,.5); z-index:500; pointer-events:none; align-items:center; justify-content:center; color:rgba(39,131,222,.8); font-size:18px; font-weight:500; gap:10px; flex-direction:column; }\n#drop-ov.on { display:flex; }\n\n/* Cards */\n.card { position:absolute; cursor:grab; border-radius:8px; box-shadow:0 2px 12px var(--shadow2),0 1px 3px var(--shadow2); transition:box-shadow .15s; }\n.card:hover { box-shadow:0 6px 24px var(--shadow),0 2px 6px var(--shadow2); }\n.card.drag { cursor:grabbing !important; box-shadow:0 14px 40px var(--shadow); z-index:200 !important; }\n.card.sel { outline:2px solid var(--acc); outline-offset:2px; }\n\n.rz { position:absolute; bottom:0; right:0; width:18px; height:18px; cursor:nwse-resize; display:flex; align-items:flex-end; justify-content:flex-end; padding:4px; opacity:0; transition:opacity .15s; }\n.card:hover .rz,.card.sel .rz { opacity:1; }\n.rz::before { content:''; display:block; width:10px; height:10px; border-right:2px solid rgba(128,128,128,.5); border-bottom:2px solid rgba(128,128,128,.5); border-radius:0 0 3px 0; }\n\n.xbtn { position:absolute; top:-9px; right:-9px; width:20px; height:20px; border-radius:50%; background:var(--surf); border:1px solid var(--bdr); color:var(--muted); font-size:12px; cursor:pointer; display:none; align-items:center; justify-content:center; z-index:10; transition:all .12s; box-shadow:0 1px 4px var(--shadow2); }\n.xbtn:hover { background:#E56458; color:#fff; border-color:#E56458; }\n.card:hover .xbtn,.card.sel .xbtn { display:flex; }\n\n/* Note card */\n.nc { min-width:160px; min-height:80px; padding:12px 12px 24px; }\n.nc textarea { width:100%; height:100%; border:none; background:transparent; color:inherit; font-family:inherit; font-size:13.5px; line-height:1.55; resize:none; outline:none; cursor:text; min-height:52px; }\n.nc textarea::placeholder { opacity:.38; }\n.nc-color-btn { position:absolute; bottom:6px; left:8px; width:14px; height:14px; border-radius:50%; border:1.5px solid rgba(128,128,128,.3); cursor:pointer; opacity:0; transition:opacity .15s; }\n.card:hover .nc-color-btn,.card.sel .nc-color-btn { opacity:1; }\n\n/* Image card */\n.ic { min-width:100px; min-height:80px; overflow:hidden; }\n.ic img { width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; border-radius:8px; }\n\n/* Label */\n.lc { padding:7px 12px; min-width:60px; min-height:32px; display:flex; align-items:center; }\n.lc span { font-size:12px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; cursor:text; outline:none; white-space:nowrap; }\n\n/* Context menu */\n#ctx { display:none; position:fixed; background:var(--surf); border:1px solid var(--bdr); border-radius:10px; padding:5px; z-index:5000; box-shadow:0 8px 24px var(--shadow),0 2px 8px var(--shadow2); min-width:160px; }\n#ctx.open { display:block; }\n.cm-item { padding:7px 12px; font-size:12.5px; color:var(--txt); cursor:pointer; border-radius:6px; display:flex; align-items:center; gap:8px; transition:background .1s; }\n.cm-item:hover { background:var(--surf2); }\n.cm-sep { height:1px; background:var(--bdr); margin:4px 0; }\n.cm-item.danger { color:#E56458; }\n.cm-colors { display:flex; gap:5px; padding:5px 12px 7px; flex-wrap:wrap; }\n.cm-sw { width:20px; height:20px; border-radius:50%; cursor:pointer; border:2px solid transparent; transition:all .12s; flex-shrink:0; }\n.cm-sw:hover,.cm-sw.act { border-color:#fff; transform:scale(1.2); }\nbody:not(.dark) .cm-sw:hover, body:not(.dark) .cm-sw.act { border-color:#2C2C2B; }\n\n/* Modals */\n.mo { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:4000; align-items:center; justify-content:center; backdrop-filter:blur(3px); }\n.mo.open { display:flex; }\n.md { background:var(--surf); border:1px solid var(--bdr); border-radius:14px; padding:22px; width:360px; box-shadow:0 16px 48px var(--shadow); }\n.md h3 { font-size:14px; font-weight:600; margin-bottom:12px; }\n.md input { width:100%; background:var(--surf2); border:1px solid var(--bdr); border-radius:8px; padding:9px 12px; color:var(--txt); font-size:13px; outline:none; margin-bottom:12px; font-family:inherit; transition:border-color .15s; }\n.md input:focus { border-color:var(--acc); }\n.md input::placeholder { color:var(--muted); }\n.md-btns { display:flex; gap:8px; justify-content:flex-end; }\n.mdbtn { padding:7px 14px; border-radius:8px; border:1px solid var(--bdr); background:var(--surf2); color:var(--muted); font-size:12px; font-weight:500; cursor:pointer; transition:all .15s; font-family:inherit; }\n.mdbtn:hover { color:var(--txt); }\n.mdbtn.p { background:var(--acc); border-color:var(--acc); color:#fff; }\n.mdbtn.p:hover { filter:brightness(1.1); }\n.md-colors { display:flex; gap:7px; margin-bottom:12px; flex-wrap:wrap; }\n.md-sw { width:24px; height:24px; border-radius:50%; cursor:pointer; border:2px solid transparent; transition:all .12s; }\n.md-sw.act { border-color:var(--txt); transform:scale(1.15); }\n\u003c/style>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap\">\u003cstyle>#btn-theme,#theme-btn,#saved{display:none!important}\u003c/style>\u003c/head>\n\u003cbody>\n\u003cdiv id=\"canvas\">\n  \u003cdiv id=\"world\">\u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"toolbar\">\n  \u003cbutton class=\"tbtn\" id=\"btn-note\">\n    \u003csvg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\">\u003crect x=\"2\" y=\"2\" width=\"12\" height=\"12\" rx=\"2\"/>\u003cline x1=\"5\" y1=\"6\" x2=\"11\" y2=\"6\"/>\u003cline x1=\"5\" y1=\"9\" x2=\"9\" y2=\"9\"/>\u003c/svg>Note\n  \u003c/button>\n  \u003cdiv class=\"div\">\u003c/div>\n  \u003cbutton class=\"tbtn\" id=\"btn-img\">\n    \u003csvg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\">\u003crect x=\"2\" y=\"3\" width=\"12\" height=\"10\" rx=\"2\"/>\u003ccircle cx=\"6\" cy=\"7\" r=\"1.2\"/>\u003cpath d=\"M2 11l3-3 2.5 2.5L10 8l4 4\"/>\u003c/svg>Image\n  \u003c/button>\n  \u003cdiv class=\"div\">\u003c/div>\n  \u003cbutton class=\"tbtn\" id=\"btn-lbl\">\n    \u003csvg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\">\u003cpath d=\"M3 8h10M9 5l4 3-4 3\"/>\u003c/svg>Label\n  \u003c/button>\n  \u003cdiv class=\"div\">\u003c/div>\n  \u003cbutton class=\"tbtn\" id=\"btn-expand\" title=\"Add 2000px of canvas space downward\">\n    \u003csvg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\">\u003cline x1=\"8\" y1=\"3\" x2=\"8\" y2=\"13\"/>\u003cpolyline points=\"5,10 8,13 11,10\"/>\u003cline x1=\"3\" y1=\"15\" x2=\"13\" y2=\"15\"/>\u003c/svg>Expand ↓\n  \u003c/button>\n  \u003cdiv class=\"div\">\u003c/div>\n  \u003cbutton class=\"tbtn\" id=\"btn-undo\" title=\"Undo (Ctrl+Z)\">\n    \u003csvg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\">\u003cpath d=\"M3 8a5 5 0 1 1 1.5 3.5\"/>\u003cpolyline points=\"3,5 3,8 6,8\"/>\u003c/svg>Undo\n  \u003c/button>\n  \u003cdiv class=\"div\">\u003c/div>\n  \u003cbutton class=\"tbtn\" id=\"btn-theme\">\n    \u003csvg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\">\u003ccircle cx=\"8\" cy=\"8\" r=\"5\"/>\u003cpath d=\"M8 3v10M3 8h10\" opacity=\".4\"/>\u003c/svg>\u003cspan id=\"theme-lbl\">Dark\u003c/span>\n  \u003c/button>\n  \u003cdiv class=\"div\">\u003c/div>\n  \u003cbutton class=\"tbtn\" id=\"btn-clear\" style=\"color:#E56458\">\n    \u003csvg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\">\u003cpath d=\"M3 3l10 10M13 3L3 13\"/>\u003c/svg>Clear\n  \u003c/button>\n\u003c/div>\n\n\u003cdiv id=\"zoom-ctrl\">\n  \u003cbutton class=\"zbtn\" id=\"z-out\" title=\"Zoom out\">&#x2212;\u003c/button>\n  \u003cspan id=\"zoom-pct\">100%\u003c/span>\n  \u003cbutton class=\"zbtn\" id=\"z-in\" title=\"Zoom in\">&#x2b;\u003c/button>\n  \u003cbutton class=\"zbtn\" id=\"z-fit\" title=\"Reset view\" style=\"font-size:11px;width:auto;padding:0 4px\">&#x2b3b;\u003c/button>\n\u003c/div>\n\n\u003cdiv id=\"hint\">Space+drag to pan · Scroll to zoom · Right-click cards · Del to delete · Ctrl+D duplicate · Expand ↓ adds canvas space\u003c/div>\n\u003cdiv id=\"saved\">✓ Saved\u003c/div>\n\u003cdiv id=\"expand-badge\" aria-live=\"polite\">\u003c/div>\n\u003cdiv id=\"drop-ov\">\n  \u003csvg width=\"36\" height=\"36\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\">\u003crect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/>\u003ccircle cx=\"8.5\" cy=\"8.5\" r=\"1.5\"/>\u003cpath d=\"M3 15l5-5 4 4 3-3 6 6\"/>\u003c/svg>\n  Drop image here\n\u003c/div>\n\n\u003c!-- Context menu -->\n\u003cdiv id=\"ctx\">\n  \u003cdiv class=\"cm-item\" id=\"cm-color-label\" style=\"font-size:11px;color:var(--muted);padding-bottom:2px;cursor:default\">Color\u003c/div>\n  \u003cdiv class=\"cm-colors\" id=\"cm-colors\">\u003c/div>\n  \u003cdiv class=\"cm-sep\">\u003c/div>\n  \u003cdiv class=\"cm-item\" id=\"cm-dup\">🗂 Duplicate\u003c/div>\n  \u003cdiv class=\"cm-item\" id=\"cm-front\">⬆ Bring to front\u003c/div>\n  \u003cdiv class=\"cm-item\" id=\"cm-back\">⬇ Send to back\u003c/div>\n  \u003cdiv class=\"cm-sep\">\u003c/div>\n  \u003cdiv class=\"cm-item danger\" id=\"cm-del\">🗑 Delete\u003c/div>\n\u003c/div>\n\n\u003c!-- Image URL modal -->\n\u003cdiv class=\"mo\" id=\"img-modal\">\n  \u003cdiv class=\"md\">\n    \u003ch3>Add Image\u003c/h3>\n    \u003cinput id=\"img-url\" type=\"text\" placeholder=\"Paste image URL or web address…\" />\n    \u003cdiv class=\"md-btns\">\n      \u003cbutton class=\"mdbtn\" id=\"img-cancel\">Cancel\u003c/button>\n      \u003cbutton class=\"mdbtn p\" id=\"img-ok\">Add\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- Note modal -->\n\u003cdiv class=\"mo\" id=\"note-modal\">\n  \u003cdiv class=\"md\">\n    \u003ch3>Add Note\u003c/h3>\n    \u003cdiv class=\"md-colors\" id=\"note-colors\">\u003c/div>\n    \u003cinput id=\"note-text\" type=\"text\" placeholder=\"Note text (optional, can type later)…\" />\n    \u003cdiv class=\"md-btns\">\n      \u003cbutton class=\"mdbtn\" id=\"note-cancel\">Cancel\u003c/button>\n      \u003cbutton class=\"mdbtn p\" id=\"note-ok\">Add\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript>window.__WS_INIT=/*__WS_INIT__*/null;\u003c/script>\u003cscript>(function(){\n  // Workspace bridge: connects this embedded template to the workspace app.\n  // Replaces the template's localStorage with the workspace's shared save,\n  // and lets the app control theme and font. The template code is otherwise untouched.\n  var I = window.__WS_INIT || {};\n  function post(m){ m.__ws = 1; m.mod = I.mod; try { window.parent.postMessage(m, '*'); } catch(e){} }\n\n  window.__bridge = {\n    load: function(){ return I.data ? JSON.stringify(I.data) : null; },\n    save: function(o){ post({ type:'save', data: JSON.parse(JSON.stringify(o)) }); }\n  };\n\n  function setFont(f){\n    var s = document.getElementById('__ws_font');\n    if(!s){ s = document.createElement('style'); s.id = '__ws_font'; (document.head || document.documentElement).appendChild(s); }\n    s.textContent = 'body,body input,body textarea,body button,body select{font-family:' + f + ' !important}';\n  }\n  function setTheme(dark){\n    try {\n      if(I.mod === 'gantt'){ S.theme = dark ? 'dark' : 'light'; applyTheme(); }\n      else if(I.mod === 'moodboard'){\n        S.theme = dark ? 'dark' : 'light';\n        document.body.classList.toggle('dark', dark);\n        var l = document.getElementById('theme-lbl'); if(l) l.textContent = dark ? 'Light' : 'Dark';\n        world.querySelectorAll('.card.nc').forEach(function(c){ applyNoteColor(c, parseInt(c.dataset.ci || '0')); });\n        updateTransform();\n      }\n    } catch(e){}\n  }\n\n  setFont(I.font || 'inherit');\n  window.addEventListener('message', function(e){\n    var m = e.data; if(!m || !m.__wsParent) return;\n    if(m.type === 'theme') setTheme(!!m.dark);\n    if(m.type === 'font') setFont(m.font);\n  });\n  document.addEventListener('DOMContentLoaded', function(){ setTheme(!!I.dark); });\n  document.addEventListener('keydown', function(e){\n    if((e.metaKey || e.ctrlKey) && (e.key === 's' || e.key === 'S')){ e.preventDefault(); post({ type:'save-shortcut' }); }\n  }, true);\n\n  if(I.mod === 'moodboard'){\n    function addFiles(files, pos){\n      files.filter(function(f){ return f.type.indexOf('image/') === 0; }).forEach(function(f, i){\n        var r = new FileReader();\n        r.onload = function(ev){\n          var o = { src: ev.target.result, w: 240, h: 200 };\n          if(pos) o.pos = { x: pos.x + i * 30, y: pos.y + i * 30 };\n          makeCard('image', o);\n        };\n        r.readAsDataURL(f);\n      });\n    }\n    var fileIn = document.createElement('input');\n    fileIn.type = 'file'; fileIn.accept = 'image/*'; fileIn.multiple = true; fileIn.style.display = 'none';\n    fileIn.addEventListener('change', function(){\n      var files = Array.prototype.slice.call(fileIn.files || []);\n      var cancel = document.getElementById('img-cancel'); if(cancel) cancel.click();\n      addFiles(files); fileIn.value = '';\n    });\n    document.addEventListener('DOMContentLoaded', function(){\n      document.body.appendChild(fileIn);\n      // \"Upload from computer\" inside the existing Add Image dialog\n      var url = document.getElementById('img-url');\n      if(url){\n        var up = document.createElement('button');\n        up.type = 'button'; up.className = 'mdbtn p'; up.textContent = 'Upload from computer…';\n        up.style.cssText = 'width:100%;padding:10px;font-size:13px;margin-bottom:10px;display:block';\n        up.addEventListener('click', function(){ fileIn.click(); });\n        var tip = document.createElement('div');\n        tip.textContent = 'Paste a picture’s address, or right-click a picture → Copy image and paste it in the box (Ctrl/⌘+V).';\n        tip.style.cssText = 'font-size:11.5px;color:var(--muted);line-height:1.45;margin:10px 0 2px';\n        url.parentNode.insertBefore(up, url);\n        url.parentNode.insertBefore(tip, url.nextSibling);\n        url.placeholder = 'Paste a copied picture or image address…';\n        var err = document.createElement('div');\n        err.style.cssText = 'display:none;font-size:12px;line-height:1.45;color:#E56458;background:rgba(229,100,88,.1);border-radius:7px;padding:8px 10px;margin-top:8px';\n        url.parentNode.insertBefore(err, url.nextSibling);\n        var showErr = function(t){ err.textContent = t; err.style.display = t ? 'block' : 'none'; };\n        url.addEventListener('input', function(){ showErr(''); });\n        // Paste the picture itself into the box\n        url.addEventListener('paste', function(e){\n          var files = Array.prototype.slice.call((e.clipboardData && e.clipboardData.files) || []).filter(function(f){ return f.type.indexOf('image/') === 0; });\n          if(!files.length) return;\n          e.preventDefault(); showErr('');\n          var cancel = document.getElementById('img-cancel'); if(cancel) cancel.click();\n          addFiles(files);\n        });\n        // Image addresses: check the picture can load here before adding it\n        var ok = document.getElementById('img-ok'), verified = null;\n        if(ok) ok.addEventListener('click', function(e){\n          var v = url.value.trim();\n          if(!/^https?:/i.test(v) || verified === v) return;\n          e.preventDefault(); e.stopImmediatePropagation();\n          ok.disabled = true; var label = ok.textContent; ok.textContent = 'Checking…';\n          var probe = new Image(), finished = false;\n          var finish = function(good){\n            if(finished) return; finished = true; ok.disabled = false; ok.textContent = label;\n            if(good){ verified = v; ok.click(); verified = null; showErr(''); }\n            else showErr('That picture didn’t load. Check the address is the picture itself (right-click → Copy image address). Some sites block sharing their pictures: in that case right-click → Copy image, then paste it in this box.');\n          };\n          probe.onload = function(){ finish(true); }; probe.onerror = function(){ finish(false); };\n          setTimeout(function(){ finish(false); }, 8000);\n          probe.src = v;\n        }, true);\n        var modal = document.getElementById('img-modal');\n        if(modal) new MutationObserver(function(){ if(!modal.classList.contains('open')) showErr(''); }).observe(modal, { attributes:true, attributeFilter:['class'] });\n      }\n      // Web-linked pictures that can't load: remove the dead card and explain\n      var mk = window.makeCard;\n      window.makeCard = function(type, opts){\n        var card = mk.apply(this, arguments);\n        if(type === 'image' && opts && /^https?:/i.test(opts.src || '')){\n          var img = card.querySelector('img');\n          if(img) img.addEventListener('error', function(){\n            if(card.isConnected){ card.remove(); try { save(); } catch(e){} }\n            post({ type:'notice', text:'That picture link stopped loading. Right-click the picture on the website → Copy image, then press Ctrl/⌘+V on the board.' });\n          });\n        }\n        return card;\n      };\n    });\n    // Tell the app which picture was clicked (for the image info panel)\n    document.addEventListener('click', function(e){\n      var c = e.target.closest && e.target.closest('.card');\n      if(c && c.dataset.type === 'image'){ var img = c.querySelector('img'); post({ type:'img-select', src: img ? img.src : '' }); }\n      else if(e.target.closest && e.target.closest('#canvas') && !e.target.closest('#toolbar,#zoom-ctrl')) post({ type:'img-select', src: null });\n    }, true);\n    // Paste images from the clipboard straight onto the board\n    document.addEventListener('paste', function(e){\n      if(e.target.matches && e.target.matches('input,textarea,[contenteditable]')) return;\n      var files = (e.clipboardData && e.clipboardData.files) || [];\n      for(var i = 0; i \u003c files.length; i++){\n        (function(f){\n          if(f.type.indexOf('image/') !== 0) return;\n          e.preventDefault();\n          var r = new FileReader();\n          r.onload = function(ev){ makeCard('image', { src: ev.target.result, w: 240, h: 200 }); };\n          r.readAsDataURL(f);\n        })(files[i]);\n      }\n    });\n  }\n})();\n\u003c/script>\u003cscript>\nconst SK='mb_v3';\nconst world=document.getElementById('world');\nconst canvas=document.getElementById('canvas');\n\n// ─── World size ───────────────────────────────────────────────────\nlet worldW=4000, worldH=4000;\nfunction applyWorldSize(){\n  world.style.width=worldW+'px';\n  world.style.height=worldH+'px';\n}\napplyWorldSize();\n\n// ─── Expand down ─────────────────────────────────────────────────\nconst EXPAND_STEP=2000;\nconst badge=document.getElementById('expand-badge');\nlet badgeTimer=null;\nfunction expandDown(){\n  worldH+=EXPAND_STEP;\n  applyWorldSize();\n  save();\n  // Show badge\n  badge.textContent='Canvas height: '+(worldH/1000).toFixed(0)+'k px — pan down to reach new space';\n  badge.classList.add('show');\n  clearTimeout(badgeTimer);\n  badgeTimer=setTimeout(()=>badge.classList.remove('show'),2600);\n  // Smoothly pan so the new space is hinted at\n  const target=pan.y-80*zoom;\n  const start=pan.y;\n  const dur=400;\n  const t0=performance.now();\n  function step(now){\n    const p=Math.min(1,(now-t0)/dur);\n    const ease=1-Math.pow(1-p,3);\n    pan.y=start+(target-start)*ease;\n    updateTransform();\n    if(p\u003c1)requestAnimationFrame(step);\n  }\n  requestAnimationFrame(step);\n}\ndocument.getElementById('btn-expand').addEventListener('click',expandDown);\n\n// ─── Theme colors ────────────────────────────────────────────────\nconst NOTE_LIGHT=[\n  {bg:'#FFFFFF',text:'#2C2C2B',border:'#E6E5E3'},\n  {bg:'#E5F2FC',text:'#1a5f9e',border:'#b8d8f4'},\n  {bg:'#EEE8F8',text:'#6b3fad',border:'#d4c3f0'},\n  {bg:'#E8F1EC',text:'#2d7a52',border:'#b3d9c4'},\n  {bg:'#FEF3E2',text:'#a05c10',border:'#f5d9a8'},\n  {bg:'#FCE9E7',text:'#b33a30',border:'#f0bbb8'},\n];\nconst NOTE_DARK=[\n  {bg:'#2e2e2e',text:'rgba(255,255,255,0.85)',border:'rgba(255,255,255,0.08)'},\n  {bg:'#1e3040',text:'#7fb8e0',border:'rgba(127,184,224,0.2)'},\n  {bg:'#2b1e3a',text:'#c49ae0',border:'rgba(196,154,224,0.2)'},\n  {bg:'#1e3028',text:'#7bc99a',border:'rgba(123,201,154,0.2)'},\n  {bg:'#3a2c1e',text:'#e0b37a',border:'rgba(224,179,122,0.2)'},\n  {bg:'#3a1e20',text:'#e07f7f',border:'rgba(224,127,127,0.2)'},\n];\nfunction noteColors(){return document.body.classList.contains('dark')?NOTE_DARK:NOTE_LIGHT;}\n\n// ─── State ───────────────────────────────────────────────────────\nlet pan={x:0,y:0},zoom=1,zCounter=10;\nlet selCard=null,dragState=null,resizeState=null;\nlet spaceDown=false,isPanning=false,panStart={x:0,y:0},panOrigin={x:0,y:0};\nlet noteColorIdx=0;\nlet history=[],historyIdx=-1;\nlet ctxCard=null;\nlet saveTimer=null;\n\nconst S={theme:'light'};\n\nfunction worldToScreen(wx,wy){return{x:wx*zoom+pan.x,y:wy*zoom+pan.y};}\nfunction screenToWorld(sx,sy){return{x:(sx-pan.x)/zoom,y:(sy-pan.y)/zoom};}\nfunction updateTransform(){\n  world.style.transform=`translate(${pan.x}px,${pan.y}px) scale(${zoom})`;\n  document.getElementById('zoom-pct').textContent=Math.round(zoom*100)+'%';\n  // Infinite grid: tile the background on the canvas itself, synced to pan/zoom\n  const dark=document.body.classList.contains('dark');\n  const maj=80*zoom, min=20*zoom;\n  const ox=(pan.x%maj+maj)%maj, oy=(pan.y%maj+maj)%maj;\n  const oxm=(pan.x%min+min)%min, oym=(pan.y%min+min)%min;\n  const majC=dark?'rgba(255,255,255,0.05)':'rgba(0,0,0,0.08)';\n  const minC=dark?'rgba(255,255,255,0.02)':'rgba(0,0,0,0.03)';\n  canvas.style.backgroundImage=[\n    `linear-gradient(${majC} 1px,transparent 1px)`,\n    `linear-gradient(90deg,${majC} 1px,transparent 1px)`,\n    `linear-gradient(${minC} 1px,transparent 1px)`,\n    `linear-gradient(90deg,${minC} 1px,transparent 1px)`\n  ].join(',');\n  canvas.style.backgroundSize=`${maj}px ${maj}px,${maj}px ${maj}px,${min}px ${min}px,${min}px ${min}px`;\n  canvas.style.backgroundPosition=`${ox}px ${oy}px,${ox}px ${oy}px,${oxm}px ${oym}px,${oxm}px ${oym}px`;\n}\n\n// ─── Persist ─────────────────────────────────────────────────────\nfunction collectCards(){\n  const cards=[];\n  world.querySelectorAll('.card').forEach(c=>{\n    const b={type:c.dataset.type,x:parseFloat(c.style.left),y:parseFloat(c.style.top),w:c.offsetWidth,h:c.offsetHeight,z:parseInt(c.style.zIndex)||10,ci:parseInt(c.dataset.ci||'0')};\n    if(b.type==='note'){b.text=c.querySelector('textarea').value;}\n    else if(b.type==='image'){const img=c.querySelector('img');b.src=img?img.src:'';}\n    else if(b.type==='label'){b.text=c.querySelector('span').textContent;}\n    cards.push(b);\n  });\n  return cards;\n}\nfunction save(){\n  clearTimeout(saveTimer);\n  saveTimer=setTimeout(()=>{\n    try{\n      const data={cards:collectCards(),pan,zoom,zCounter,theme:S.theme,worldW,worldH};\n      __bridge.save(data);\n      showSaved();\n    }catch(e){}\n  },400);\n}\nfunction showSaved(){const b=document.getElementById('saved');b.classList.add('show');setTimeout(()=>b.classList.remove('show'),1400);}\nfunction loadData(){\n  try{const r=__bridge.load();return r?JSON.parse(r):null;}catch(e){return null;}\n}\n\n// ─── Undo ─────────────────────────────────────────────────────────\nfunction pushHistory(){\n  const snap=JSON.stringify(collectCards());\n  if(historyIdx\u003chistory.length-1)history=history.slice(0,historyIdx+1);\n  history.push(snap);\n  if(history.length>30)history.shift();\n  historyIdx=history.length-1;\n}\nfunction undo(){\n  if(historyIdx\u003c=0)return;\n  historyIdx--;\n  const cards=JSON.parse(history[historyIdx]);\n  world.querySelectorAll('.card').forEach(c=>c.remove());\n  selCard=null;\n  zCounter=10;\n  cards.forEach(c=>makeCard(c.type,{pos:{x:c.x,y:c.y},w:c.w,h:c.h,z:c.z,ci:c.ci,src:c.src,text:c.text},true));\n  save();\n}\n\n// ─── Cards ───────────────────────────────────────────────────────\nfunction randomPos(w,h){\n  const vw=canvas.clientWidth,vh=canvas.clientHeight;\n  const wp=screenToWorld(vw/2,vh/2);\n  return{x:wp.x-w/2+Math.random()*60-30,y:wp.y-h/2+Math.random()*60-30};\n}\n\nfunction makeCard(type,opts={},skipHistory=false){\n  const card=document.createElement('div');\n  card.className='card';\n  card.dataset.type=type;\n  const z=opts.z||++zCounter;\n  card.style.zIndex=z;\n  if(opts.z&&opts.z>zCounter)zCounter=opts.z;\n  const ci=opts.ci!=null?opts.ci:noteColorIdx;\n  card.dataset.ci=ci;\n\n  const xb=document.createElement('button');xb.className='xbtn';xb.innerHTML='×';\n  xb.addEventListener('click',e=>{e.stopPropagation();pushHistory();card.remove();if(selCard===card)selCard=null;save();});\n  card.appendChild(xb);\n\n  const rz=document.createElement('div');rz.className='rz';card.appendChild(rz);\n\n  const pos=opts.pos||randomPos(opts.w||200,opts.h||160);\n  card.style.left=pos.x+'px';card.style.top=pos.y+'px';\n  if(opts.w)card.style.width=opts.w+'px';\n  if(opts.h)card.style.height=opts.h+'px';\n\n  if(type==='image'){\n    card.classList.add('ic');\n    const img=document.createElement('img');\n    img.src=opts.src||'';\n    img.draggable=false;\n    img.onerror=()=>{card.style.background='var(--surf2)';card.style.border='1px solid var(--bdr)';card.style.display='flex';card.style.alignItems='center';card.style.justifyContent='center';img.remove();const m=document.createElement('span');m.style.cssText='color:var(--muted);font-size:11px;text-align:center;padding:12px;pointer-events:none';m.textContent='⚠️ Could not load';card.insertBefore(m,rz);};\n    card.insertBefore(img,rz);\n  } else if(type==='note'){\n    card.classList.add('nc');\n    const col=noteColors()[ci%noteColors().length];\n    applyNoteColor(card,ci);\n    const ta=document.createElement('textarea');\n    ta.placeholder='Write a note…';ta.value=opts.text||'';\n    ta.style.color=col.text;\n    ta.addEventListener('mousedown',e=>e.stopPropagation());\n    ta.addEventListener('input',save);\n    card.insertBefore(ta,rz);\n    const cb=document.createElement('div');cb.className='nc-color-btn';cb.style.background=col.bg==='#FFFFFF'?'#ccc':col.bg;\n    cb.title='Change color';cb.addEventListener('click',e=>{e.stopPropagation();cycleNoteColor(card);});\n    card.insertBefore(cb,rz);\n  } else if(type==='label'){\n    card.classList.add('lc');\n    card.style.background='var(--surf)';card.style.border='1px solid var(--bdr)';\n    const sp=document.createElement('span');sp.contentEditable='true';sp.spellcheck=false;\n    sp.style.color='var(--muted)';sp.textContent=opts.text||'LABEL';\n    sp.addEventListener('mousedown',e=>e.stopPropagation());\n    sp.addEventListener('input',save);\n    sp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sp.blur();}});\n    card.insertBefore(sp,rz);\n  }\n\n  setupCardEvents(card,rz);\n  world.appendChild(card);\n  if(!skipHistory)pushHistory();\n  if(!skipHistory)save();\n  return card;\n}\n\nfunction applyNoteColor(card,ci){\n  const cols=noteColors();\n  const col=cols[ci%cols.length];\n  card.style.background=col.bg;\n  card.style.border='1px solid '+col.border;\n  card.dataset.ci=ci;\n  const ta=card.querySelector('textarea');\n  if(ta)ta.style.color=col.text;\n  const cb=card.querySelector('.nc-color-btn');\n  if(cb)cb.style.background=col.bg==='#FFFFFF'?'#ccc':col.bg;\n}\n\nfunction cycleNoteColor(card){\n  const ci=(parseInt(card.dataset.ci||'0')+1)%noteColors().length;\n  applyNoteColor(card,ci);\n  save();\n}\n\nfunction setupCardEvents(card,rz){\n  card.addEventListener('mousedown',e=>{\n    if(e.target===rz||rz.contains(e.target))return;\n    if(e.target.tagName==='BUTTON'||e.target.closest('.xbtn'))return;\n    if(e.button!==0)return;\n    e.preventDefault();\n    selectCard(card);\n    card.style.zIndex=++zCounter;\n    const wp=screenToWorld(e.clientX,e.clientY);\n    dragState={card,ox:wp.x-parseFloat(card.style.left),oy:wp.y-parseFloat(card.style.top)};\n    card.classList.add('drag');\n  });\n  rz.addEventListener('mousedown',e=>{\n    e.preventDefault();e.stopPropagation();\n    selectCard(card);\n    resizeState={card,sx:e.clientX,sy:e.clientY,sw:card.offsetWidth,sh:card.offsetHeight};\n  });\n  card.addEventListener('contextmenu',e=>{\n    e.preventDefault();e.stopPropagation();\n    showCtxMenu(e.clientX,e.clientY,card);\n  });\n}\n\nfunction selectCard(card){\n  if(selCard&&selCard!==card)selCard.classList.remove('sel');\n  selCard=card;card.classList.add('sel');\n}\n\n// ─── Mouse events ─────────────────────────────────────────────────\ndocument.addEventListener('mousemove',e=>{\n  if(isPanning){\n    pan.x=panOrigin.x+(e.clientX-panStart.x);\n    pan.y=panOrigin.y+(e.clientY-panStart.y);\n    updateTransform();\n  }\n  if(dragState){\n    const wp=screenToWorld(e.clientX,e.clientY);\n    const nx=wp.x-dragState.ox,ny=wp.y-dragState.oy;\n    dragState.card.style.left=nx+'px';dragState.card.style.top=ny+'px';\n  }\n  if(resizeState){\n    const dx=(e.clientX-resizeState.sx)/zoom;\n    const dy=(e.clientY-resizeState.sy)/zoom;\n    resizeState.card.style.width=Math.max(80,resizeState.sw+dx)+'px';\n    resizeState.card.style.height=Math.max(50,resizeState.sh+dy)+'px';\n  }\n});\ndocument.addEventListener('mouseup',e=>{\n  if(isPanning){isPanning=false;canvas.style.cursor=spaceDown?'grab':'default';}\n  if(dragState){dragState.card.classList.remove('drag');dragState=null;save();}\n  if(resizeState){resizeState=null;save();}\n});\n\ncanvas.addEventListener('mousedown',e=>{\n  if(e.button===1||(e.button===0&&spaceDown)){\n    isPanning=true;panStart={x:e.clientX,y:e.clientY};panOrigin={x:pan.x,y:pan.y};\n    canvas.style.cursor='grabbing';e.preventDefault();\n    return;\n  }\n  if(e.target===canvas||e.target===world){if(selCard){selCard.classList.remove('sel');selCard=null;}}\n});\n\n// Scroll to zoom\ncanvas.addEventListener('wheel',e=>{\n  e.preventDefault();\n  const rect=canvas.getBoundingClientRect();\n  const cx=e.clientX-rect.left,cy=e.clientY-rect.top;\n  const factor=e.deltaY>0?0.9:1.1;\n  const nz=Math.min(4,Math.max(0.15,zoom*factor));\n  pan.x=cx-(cx-pan.x)*(nz/zoom);\n  pan.y=cy-(cy-pan.y)*(nz/zoom);\n  zoom=nz;\n  updateTransform();\n},{passive:false});\n\n// Keyboard\ndocument.addEventListener('keydown',e=>{\n  if(e.code==='Space'&&!e.target.matches('input,textarea,[contenteditable]')){\n    spaceDown=true;canvas.style.cursor='grab';e.preventDefault();\n  }\n  if((e.key==='Delete'||e.key==='Backspace')&&selCard&&!e.target.matches('input,textarea,[contenteditable]')){\n    pushHistory();selCard.remove();selCard=null;save();\n  }\n  if(e.key==='d'&&(e.ctrlKey||e.metaKey)&&selCard){\n    e.preventDefault();\n    const c=selCard;\n    const type=c.dataset.type;\n    const opts={pos:{x:parseFloat(c.style.left)+20,y:parseFloat(c.style.top)+20},w:c.offsetWidth,h:c.offsetHeight,ci:parseInt(c.dataset.ci||'0')};\n    if(type==='note')opts.text=c.querySelector('textarea').value;\n    else if(type==='image'){const img=c.querySelector('img');opts.src=img?img.src:'';}\n    else if(type==='label')opts.text=c.querySelector('span').textContent;\n    makeCard(type,opts);\n  }\n  if(e.key==='z'&&(e.ctrlKey||e.metaKey)&&!e.shiftKey){e.preventDefault();undo();}\n  if(e.key==='Escape'){if(selCard){selCard.classList.remove('sel');selCard=null;}closeCtx();}\n});\ndocument.addEventListener('keyup',e=>{if(e.code==='Space'){spaceDown=false;canvas.style.cursor='default';}});\n\n// ─── Context menu ─────────────────────────────────────────────────\nconst ctxEl=document.getElementById('ctx');\nconst cmColors=document.getElementById('cm-colors');\n\nfunction buildCmColors(){\n  cmColors.innerHTML='';\n  const hasCi=ctxCard&&ctxCard.dataset.type==='note';\n  document.getElementById('cm-color-label').style.display=hasCi?'':'none';\n  cmColors.style.display=hasCi?'':'none';\n  if(!hasCi)return;\n  noteColors().forEach((c,i)=>{\n    const sw=document.createElement('div');sw.className='cm-sw'+(parseInt(ctxCard.dataset.ci||'0')===i?' act':'');\n    sw.style.background=c.bg==='#FFFFFF'?'#E6E5E3':c.bg;\n    sw.addEventListener('click',()=>{applyNoteColor(ctxCard,i);save();closeCtx();});\n    cmColors.appendChild(sw);\n  });\n}\n\nfunction showCtxMenu(x,y,card){\n  ctxCard=card;selectCard(card);\n  buildCmColors();\n  ctxEl.style.left=x+'px';ctxEl.style.top=y+'px';\n  ctxEl.classList.add('open');\n  requestAnimationFrame(()=>{\n    const r=ctxEl.getBoundingClientRect();\n    if(r.right>window.innerWidth)ctxEl.style.left=(x-r.width)+'px';\n    if(r.bottom>window.innerHeight)ctxEl.style.top=(y-r.height)+'px';\n  });\n}\nfunction closeCtx(){ctxEl.classList.remove('open');ctxCard=null;}\n\ndocument.getElementById('cm-dup').addEventListener('click',()=>{\n  if(!ctxCard)return;\n  const type=ctxCard.dataset.type;\n  const opts={pos:{x:parseFloat(ctxCard.style.left)+24,y:parseFloat(ctxCard.style.top)+24},w:ctxCard.offsetWidth,h:ctxCard.offsetHeight,ci:parseInt(ctxCard.dataset.ci||'0')};\n  if(type==='note')opts.text=ctxCard.querySelector('textarea').value;\n  else if(type==='image'){const img=ctxCard.querySelector('img');opts.src=img?img.src:'';}\n  else if(type==='label')opts.text=ctxCard.querySelector('span').textContent;\n  makeCard(type,opts);closeCtx();\n});\ndocument.getElementById('cm-front').addEventListener('click',()=>{\n  if(!ctxCard)return;ctxCard.style.zIndex=++zCounter;save();closeCtx();\n});\ndocument.getElementById('cm-back').addEventListener('click',()=>{\n  if(!ctxCard)return;ctxCard.style.zIndex=1;save();closeCtx();\n});\ndocument.getElementById('cm-del').addEventListener('click',()=>{\n  if(!ctxCard)return;pushHistory();ctxCard.remove();if(selCard===ctxCard)selCard=null;save();closeCtx();\n});\ndocument.addEventListener('click',e=>{if(!ctxEl.contains(e.target))closeCtx();});\n\n// ─── Toolbar ──────────────────────────────────────────────────────\nlet noteResolve=null,imgResolve=null;\n\nfunction openNoteModal(){\n  const modal=document.getElementById('note-modal');\n  const colors=document.getElementById('note-colors');\n  colors.innerHTML='';\n  noteColors().forEach((c,i)=>{\n    const sw=document.createElement('div');sw.className='md-sw'+(i===noteColorIdx?' act':'');\n    sw.style.background=c.bg==='#FFFFFF'?'#E6E5E3':c.bg;\n    sw.addEventListener('click',()=>{noteColorIdx=i;colors.querySelectorAll('.md-sw').forEach((s,j)=>s.classList.toggle('act',j===i));});\n    colors.appendChild(sw);\n  });\n  document.getElementById('note-text').value='';\n  modal.classList.add('open');\n  setTimeout(()=>document.getElementById('note-text').focus(),50);\n  return new Promise(r=>{noteResolve=r;});\n}\nfunction openImgModal(){\n  document.getElementById('img-url').value='';\n  document.getElementById('img-modal').classList.add('open');\n  setTimeout(()=>document.getElementById('img-url').focus(),50);\n  return new Promise(r=>{imgResolve=r;});\n}\n\ndocument.getElementById('note-ok').addEventListener('click',()=>{document.getElementById('note-modal').classList.remove('open');if(noteResolve){noteResolve(document.getElementById('note-text').value);noteResolve=null;}});\ndocument.getElementById('note-cancel').addEventListener('click',()=>{document.getElementById('note-modal').classList.remove('open');if(noteResolve){noteResolve(null);noteResolve=null;}});\ndocument.getElementById('note-text').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('note-ok').click();}});\n\ndocument.getElementById('img-ok').addEventListener('click',()=>{document.getElementById('img-modal').classList.remove('open');if(imgResolve){imgResolve(document.getElementById('img-url').value.trim());imgResolve=null;}});\ndocument.getElementById('img-cancel').addEventListener('click',()=>{document.getElementById('img-modal').classList.remove('open');if(imgResolve){imgResolve(null);imgResolve=null;}});\ndocument.getElementById('img-url').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('img-ok').click();});\n\ndocument.getElementById('btn-note').addEventListener('click',async()=>{\n  const text=await openNoteModal();\n  if(text!==null)makeCard('note',{text,ci:noteColorIdx,w:220,h:140});\n});\ndocument.getElementById('btn-img').addEventListener('click',async()=>{\n  const src=await openImgModal();\n  if(src)makeCard('image',{src,w:240,h:200});\n});\ndocument.getElementById('btn-lbl').addEventListener('click',()=>makeCard('label',{w:120,h:36}));\ndocument.getElementById('btn-undo').addEventListener('click',undo);\ndocument.getElementById('btn-clear').addEventListener('click',()=>{\n  if(!confirm('Clear all cards?'))return;\n  pushHistory();\n  world.querySelectorAll('.card').forEach(c=>c.remove());\n  selCard=null;save();\n});\ndocument.getElementById('btn-theme').addEventListener('click',()=>{\n  S.theme=S.theme==='dark'?'light':'dark';\n  document.body.classList.toggle('dark',S.theme==='dark');\n  document.getElementById('theme-lbl').textContent=S.theme==='dark'?'Light':'Dark';\n  world.querySelectorAll('.card.nc').forEach(c=>applyNoteColor(c,parseInt(c.dataset.ci||'0')));\n  save();\n});\n\n// Zoom buttons\ndocument.getElementById('z-in').addEventListener('click',()=>{setZoom(zoom*1.2);});\ndocument.getElementById('z-out').addEventListener('click',()=>{setZoom(zoom/1.2);});\ndocument.getElementById('z-fit').addEventListener('click',()=>{pan={x:0,y:0};zoom=1;updateTransform();});\nfunction setZoom(nz){\n  const cx=canvas.clientWidth/2,cy=canvas.clientHeight/2;\n  nz=Math.min(4,Math.max(0.15,nz));\n  pan.x=cx-(cx-pan.x)*(nz/zoom);\n  pan.y=cy-(cy-pan.y)*(nz/zoom);\n  zoom=nz;updateTransform();\n}\n\n// Drag & drop images\nconst dropOv=document.getElementById('drop-ov');\ndocument.addEventListener('dragover',e=>{e.preventDefault();dropOv.classList.add('on');});\ndocument.addEventListener('dragleave',e=>{if(!e.relatedTarget)dropOv.classList.remove('on');});\ndocument.addEventListener('drop',e=>{\n  e.preventDefault();dropOv.classList.remove('on');\n  const wp=screenToWorld(e.clientX,e.clientY);\n  const pos={x:wp.x-120,y:wp.y-100};\n  const files=Array.from(e.dataTransfer.files).filter(f=>f.type.startsWith('image/'));\n  files.forEach(f=>{const r=new FileReader();r.onload=ev=>makeCard('image',{src:ev.target.result,w:240,h:200,pos});r.readAsDataURL(f);});\n  if(!files.length){\n    const txt=e.dataTransfer.getData('text/plain')||e.dataTransfer.getData('text/uri-list');\n    if(txt&&txt.startsWith('http'))makeCard('image',{src:txt,w:240,h:200,pos});\n  }\n});\n\n// ─── Init ─────────────────────────────────────────────────────────\nconst saved=loadData();\nif(saved){\n  S.theme=saved.theme||'light';\n  if(saved.pan)pan=saved.pan;\n  if(saved.zoom)zoom=saved.zoom;\n  if(saved.zCounter)zCounter=saved.zCounter;\n  if(saved.worldW){worldW=saved.worldW;worldH=saved.worldH;applyWorldSize();}\n  if(saved.cards&&saved.cards.length){\n    saved.cards.forEach(c=>makeCard(c.type,{pos:{x:c.x,y:c.y},w:c.w,h:c.h,z:c.z,ci:c.ci,src:c.src,text:c.text},true));\n  }\n} else {\n  makeCard('note',{text:'Scroll to zoom · Space+drag to pan · Right-click cards for options',ci:0,w:260,h:90,pos:{x:60,y:80}},true);\n  makeCard('label',{text:'MOOD BOARD',w:140,h:36,pos:{x:60,y:190}},true);\n  makeCard('note',{text:'',ci:1,w:200,h:160,pos:{x:360,y:80}},true);\n}\ndocument.body.classList.toggle('dark',S.theme==='dark');\ndocument.getElementById('theme-lbl').textContent=S.theme==='dark'?'Light':'Dark';\nupdateTransform();\npushHistory();\n\u003c/script>\n\u003c/body>\n\u003c/html>","gantt":"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>Robot Redesign – Gantt\u003c/title>\n\u003cstyle>\n* { margin:0; padding:0; box-sizing:border-box; }\nbody { --bg:#F9F8F7; --surf:#fff; --surf2:#F0EFED; --bdr:#E6E5E3; --txt:#2C2C2B; --muted:#7D7A75; --acc:#2783DE; --wknd:rgba(0,0,0,0.015); --tc:rgba(39,131,222,0.04); --hov:rgba(0,0,0,0.02); }\nbody.dark { --bg:#141414; --surf:#1e1e1e; --surf2:#252525; --bdr:rgba(255,255,255,0.07); --txt:rgba(255,255,255,0.88); --muted:rgba(255,255,255,0.38); --acc:#5E9FE8; --wknd:rgba(255,255,255,0.012); --tc:rgba(94,159,232,0.05); --hov:rgba(255,255,255,0.025); }\nbody { background:var(--bg); color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size:13px; min-height:100vh; padding:24px 24px 48px; transition:background .2s,color .2s; }\n\n.hdr { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap; }\n.hdr h1 { font-size:20px; font-weight:650; letter-spacing:-.02em; margin-bottom:3px; }\n.hdr p { color:var(--muted); font-size:12px; }\n.hdr-right { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }\n.legend { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }\n.li { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--muted); font-weight:500; }\n.ld { width:9px; height:9px; border-radius:2px; }\n\n.tbtn { padding:6px 12px; border-radius:8px; border:1px solid var(--bdr); background:var(--surf2); color:var(--muted); font-size:12px; cursor:pointer; transition:all .15s; display:flex; align-items:center; gap:5px; font-family:inherit; }\n.tbtn:hover { color:var(--txt); }\n\n.chips { display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }\n.chip { background:var(--surf); border:1px solid var(--bdr); border-radius:8px; padding:8px 14px; display:flex; flex-direction:column; gap:1px; }\n.cv { font-size:18px; font-weight:650; letter-spacing:-.02em; }\n.cl { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-weight:500; }\n\n.gantt-wrap { background:var(--surf); border:1px solid var(--bdr); border-radius:12px; overflow:auto; box-shadow:0 2px 12px rgba(0,0,0,.05); min-width:640px; }\n.gantt-hdr { display:grid; grid-template-columns:250px 1fr; border-bottom:1px solid var(--bdr); background:var(--surf2); position:sticky; top:0; z-index:20; }\n.ghl { padding:10px 14px; font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; border-right:1px solid var(--bdr); }\n.day-cols { display:grid; grid-template-columns:repeat(14,1fr); }\n.dc { padding:5px 3px; text-align:center; font-size:10px; color:var(--muted); font-weight:500; border-right:1px solid var(--bdr); line-height:1.3; }\n.dc .dn { font-size:12px; font-weight:650; display:block; }\n.dc.wk { color:color-mix(in srgb,var(--muted) 45%,transparent); }\n.dc.td { color:var(--acc); font-weight:700; }\n\n/* Phase */\n.ph-row { display:grid; grid-template-columns:250px 1fr; background:var(--surf2); border-bottom:1px solid var(--bdr); }\n.ph-lbl { padding:7px 10px 7px 12px; display:flex; align-items:center; gap:6px; border-right:1px solid var(--bdr); }\n.ph-chev { width:20px; height:20px; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; border-radius:4px; transition:all .15s; color:var(--muted); border:none; background:transparent; }\n.ph-chev:hover { background:rgba(0,0,0,.06); color:var(--txt); }\n.ph-chev svg { width:11px; height:11px; transition:transform .15s; }\n.ph-chev.coll svg { transform:rotate(-90deg); }\n.ph-dot { width:8px; height:8px; border-radius:2px; flex-shrink:0; }\n.ph-name { flex:1; border:none; background:transparent; color:inherit; font-family:inherit; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; cursor:text; outline:none; padding:2px 4px; border-radius:3px; min-width:0; }\n.ph-name:focus { background:rgba(0,0,0,.04); }\n.ph-prog { font-size:10px; color:var(--muted); white-space:nowrap; flex-shrink:0; }\n.ph-del { width:20px; height:20px; border:none; background:transparent; color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; border-radius:3px; font-size:15px; flex-shrink:0; opacity:0; transition:all .12s; }\n.ph-row:hover .ph-del { opacity:1; }\n.ph-del:hover { background:rgba(229,100,88,.12); color:#E56458; }\n.ph-bars { display:grid; grid-template-columns:repeat(14,1fr); position:relative; }\n.pc { border-right:1px solid var(--bdr); height:32px; }\n.pc.wk { background:var(--wknd); }\n.ph-band { position:absolute; top:5px; height:22px; border-radius:4px; opacity:.1; pointer-events:none; }\n\n/* Task */\n.tr { display:grid; grid-template-columns:250px 1fr; border-bottom:1px solid var(--bdr); }\n.tr:last-child { border-bottom:none; }\n.tr:hover { background:var(--hov); }\n.tl { padding:0 8px 0 12px; display:flex; align-items:center; gap:5px; border-right:1px solid var(--bdr); min-height:40px; }\n.chk { width:14px; height:14px; border-radius:3px; border:1.5px solid var(--bdr); flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .12s; }\n.chk:hover { border-color:var(--muted); }\n.chk.done { background:#46A171; border-color:#46A171; }\n.chk.done::after { content:''; display:block; width:7px; height:4.5px; border-left:1.5px solid #fff; border-bottom:1.5px solid #fff; transform:rotate(-45deg) translate(1px,-.5px); }\n.tn { flex:1; border:none; background:transparent; color:var(--txt); font-family:inherit; font-size:12.5px; line-height:1.3; cursor:text; outline:none; padding:2px 4px; border-radius:3px; min-width:0; }\n.tn:focus { background:rgba(0,0,0,.04); }\n.tn.done { opacity:.4; text-decoration:line-through; }\n.tp { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:2px 5px; border-radius:3px; cursor:pointer; flex-shrink:0; user-select:none; }\n.tp.h { background:rgba(229,100,88,.1); color:#E56458; }\n.tp.m { background:rgba(213,128,59,.1); color:#D5803B; }\n.tp.l { background:rgba(70,161,113,.1); color:#46A171; }\n.icon-btn { width:20px; height:20px; border:none; background:transparent; color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; border-radius:3px; font-size:13px; flex-shrink:0; opacity:0; transition:all .12s; }\n.tr:hover .icon-btn { opacity:1; }\n.icon-btn.has { opacity:1; color:var(--acc); }\n.icon-btn.del:hover { background:rgba(229,100,88,.12); color:#E56458; }\n\n.tb { display:grid; grid-template-columns:repeat(14,1fr); position:relative; align-items:center; }\n.tc { border-right:1px solid var(--bdr); height:40px; }\n.tc.wk { background:var(--wknd); }\n.tc.tdc { background:var(--tc); }\n\n.bar { position:absolute; height:20px; top:50%; transform:translateY(-50%); border-radius:5px; cursor:grab; color:#fff; font-size:10px; font-weight:600; display:flex; align-items:center; padding:0 6px; overflow:visible; user-select:none; z-index:2; transition:filter .1s; }\n.bar:hover { filter:brightness(1.1); }\n.bar.drag { cursor:grabbing; filter:brightness(1.15); opacity:.85; }\n.bar.done { opacity:.35; }\n.brz { position:absolute; right:-3px; top:0; bottom:0; width:10px; cursor:ew-resize; border-radius:0 5px 5px 0; }\n\n.ms { position:absolute; width:13px; height:13px; top:50%; transform:translateY(-50%) rotate(45deg); z-index:3; border-radius:2px; }\n.tl-line { position:absolute; top:0; bottom:0; width:2px; z-index:15; pointer-events:none; }\n.tl-line::before { content:'TODAY'; position:absolute; top:-18px; left:50%; transform:translateX(-50%); font-size:9px; font-weight:800; letter-spacing:.1em; white-space:nowrap; }\n\n.add-tr { display:grid; grid-template-columns:250px 1fr; border-bottom:1px solid var(--bdr); }\n.add-tr:last-child { border-bottom:none; }\n.add-t { padding:5px 12px 5px 40px; display:flex; align-items:center; gap:5px; color:var(--muted); font-size:12px; cursor:pointer; border:none; background:transparent; font-family:inherit; text-align:left; border-right:1px solid var(--bdr); transition:all .15s; width:100%; }\n.add-t:hover { color:var(--txt); background:var(--hov); }\n.add-ph-row { padding:10px 14px; border-top:1px solid var(--bdr); }\n.add-ph { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:12px; cursor:pointer; border:none; background:transparent; font-family:inherit; padding:6px 8px; border-radius:6px; transition:all .15s; }\n.add-ph:hover { color:var(--txt); background:var(--hov); }\n\n/* Modal */\n.mo { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:3000; align-items:center; justify-content:center; backdrop-filter:blur(3px); }\n.mo.open { display:flex; }\n.md { background:var(--surf); border:1px solid var(--bdr); border-radius:12px; padding:20px; width:360px; box-shadow:0 16px 48px rgba(0,0,0,.2); }\n.md h4 { font-size:14px; font-weight:600; margin-bottom:12px; }\n.md textarea { width:100%; height:90px; background:var(--surf2); border:1px solid var(--bdr); border-radius:8px; padding:10px; color:var(--txt); font-family:inherit; font-size:13px; resize:vertical; outline:none; }\n.md textarea:focus { border-color:var(--acc); }\n.md-footer { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }\n.mb { padding:7px 14px; border-radius:7px; border:1px solid var(--bdr); background:var(--surf2); color:var(--muted); font-size:12px; font-weight:500; cursor:pointer; transition:all .12s; font-family:inherit; }\n.mb:hover { color:var(--txt); }\n.mb.p { background:var(--acc); border-color:var(--acc); color:#fff; }\n.mb.p:hover { filter:brightness(1.1); }\n\n.footer { margin-top:16px; display:flex; gap:8px; align-items:center; justify-content:space-between; flex-wrap:wrap; }\n.fn { color:var(--muted); font-size:11px; }\n.fb { padding:7px 13px; border-radius:7px; border:1px solid var(--bdr); background:var(--surf); color:var(--muted); font-size:12px; font-weight:500; cursor:pointer; transition:all .12s; font-family:inherit; }\n.fb:hover { color:var(--txt); background:var(--surf2); }\n.fb.p { background:var(--acc); border-color:var(--acc); color:#fff; }\n.fb.p:hover { filter:brightness(1.1); }\n\n@media print { .footer,.hdr-right { display:none; } body { padding:12px; } }\n.start-lbl { display:inline-flex; align-items:center; gap:6px; margin-top:6px; font-size:11px; color:var(--muted); }\n.start-lbl input { font:inherit; font-size:11.5px; color:var(--txt); background:var(--surf); border:1px solid var(--bdr); border-radius:6px; padding:3px 6px; color-scheme:inherit; }\nbody.dark .start-lbl input { color-scheme:dark; }\n\u003c/style>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap\">\u003cstyle>#btn-theme,#theme-btn,#saved{display:none!important}\u003c/style>\u003c/head>\n\u003cbody>\n\n\u003cdiv class=\"hdr\">\n  \u003cdiv>\n    \u003ch1>Robot Part Redesign\u003c/h1>\n    \u003cp id=\"date-range\">2-Week Execution Plan\u003c/p>\n    \u003clabel class=\"start-lbl\">Starts \u003cinput type=\"date\" id=\"start-date\">\u003c/label>\n  \u003c/div>\n  \u003cdiv class=\"hdr-right\">\n    \u003cdiv class=\"legend\" id=\"legend\">\u003c/div>\n    \u003cbutton class=\"tbtn\" id=\"theme-btn\">&#9680; Dark\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"chips\">\n  \u003cdiv class=\"chip\">\u003cspan class=\"cv\" id=\"days-left\" style=\"color:#2783DE\">14\u003c/span>\u003cspan class=\"cl\">Days Left\u003c/span>\u003c/div>\n  \u003cdiv class=\"chip\">\u003cspan class=\"cv\" id=\"tasks-done\" style=\"color:#46A171\">0\u003c/span>\u003cspan class=\"cl\">Done\u003c/span>\u003c/div>\n  \u003cdiv class=\"chip\">\u003cspan class=\"cv\" id=\"tasks-total\">0\u003c/span>\u003cspan class=\"cl\">Total\u003c/span>\u003c/div>\n  \u003cdiv class=\"chip\">\u003cspan class=\"cv\" id=\"pct-done\" style=\"color:#D5803B\">0%\u003c/span>\u003cspan class=\"cl\">Complete\u003c/span>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"gantt-wrap\">\n  \u003cdiv class=\"gantt-hdr\">\n    \u003cdiv class=\"ghl\">Task\u003c/div>\n    \u003cdiv class=\"day-cols\" id=\"days-header\">\u003c/div>\n  \u003c/div>\n  \u003cdiv id=\"gantt-body\">\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"footer\">\n  \u003cspan class=\"fn\">Drag bars to reschedule · Drag right edge to resize · Click name/phase to edit · Auto-saves\u003c/span>\n  \u003cdiv style=\"display:flex;gap:8px\">\n    \u003cbutton class=\"fb\" id=\"btn-reset\">Reset Progress\u003c/button>\n    \u003cbutton class=\"fb p\" onclick=\"window.print()\">Export / Print\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- Note modal -->\n\u003cdiv class=\"mo\" id=\"note-modal\">\n  \u003cdiv class=\"md\">\n    \u003ch4 id=\"note-title\">Task Note\u003c/h4>\n    \u003ctextarea id=\"note-text\" placeholder=\"Add a note, detail, or link for this task…\">\u003c/textarea>\n    \u003cdiv class=\"md-footer\">\n      \u003cbutton class=\"mb\" id=\"note-cancel\">Cancel\u003c/button>\n      \u003cbutton class=\"mb p\" id=\"note-save\">Save\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript>window.__WS_INIT=/*__WS_INIT__*/null;\u003c/script>\u003cscript>(function(){\n  // Workspace bridge: connects this embedded template to the workspace app.\n  // Replaces the template's localStorage with the workspace's shared save,\n  // and lets the app control theme and font. The template code is otherwise untouched.\n  var I = window.__WS_INIT || {};\n  function post(m){ m.__ws = 1; m.mod = I.mod; try { window.parent.postMessage(m, '*'); } catch(e){} }\n\n  window.__bridge = {\n    load: function(){ return I.data ? JSON.stringify(I.data) : null; },\n    save: function(o){ post({ type:'save', data: JSON.parse(JSON.stringify(o)) }); }\n  };\n\n  function setFont(f){\n    var s = document.getElementById('__ws_font');\n    if(!s){ s = document.createElement('style'); s.id = '__ws_font'; (document.head || document.documentElement).appendChild(s); }\n    s.textContent = 'body,body input,body textarea,body button,body select{font-family:' + f + ' !important}';\n  }\n  function setTheme(dark){\n    try {\n      if(I.mod === 'gantt'){ S.theme = dark ? 'dark' : 'light'; applyTheme(); }\n      else if(I.mod === 'moodboard'){\n        S.theme = dark ? 'dark' : 'light';\n        document.body.classList.toggle('dark', dark);\n        var l = document.getElementById('theme-lbl'); if(l) l.textContent = dark ? 'Light' : 'Dark';\n        world.querySelectorAll('.card.nc').forEach(function(c){ applyNoteColor(c, parseInt(c.dataset.ci || '0')); });\n        updateTransform();\n      }\n    } catch(e){}\n  }\n\n  setFont(I.font || 'inherit');\n  window.addEventListener('message', function(e){\n    var m = e.data; if(!m || !m.__wsParent) return;\n    if(m.type === 'theme') setTheme(!!m.dark);\n    if(m.type === 'font') setFont(m.font);\n  });\n  document.addEventListener('DOMContentLoaded', function(){ setTheme(!!I.dark); });\n  document.addEventListener('keydown', function(e){\n    if((e.metaKey || e.ctrlKey) && (e.key === 's' || e.key === 'S')){ e.preventDefault(); post({ type:'save-shortcut' }); }\n  }, true);\n\n  if(I.mod === 'moodboard'){\n    function addFiles(files, pos){\n      files.filter(function(f){ return f.type.indexOf('image/') === 0; }).forEach(function(f, i){\n        var r = new FileReader();\n        r.onload = function(ev){\n          var o = { src: ev.target.result, w: 240, h: 200 };\n          if(pos) o.pos = { x: pos.x + i * 30, y: pos.y + i * 30 };\n          makeCard('image', o);\n        };\n        r.readAsDataURL(f);\n      });\n    }\n    var fileIn = document.createElement('input');\n    fileIn.type = 'file'; fileIn.accept = 'image/*'; fileIn.multiple = true; fileIn.style.display = 'none';\n    fileIn.addEventListener('change', function(){\n      var files = Array.prototype.slice.call(fileIn.files || []);\n      var cancel = document.getElementById('img-cancel'); if(cancel) cancel.click();\n      addFiles(files); fileIn.value = '';\n    });\n    document.addEventListener('DOMContentLoaded', function(){\n      document.body.appendChild(fileIn);\n      // \"Upload from computer\" inside the existing Add Image dialog\n      var url = document.getElementById('img-url');\n      if(url){\n        var up = document.createElement('button');\n        up.type = 'button'; up.className = 'mdbtn p'; up.textContent = 'Upload from computer…';\n        up.style.cssText = 'width:100%;padding:10px;font-size:13px;margin-bottom:10px;display:block';\n        up.addEventListener('click', function(){ fileIn.click(); });\n        var tip = document.createElement('div');\n        tip.textContent = 'Paste a picture’s address, or right-click a picture → Copy image and paste it in the box (Ctrl/⌘+V).';\n        tip.style.cssText = 'font-size:11.5px;color:var(--muted);line-height:1.45;margin:10px 0 2px';\n        url.parentNode.insertBefore(up, url);\n        url.parentNode.insertBefore(tip, url.nextSibling);\n        url.placeholder = 'Paste a copied picture or image address…';\n        var err = document.createElement('div');\n        err.style.cssText = 'display:none;font-size:12px;line-height:1.45;color:#E56458;background:rgba(229,100,88,.1);border-radius:7px;padding:8px 10px;margin-top:8px';\n        url.parentNode.insertBefore(err, url.nextSibling);\n        var showErr = function(t){ err.textContent = t; err.style.display = t ? 'block' : 'none'; };\n        url.addEventListener('input', function(){ showErr(''); });\n        // Paste the picture itself into the box\n        url.addEventListener('paste', function(e){\n          var files = Array.prototype.slice.call((e.clipboardData && e.clipboardData.files) || []).filter(function(f){ return f.type.indexOf('image/') === 0; });\n          if(!files.length) return;\n          e.preventDefault(); showErr('');\n          var cancel = document.getElementById('img-cancel'); if(cancel) cancel.click();\n          addFiles(files);\n        });\n        // Image addresses: check the picture can load here before adding it\n        var ok = document.getElementById('img-ok'), verified = null;\n        if(ok) ok.addEventListener('click', function(e){\n          var v = url.value.trim();\n          if(!/^https?:/i.test(v) || verified === v) return;\n          e.preventDefault(); e.stopImmediatePropagation();\n          ok.disabled = true; var label = ok.textContent; ok.textContent = 'Checking…';\n          var probe = new Image(), finished = false;\n          var finish = function(good){\n            if(finished) return; finished = true; ok.disabled = false; ok.textContent = label;\n            if(good){ verified = v; ok.click(); verified = null; showErr(''); }\n            else showErr('That picture didn’t load. Check the address is the picture itself (right-click → Copy image address). Some sites block sharing their pictures: in that case right-click → Copy image, then paste it in this box.');\n          };\n          probe.onload = function(){ finish(true); }; probe.onerror = function(){ finish(false); };\n          setTimeout(function(){ finish(false); }, 8000);\n          probe.src = v;\n        }, true);\n        var modal = document.getElementById('img-modal');\n        if(modal) new MutationObserver(function(){ if(!modal.classList.contains('open')) showErr(''); }).observe(modal, { attributes:true, attributeFilter:['class'] });\n      }\n      // Web-linked pictures that can't load: remove the dead card and explain\n      var mk = window.makeCard;\n      window.makeCard = function(type, opts){\n        var card = mk.apply(this, arguments);\n        if(type === 'image' && opts && /^https?:/i.test(opts.src || '')){\n          var img = card.querySelector('img');\n          if(img) img.addEventListener('error', function(){\n            if(card.isConnected){ card.remove(); try { save(); } catch(e){} }\n            post({ type:'notice', text:'That picture link stopped loading. Right-click the picture on the website → Copy image, then press Ctrl/⌘+V on the board.' });\n          });\n        }\n        return card;\n      };\n    });\n    // Tell the app which picture was clicked (for the image info panel)\n    document.addEventListener('click', function(e){\n      var c = e.target.closest && e.target.closest('.card');\n      if(c && c.dataset.type === 'image'){ var img = c.querySelector('img'); post({ type:'img-select', src: img ? img.src : '' }); }\n      else if(e.target.closest && e.target.closest('#canvas') && !e.target.closest('#toolbar,#zoom-ctrl')) post({ type:'img-select', src: null });\n    }, true);\n    // Paste images from the clipboard straight onto the board\n    document.addEventListener('paste', function(e){\n      if(e.target.matches && e.target.matches('input,textarea,[contenteditable]')) return;\n      var files = (e.clipboardData && e.clipboardData.files) || [];\n      for(var i = 0; i \u003c files.length; i++){\n        (function(f){\n          if(f.type.indexOf('image/') !== 0) return;\n          e.preventDefault();\n          var r = new FileReader();\n          r.onload = function(ev){ makeCard('image', { src: ev.target.result, w: 240, h: 200 }); };\n          r.readAsDataURL(f);\n        })(files[i]);\n      }\n    });\n  }\n})();\n\u003c/script>\u003cscript>\nconst DAYS=14;\nconst DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];\nconst MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\nconst COLORS=['#2783DE','#9B6DD4','#D5803B','#46A171','#E56458','#4FB9C9','#DE9255'];\n\nfunction uid(){return Math.random().toString(36).slice(2,8);}\nfunction dc(o){return JSON.parse(JSON.stringify(o));}\nfunction cl(v,a,b){return Math.min(b,Math.max(a,v));}\nfunction pct(i,d){d=d||DAYS;return((i/d)*100).toFixed(3)+'%';}\n\nconst DEFAULT={theme:'light',phases:[\n  {id:'p0',name:'Design & Research',color:'#2783DE',collapsed:false,tasks:[\n    {id:'t0',name:'Finalize mood board & concept options',start:0,end:0,priority:'h',done:false,milestone:false,note:'Due today — show boss options'},\n    {i const frames = new Map();

function frameDoc(mod, p){
  const M = MODULES[mod];

  const m = e.data; if(!m || m.__ws !== 1) return;
  let f = null; frames.forEach(x => { if(x.iframe.contentWindow === e.source) f = x; });
  if(!f) return;
  const p = W.projects.find(x => x.id === f.pid); if(!p) return;
  if(m.type === 'save'){ if(canEdit()) MODULES[f.mod].ingest(p, m.data); }

  else if(m.type === 'notice') toast(String(m.text || ''), 7000);

    if(m.src && !ui.selImg) ingestChain.then(() => { ui.selImg = srcMap(p).get(m.src) || null; if(ui.drawer === 'info') renderDrawer(); });

  if(!HAS_KEY){ fullMessage('This link can’t open yet', 'The app is missing its Google API key. The owner needs to finish SETUP.md.'); return; }
  try {
    const r = await fetch(API + '/files/' + encodeURIComponent(VIEW_ID) + '?alt=media&key=' + encodeURIComponent(CFG.apiKey));
    if(!r.ok) throw r.status;
    const p = JSON.parse(await r.text());
    if(!p || !p.mods) throw 'bad';
    W = { title: p.name, projects:[prepareProject(p)] };
    ui.project = p.id; restoreUI();
    buildShell(); renderAll(true);
  } catch(e){
    fullMessage('This project isn’t available', 'The owner may have stopped sharing it, or the link is incomplete. Ask them for a new link.');
  }
}
function bootOffline(){
  const p = EMBED.project;
  W = { title: p.name, projects:[prepareProject(p)] };
  ui.project = p.id; restoreUI();
  buildShell(); renderAll(true);
}
applyPrefs();
let rw = null; window.addEventListener('resize', () => { clearTimeout(rw); rw = setTimeout(() => { if(shell.root) renderHeader(); }, 150); });
setInterval(() => { if(shell.root && !flushing) renderHeader(); }, 60000);
if(ROLE === 'offline') bootOffline(); else if(ROLE === 'viewer') bootViewer(); else bootOwner();
})();
</script>
