<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anium.planning</title>
<meta name="description" content="Plan your day hour by hour, keep a timeline of every task, and see what you got done.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%93%90%3C/text%3E%3C/svg%3E">
<style>:root{
  --bg:#FFFFFF; --surf:#FFFFFF; --surf2:#F6F5F3; --hover:rgba(55,53,47,.06); --press:rgba(55,53,47,.1);
  --bdr:#E9E8E5; --bdr2:#DCDBD7; --grid:#EEEDEA; --grid2:#F6F5F2; --wknd:rgba(55,53,47,.035); --mark:rgba(255,196,0,.38); --txt:#2F2E2B; --muted:#76746F; --faint:#A5A29C;
  --acc:#2783DE; --acc-soft:rgba(39,131,222,.1); --ok:#3F9A69; --ok-soft:rgba(70,161,113,.12); --warn:#C9741F; --warn-soft:rgba(213,128,59,.13); --danger:#E0574C; --now:#E0574C;
  --pop:0 0 0 1px rgba(15,15,15,.05),0 3px 6px rgba(15,15,15,.1),0 9px 24px rgba(15,15,15,.2);
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  --row:42px; --labw:250px; --hw:64px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#191919; --surf:#1F1F1F; --surf2:#262626; --hover:rgba(255,255,255,.055); --press:rgba(255,255,255,.09);
    --bdr:rgba(255,255,255,.09); --bdr2:rgba(255,255,255,.15); --grid:rgba(255,255,255,.07); --grid2:rgba(255,255,255,.03); --wknd:rgba(255,255,255,.025); --mark:rgba(255,196,0,.3); --txt:rgba(255,255,255,.88); --muted:rgba(255,255,255,.52); --faint:rgba(255,255,255,.32);
    --acc:#5E9FE8; --acc-soft:rgba(94,159,232,.16); --ok:#5DBB89; --ok-soft:rgba(93,187,137,.15); --warn:#E0A464; --warn-soft:rgba(224,164,100,.14); --danger:#EB7B70; --now:#F0796E;
    --pop:0 0 0 1px rgba(255,255,255,.08),0 3px 6px rgba(0,0,0,.3),0 9px 24px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#191919; --surf:#1F1F1F; --surf2:#262626; --hover:rgba(255,255,255,.055); --press:rgba(255,255,255,.09);
  --bdr:rgba(255,255,255,.09); --bdr2:rgba(255,255,255,.15); --grid:rgba(255,255,255,.07); --grid2:rgba(255,255,255,.03); --wknd:rgba(255,255,255,.025); --mark:rgba(255,196,0,.3); --txt:rgba(255,255,255,.88); --muted:rgba(255,255,255,.52); --faint:rgba(255,255,255,.32);
  --acc:#5E9FE8; --acc-soft:rgba(94,159,232,.16); --ok:#5DBB89; --ok-soft:rgba(93,187,137,.15); --warn:#E0A464; --warn-soft:rgba(224,164,100,.14); --danger:#EB7B70; --now:#F0796E;
  --pop:0 0 0 1px rgba(255,255,255,.08),0 3px 6px rgba(0,0,0,.3),0 9px 24px rgba(0,0,0,.45);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
img{max-width:100%}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Top bar ---------- */
.top{display:flex;align-items:center;gap:6px 18px;padding:10px 16px;border-bottom:1px solid var(--bdr);flex-shrink:0;flex-wrap:wrap}
.brand{font-weight:700;font-size:15px;letter-spacing:-.015em;white-space:nowrap}
.brand span{color:var(--muted);font-weight:500}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:6px 10px;border-radius:7px;font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:7px;white-space:nowrap}
.tab:hover{background:var(--hover);color:var(--txt)}
.tab.on{background:var(--press);color:var(--txt);font-weight:500}
.tab svg{width:15px;height:15px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:6px;flex-shrink:0}
.save-state{font-size:12px;color:var(--faint);white-space:nowrap;margin-right:4px}
.save-state.err{color:var(--warn)}
.icon-btn{border:0;background:transparent;width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--muted);flex-shrink:0;padding:0}
.icon-btn:hover{background:var(--hover);color:var(--txt)}
.icon-btn svg{width:17px;height:17px}
.btn{border:1px solid var(--bdr);background:var(--surf);border-radius:7px;padding:5px 11px;font-size:13px;color:var(--txt);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--hover);color:var(--txt)}
.btn.ghost.on{background:var(--press);color:var(--txt)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:500}
.btn.primary:hover{filter:brightness(1.07);background:var(--acc)}
.btn.primary:disabled{opacity:.55;filter:none}
.btn.plan-btn{color:var(--acc)}
.btn.plan-btn:hover,.btn.plan-btn.on{color:var(--acc)}
.btn.danger{color:var(--danger)}
.linkbtn{border:0;background:transparent;color:var(--acc);font-size:inherit;padding:0;text-decoration:underline;display:inline}
.banner{display:flex;align-items:center;gap:10px;padding:9px 16px;background:var(--acc-soft);font-size:13px;flex-wrap:wrap;border-radius:9px;margin:0 0 14px}
.banner .grow{flex:1;min-width:200px}
.banner.warn{background:var(--warn-soft)}

/* ---------- Stage ---------- */
.stage{flex:1;display:flex;min-height:0;position:relative}
.view{flex:1;position:relative;min-width:0;min-height:0}
.native{position:absolute;inset:0;overflow:auto}
.frame{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:var(--bg)}
.page{padding:20px 24px 48px}
.loading{display:grid;place-items:center;height:100%;color:var(--muted);font-size:13.5px}

/* ---------- Day ---------- */
.day-head{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap}
.day-nav{display:flex;align-items:center;gap:2px;min-width:0}
.day-title{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0 8px 0 6px;line-height:1.25;text-wrap:balance}
.rel{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surf2);padding:2px 8px;border-radius:20px}
.rel.today{color:var(--acc);background:var(--acc-soft)}
.date-in{border:1px solid var(--bdr);background:var(--surf);border-radius:7px;padding:4px 8px;font-size:12.5px;color:var(--muted)}
.stats{margin-left:auto;display:flex;gap:16px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.stats b{color:var(--txt);font-weight:600}
.focus-row{display:flex;align-items:center;gap:10px;margin:12px 0 0;max-width:820px}
.focus-row label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);flex-shrink:0}
.focus-in{flex:1;min-width:0;border:0;border-bottom:1px solid transparent;background:transparent;font-size:14.5px;padding:4px 2px}
.focus-in:hover:not([readonly]){border-bottom-color:var(--bdr2)}
.focus-in:focus{outline:none;border-bottom-color:var(--acc)}
.focus-in::placeholder{color:var(--faint)}
.day-body{margin-top:16px}

.chart-wrap{overflow-x:auto;border:1px solid var(--bdr);border-radius:10px;background:var(--surf);max-width:100%}
.chart{position:relative}
.axis{display:flex;height:34px;border-bottom:1px solid var(--bdr);background:var(--surf2)}
.axis .lab{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surf2)}
.hours{position:relative;flex-shrink:0}
.hours span{position:absolute;top:0;bottom:0;padding:9px 0 0 6px;font-size:11px;color:var(--muted);border-left:1px solid var(--bdr);white-space:nowrap;font-variant-numeric:tabular-nums}
.row{display:flex;height:var(--row);border-bottom:1px solid var(--bdr)}
.row:last-child{border-bottom:0}
.lab{position:sticky;left:0;z-index:2;width:var(--labw);flex-shrink:0;display:flex;align-items:center;gap:9px;padding:0 10px 0 12px;background:var(--surf);border-right:1px solid var(--bdr);min-width:0}
.row .lab{cursor:pointer}
.row:hover .lab,.row.sel .lab{background:var(--surf2)}
.lt{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.lt .t{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt .t.untitled{color:var(--faint)}
.lt .tm{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.row.done .lt .t{text-decoration:line-through;color:var(--muted)}
.pdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.chk{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--bdr2);background:var(--surf);flex-shrink:0;display:grid;place-items:center;padding:0;color:#fff}
.chk:not(:disabled):hover{border-color:var(--ok)}
.chk.on{background:var(--ok);border-color:var(--ok)}
.chk svg{width:12px;height:12px}
.chk.doing{border-color:var(--acc);box-shadow:inset 0 0 0 3px var(--surf),inset 0 0 0 9px var(--acc)}
.track{position:relative;flex-shrink:0;background-image:repeating-linear-gradient(to right,var(--grid) 0 1px,transparent 1px var(--hw)),repeating-linear-gradient(to right,var(--grid2) 0 1px,transparent 1px calc(var(--hw) / 4))}
.bar{position:absolute;top:7px;height:calc(var(--row) - 14px);border-radius:6px;background:var(--c,var(--acc));color:#fff;font-size:12px;font-weight:500;display:flex;align-items:center;padding:0 8px;overflow:hidden;white-space:nowrap;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.bar.ro{cursor:pointer}
.bar .bt{overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.bar .h{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize}
.bar .h.l{left:0}.bar .h.r{right:0}
.bar.done{opacity:.42}
.bar.done .bt{text-decoration:line-through}
.bar.doing{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.18) 0 6px,transparent 6px 12px)}
.bar.dragging{cursor:grabbing;box-shadow:0 4px 14px rgba(0,0,0,.22);z-index:1}
.row.sel .bar{box-shadow:0 0 0 2px var(--surf),0 0 0 4px var(--c,var(--acc))}
.add-row .lab{cursor:default}
.add-btn{border:0;background:transparent;color:var(--muted);display:flex;align-items:center;gap:7px;padding:4px 2px;font-size:13px}
.add-btn:hover{color:var(--txt)}
.add-btn svg{width:15px;height:15px}
.add-track{cursor:copy}
.add-track:hover{background-color:var(--hover)}
.now{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--now);z-index:1;pointer-events:none}
.now span{position:absolute;top:8px;left:4px;font-size:10.5px;font-weight:600;color:var(--now);background:var(--surf2);padding:0 3px;border-radius:3px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chart-tip{font-size:12px;color:var(--faint);margin:8px 2px 0}
.empty-day{padding:22px 4px 6px;color:var(--muted);font-size:13.5px}

/* ---------- Past days ---------- */
.log{max-width:860px}
.log h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.25}
.log .sub{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.week-sum{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 6px}
.tile{border:1px solid var(--bdr);border-radius:9px;padding:9px 14px;min-width:120px;background:var(--surf)}
.tile b{display:block;font-size:20px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.tile span{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.wk{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:26px 0 8px}
.log-day{border:1px solid var(--bdr);border-radius:10px;background:var(--surf);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.log-day + .log-day{margin-top:10px}
.ld-head{display:flex;align-items:baseline;gap:8px 12px;flex-wrap:wrap}
.ld-date{border:0;background:transparent;padding:0;font-size:15.5px;font-weight:650;letter-spacing:-.01em;text-align:left}
.ld-date:hover{color:var(--acc)}
.ld-stats{margin-left:auto;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ld-focus{margin:0;font-size:13.5px;color:var(--muted)}
.ld-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.ld-list li{display:flex;align-items:baseline;gap:8px;font-size:13.5px;min-width:0}
.ld-list li svg{width:13px;height:13px;color:var(--ok);flex-shrink:0;align-self:center}
.ld-list .lt2{min-width:0;overflow-wrap:anywhere}
.ld-list .lm{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;margin-left:auto;padding-left:10px}
.chip{font-size:11px;padding:1px 7px;border-radius:10px;background:var(--surf2);color:var(--muted);white-space:nowrap}
.ld-open{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.ld-open .lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.ld-tag{border:1px dashed var(--bdr2);border-radius:6px;padding:1px 7px}
.ld-acts{display:flex;gap:8px;flex-wrap:wrap}
.ld-none{margin:0;font-size:13px;color:var(--faint)}

/* ---------- Drawer ---------- */
.drawer{width:340px;flex-shrink:0;border-left:1px solid var(--bdr);background:var(--bg);display:flex;flex-direction:column;min-height:0}
.drawer[hidden]{display:none!important}
.drawer-h{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 10px 16px;border-bottom:1px solid var(--bdr)}
.drawer-h h3{margin:0;font-size:14px;font-weight:600}
.drawer-b{flex:1;overflow-y:auto;padding:12px 16px 24px;display:flex;flex-direction:column;gap:14px}
.drawer-b > *{flex-shrink:0}
.drawer-f{border-top:1px solid var(--bdr);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:var(--faint)}
.field{display:flex;flex-direction:column;gap:5px}
.field > label,.flabel{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.bd-title{width:100%;border:0;background:transparent;font-size:18px;font-weight:650;letter-spacing:-.01em;line-height:1.3;resize:none;padding:2px 0;overflow:hidden}
.bd-title:focus{outline:none}
.bd-title::placeholder{color:var(--faint)}
.times{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.times input{border:1px solid var(--bdr);background:var(--surf);border-radius:7px;padding:5px 8px;font-variant-numeric:tabular-nums}
.times .dur{font-size:12.5px;color:var(--muted)}
.seg{display:flex;background:var(--surf2);border-radius:7px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:5px;padding:5px 6px;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--surf);color:var(--txt);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:500}
.sel-in{border:1px solid var(--bdr);background:var(--surf);border-radius:7px;padding:6px 8px;width:100%}
.ta{width:100%;border:1px solid var(--bdr);background:var(--surf);border-radius:7px;padding:8px 10px;resize:vertical;min-height:84px;line-height:1.45}
.ta:focus,.sel-in:focus,.times input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-soft)}
.ta[readonly]{background:var(--surf2)}
.note{font-size:12.5px;color:var(--muted);line-height:1.5}

/* steps */
.steps-ed{display:flex;flex-direction:column;gap:3px}
.step{display:flex;align-items:center;gap:6px}
.step input[type=checkbox]{accent-color:var(--ok);flex-shrink:0;margin:0 2px}
.step-in{flex:1;min-width:0;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;font-size:13px}
.step-in:hover:not([readonly]){border-color:var(--bdr)}
.step-in:focus{outline:none;border-color:var(--acc);background:var(--surf)}
.step.done .step-in{text-decoration:line-through;color:var(--muted)}
.step-min{width:58px;flex-shrink:0;border:1px solid var(--bdr);background:var(--surf);border-radius:6px;padding:4px 6px;font-size:12px;font-variant-numeric:tabular-nums}
.step-min:focus{outline:none;border-color:var(--acc)}
.step .icon-btn{width:24px;height:24px}
.step .icon-btn svg{width:13px;height:13px}
.bar.sbar{background:color-mix(in srgb,var(--c) 26%,var(--surf));color:var(--txt);box-shadow:none;font-weight:400;cursor:pointer}
.bar.sbar.done{opacity:.6}
.step-row .lt .t{color:var(--muted)}

/* plan */
.plan-date{font-size:12.5px;color:var(--muted)}
.plan-in{min-height:140px;font-size:13.5px}
.plan-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.plan-hint{font-size:11.5px;color:var(--faint)}
.plan-opt{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer;line-height:1.45}
.plan-opt input{margin-top:3px;accent-color:var(--acc)}
.plan-opt small{display:block;color:var(--muted);font-size:12px}
.msg{padding:8px 10px;border-radius:7px;font-size:12.5px;line-height:1.5}
.msg.warn{background:var(--warn-soft)}
.msg.ok{background:var(--ok-soft)}
.plan-focus{margin:0;font-size:14px;line-height:1.5}
.plan-list{display:flex;flex-direction:column;gap:1px;margin:0 -6px}
.plan-item{display:grid;grid-template-columns:18px 1fr;gap:9px;align-items:start;padding:7px 6px;border-radius:7px;font-size:13px;line-height:1.4;cursor:pointer}
.plan-item:hover{background:var(--hover)}
.plan-item input{margin:2px 0 0;accent-color:var(--acc)}
.plan-item.off .pi-tx{opacity:.45}
.plan-item.fixed{cursor:default}
.plan-item.fixed:hover{background:transparent}
.pi-tx{display:flex;flex-direction:column;gap:1px;min-width:0;overflow-wrap:anywhere}
.pi-top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pi-time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;white-space:nowrap}
.pi-kind{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--acc)}
.pi-kind.k-new,.pi-kind.k-carry{color:var(--ok)}
.pi-kind.k-same{color:var(--faint)}
.pi-kind.k-remove{color:var(--danger)}
.pi-sub{font-size:12px;color:var(--muted)}

/* ---------- Popovers / dialogs / toast ---------- */
.pop{position:fixed;z-index:200;background:var(--surf);border-radius:10px;box-shadow:var(--pop);padding:4px;min-width:180px}
.rep-pop{width:min(380px,calc(100vw - 32px))}
.rep-h{font-size:12px;color:var(--muted);padding:6px 8px 4px;font-weight:500}
.rep-item{display:flex;gap:12px;align-items:flex-start;padding:10px 8px}
.rep-item + .rep-item{border-top:1px solid var(--bdr)}
.rep-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rep-tx strong{font-size:13.5px;font-weight:600}
.rep-tx span{font-size:12.5px;color:var(--muted);line-height:1.45}
.rep-link{font-size:12px;color:var(--acc);text-decoration:none}
.rep-link:hover{text-decoration:underline}
.rep-tip{font-size:12px;color:var(--muted);line-height:1.45;padding:8px 8px 4px;border-top:1px solid var(--bdr)}
.rep-tip a{color:var(--acc)}
.scrim{position:fixed;inset:0;z-index:150;background:rgba(15,15,15,.45);display:grid;place-items:center;padding:24px}
.modal{background:var(--bg);border-radius:12px;box-shadow:var(--pop);width:min(440px,100%);padding:18px 18px 16px}
.modal h3{margin:0 0 8px;font-size:15px;font-weight:600;text-wrap:balance}
.modal p{margin:0 0 18px;font-size:14px;line-height:1.5}
.modal-btns{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:300;box-shadow:var(--pop);max-width:min(520px,90vw);text-align:center}

/* ---------- Timeline ---------- */
.tl-page{height:100%;display:flex;flex-direction:column;gap:12px;padding:18px 24px 16px;min-height:0}
.tl-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.tl-title{min-width:0;flex:1 1 300px}
.tl-name{display:block;width:100%;border:0;background:transparent;font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.25;padding:0}
.tl-name:focus{outline:none}
.tl-name::placeholder{color:var(--faint)}
.tl-title .sub{margin:3px 0 0;color:var(--muted);font-size:13px;max-width:70ch}
.tl-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tl-tools .seg button{flex:0 0 auto;padding:4px 9px}
.tl-q{border:1px solid var(--bdr);background:var(--surf);border-radius:7px;padding:5px 9px;font-size:13px;width:170px}
.tl-q:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-soft)}
.tl-wrap{flex:1;min-height:0;overflow:auto;border:1px solid var(--bdr);border-radius:10px;background:var(--surf);--row:40px}
.tl-chart{position:relative;min-height:100%}
.tl-axis{display:flex;position:sticky;top:0;z-index:4;height:48px;background:var(--surf2);border-bottom:1px solid var(--bdr)}
.tl-axis .lab{background:var(--surf2);z-index:5;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tl-axis-r{position:relative;flex-shrink:0;overflow:hidden}
.tl-months,.tl-days{position:relative;height:24px}
.tl-months span{position:absolute;top:0;height:48px;padding:5px 0 0 6px;font-size:11.5px;font-weight:600;white-space:nowrap;border-left:1px solid var(--bdr2)}
.tl-days span{position:absolute;top:0;height:22px;padding-top:4px;font-size:10.5px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.tl-days span.wk{opacity:.55}
.tl-days span.on{color:#fff;background:var(--now);border-radius:4px;font-weight:600}
.tl-grid{position:absolute;top:48px;bottom:0;pointer-events:none;z-index:0}
.tl-row{display:flex;height:var(--row);border-bottom:1px solid var(--bdr);position:relative;z-index:2}
.tl-row .lab{cursor:pointer}
.tl-row:hover .lab,.tl-row.sel .lab{background:var(--surf2)}
.tl-row.done .lt .t{text-decoration:line-through;color:var(--muted)}
.tl-track{position:relative;flex-shrink:0}
.ph-row .lab{background:var(--surf2);gap:6px;cursor:default;padding-left:6px}
.ph-row:hover .lab{background:var(--surf2)}
.ph-row .tl-track{background:var(--hover)}
.ph-name{border:0;background:transparent;padding:0;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;color:var(--txt)}
.ph-name:not(:disabled):hover{color:var(--acc)}
.ph-ct{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}
.icon-btn.caret{width:20px;height:20px}
.icon-btn.add-in{width:22px;height:22px}
.caret svg,.add-in svg{width:14px;height:14px}
.tl-span{position:absolute;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:var(--c);opacity:.4}
.bar.tl-bar{top:8px;height:calc(var(--row) - 16px)}
.tl-ms{position:absolute;top:calc(50% - 8px);width:16px;height:16px;background:var(--c);transform:rotate(45deg);border-radius:3px;cursor:grab;touch-action:pan-y;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.tl-ms.ro{cursor:pointer}
.tl-ms.done{opacity:.45}
.tl-tick{position:absolute;bottom:3px;height:3px;border-radius:2px;background:var(--c);opacity:.35;pointer-events:none}
.tl-tick.on{opacity:1}
.work-row .lab{cursor:default}
.work-row:hover .lab{background:var(--surf)}
.tl-work{position:absolute;bottom:5px;border:0;padding:0;border-radius:2px 2px 0 0;background:var(--ok);cursor:pointer}
.tl-work.none{background:var(--bdr2)}
.tl-work:hover{filter:brightness(1.15)}
.tl-now{z-index:1}
.empty-lab{color:var(--faint);font-size:12.5px;cursor:default!important}

/* ---------- Search ---------- */
.search-in{width:100%;border:1px solid var(--bdr);background:var(--surf);border-radius:8px;padding:8px 10px;font-size:14px}
.search-in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-soft)}
.search-res{display:flex;flex-direction:column;gap:16px}
.sr-group{display:flex;flex-direction:column;gap:1px}
.sr-group > .flabel{margin-bottom:3px}
.sr{display:flex;gap:9px;align-items:flex-start;border:0;background:transparent;text-align:left;padding:7px 8px;border-radius:7px;color:inherit;text-decoration:none;margin:0 -8px;width:calc(100% + 16px);cursor:pointer}
.sr:hover,.sr:focus-visible{background:var(--hover)}
.sr .pdot{margin-top:6px}
.sr-tx{display:flex;flex-direction:column;gap:1px;min-width:0;overflow-wrap:anywhere}
.sr-t{font-size:13.5px}
.sr-t.done{color:var(--muted)}
.sr-s{font-size:12px;color:var(--muted)}
.sr-n{font-size:12px;color:var(--muted);font-style:italic}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}

/* ---------- Attachments / phases ---------- */
.att-list{display:flex;flex-direction:column;gap:5px}
.att{display:flex;align-items:center;gap:9px;padding:6px 4px 6px 8px;border:1px solid var(--bdr);border-radius:8px;background:var(--surf);color:inherit;text-decoration:none;min-width:0}
a.att:hover{border-color:var(--bdr2);background:var(--surf2)}
.att.busy{color:var(--muted);font-size:12.5px;border-style:dashed;padding:9px 10px}
.att-ic{width:30px;height:30px;border-radius:6px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-size:10px;font-weight:700;text-transform:uppercase;flex-shrink:0}
.att-tx{display:flex;flex-direction:column;min-width:0;flex:1}
.att-nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-sub{font-size:11.5px;color:var(--muted)}
.att .icon-btn{width:26px;height:26px}
.att .icon-btn svg{width:13px;height:13px}
.link-row{display:flex;gap:6px}
.link-row .sel-in{flex:1;min-width:0}
.drawer.dragover{box-shadow:inset 0 0 0 2px var(--acc)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0;box-shadow:inset 0 0 0 2px var(--bg)}
.swatch.on{border-color:var(--txt)}
.times input[type=date]{min-width:0}
.field > label.plan-opt{font-size:13px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--txt)}

@media (max-width:1100px){ .hide-md{display:none!important} }
@media (max-width:820px){
  .top{padding:8px 12px}
  .tabs{order:3;width:100%;margin:0 -4px}
  .drawer{position:fixed;right:0;top:0;bottom:0;z-index:110;width:min(360px,92vw);box-shadow:var(--pop);padding-top:env(safe-area-inset-top,0px)}
  .page{padding:16px 16px 40px}
  .hide-sm{display:none!important}
  .stats{margin-left:0;width:100%}
  .day-title{font-size:19px}
  .tl-page{padding:12px 12px 10px}
  .tl-q{width:130px}
}
@media (max-width:600px){ :root{--labw:138px} .lt .tm{display:none} .lab{padding:0 8px} }

/* ---------- Google Drive / appearance menu ---------- */
.acct-tx{font-size:12.5px;color:var(--muted);line-height:1.5;padding:2px 8px 8px;max-width:340px}
.acct-tx a{color:var(--acc)}
.acct-row{display:flex;gap:8px;flex-wrap:wrap;padding:0 8px 10px}
.acct-row .seg{flex:1}
.icon-btn.acct{color:var(--ok)}
</style>

const icon = n => { const s = el('span', { html: ICON[n] }); s.style.display = 'contents'; return s; };

// Confirmation inside the page (the Claude viewer blocks browser pop-ups).

    const key = e => { if(e.key === 'Escape'){ e.stopPropagation(); done(false); } if(e.key === 'Enter'){ e.preventDefault(); done(true); } };

   ===================================================================== */

const pad2 = n => String(n).padStart(2, '0');

/* =====================================================================
   STORE · this browser (IndexedDB) and your Google Drive
   Everything lives in one file, planner.json, in the “Anium.planning” folder of your Drive.
   Days, tasks and the project each carry an updatedAt time; deletions leave a dated marker.
   Syncing merges the two copies item by item, newest wins, so several devices can share it.
   ===================================================================== */
const IDB = {
  db: null,
  open(){
    if(this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('design-workspace', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async get(k){ const db = await this.open(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async set(k, v){ const db = await this.open(); return new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
};
const API = 'https://www.googleapis.com/drive/v3', UP = 'https://www.googleapis.com/upload/drive/v3';
// Sign-in lives on this site's server (api/auth/*): Google is visited once, the server keeps the
// sign-in in a secure cookie, and hands out short-lived Drive access whenever the app asks.
const AUTH = '/api/auth/';
const Drive = {
  token: null, exp: 0, rootId: null, plannerId: null, filesId: null, refreshing: null,
  ok(){ return !!this.token && Date.now() < this.exp; },
  connect(){ location.assign(AUTH + 'start'); return new Promise(() => {}); },
  refresh(){
    if(!this.refreshing) this.refreshing = (async () => {
      let r;
      try { r = await fetch(AUTH + 'token', { method:'POST' }); } catch(e){ throw { code:'network' }; }
      if(r.status === 401){ this.token = null; throw { code:'auth' }; }
      if(!r.ok) throw { code:'network' };
      const t = await r.json();
      this.token = t.access_token; this.exp = Date.now() + (Number(t.expires_in || 3600) - 120) * 1000;
      LS.set('dw-drive', '1');
    })().finally(() => { this.refreshing = null; });
    return this.refreshing;
  },
  async signOut(){
    try { await fetch(AUTH + 'logout', { method:'POST' }); } catch(e){}
    this.token = null; this.rootId = null; this.plannerId = null; this.filesId = null; LS.del('dw-drive');
  },
  async req(method, url, body, headers, retried){
    if(!this.ok()) await this.refresh();
    let r;
    try { r = await fetch(url, { method, headers: Object.assign({ Authorization: 'Bearer ' + this.token }, headers || {}), body }); }
    catch(e){ throw { code:'network' }; }
    if(r.status === 401){ this.token = null; if(!retried) return this.req(method, url, body, headers, true); throw { code:'auth' }; }
    if(r.status === 204) return null;
    if(!r.ok){ let t = ''; try { t = await r.text(); } catch(e){} throw { code:'http', status: r.status, text: t }; }
    const ct = r.headers.get('content-type') || '';
    return ct.includes('application/json') ? r.json() : r.blob();
  },
  json(method, path, obj){ return this.req(method, API + path, obj ? JSON.stringify(obj) : undefined, obj ? { 'Content-Type':'application/json' } : {}); },
  async findOne(q){
    const r = await this.json('GET', '/files?spaces=drive&pageSize=5&fields=files(id,name)&q=' + encodeURIComponent(q + ' and trashed = false'));
    return (r && r.files && r.files[0]) || null;
  },
  folder(name, parent, props){ return this.json('POST', '/files?fields=id', { name, mimeType:'application/vnd.google-apps.folder', parents: parent ? [parent] : undefined, appProperties: props }); },
  upload(meta, blob){
    const b = 'dw' + uid() + uid();
    const body = new Blob(['--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(meta) + '\r\n--' + b + '\r\nContent-Type: ' + (blob.type || 'application/octet-stream') + '\r\n\r\n', blob, '\r\n--' + b + '--']);
    return this.req('POST', UP + '/files?uploadType=multipart&fields=id', body, { 'Content-Type': 'multipart/related; boundary=' + b });
  },
  update(id, blob){ return this.req('PATCH', UP + '/files/' + id + '?uploadType=media&fields=id', blob, { 'Content-Type': blob.type || 'application/json' }); },
  // Files over 4 MB go up as a resumable upload (multipart uploads are meant for small files).
  async uploadLarge(meta, blob, retried){
    if(blob.size <= 4 * 1024 * 1024) return this.upload(meta, blob);
    if(!this.ok()) await this.refresh();
    let r;
    try { r = await fetch(UP + '/files?uploadType=resumable&fields=id', { method:'POST', headers:{ Authorization:'Bearer ' + this.token, 'Content-Type':'application/json; charset=UTF-8', 'X-Upload-Content-Type': blob.type || 'application/octet-stream' }, body: JSON.stringify(meta) }); }
    catch(e){ throw { code:'network' }; }
    if(r.status === 401 && !retried){ this.token = null; return this.uploadLarge(meta, blob, true); }
    const at = r.ok && r.headers.get('Location');
    if(!at) throw { code:'http', status: r.status };
    try { r = await fetch(at, { method:'PUT', body: blob }); } catch(e){ throw { code:'network' }; }
    if(!r.ok) throw { code:'http', status: r.status };
    return r.json();
  },
  async readJSON(id){ const r = await this.req('GET', API + '/files/' + id + '?alt=media'); return r instanceof Blob ? JSON.parse(await r.text()) : r; },
  async ensureRoot(){
    if(this.rootId) return this.rootId;
    let f = await this.findOne("appProperties has { key='dw' and value='root' }");
    if(!f) f = await this.folder('Anium.planning', null, { dw:'root' });
    this.rootId = f.id;
    const p = await this.findOne("appProperties has { key='dw' and value='planner' }");
    this.plannerId = p ? p.id : null;
    return this.rootId;
  },
  async ensureFilesFolder(){
    if(this.filesId) return this.filesId;
    await this.ensureRoot();
    let f = await this.findOne("appProperties has { key='dw' and value='files' }");
    if(!f) f = await this.folder('Attachments', this.rootId, { dw:'files' });
    return (this.filesId = f.id);
  }
};

let mode = 'connecting', canWrite = true, loaded = { days:false, project:false, tasks:false };
let driveOn = false, syncState = 'local', lastSync = null;
let DELETED = {};                       // 'tasks/<id>' -> ISO time it was deleted
let localDirty = false, driveDirty = false, localTimer = null, pushTimer = null, pushing = null;
const isDirty = () => false;            // kept for the shared view code
function snapshot(){
  const days = {}, tasks = {};
  DAYS.forEach((d, k) => { if(d.blocks.length || d.focus || d.updatedAt) days[k] = d; });
  TASKS.forEach((t, k) => tasks[k] = t);
  return { v:1, days, tasks, project: PROJECT, deleted: DELETED, importedOld: !!META.importedOld };
}
const META = { importedOld:false };
function persist(path, data, delay){
  if(!canWrite) return;
  localDirty = true; driveDirty = true;
  clearTimeout(localTimer); localTimer = setTimeout(saveLocal, 300);
  schedulePush(Math.max(800, delay == null ? 1500 : delay));
  renderSaveState();
}
function removeDoc(path){ DELETED[path] = nowISO(); persist(path); }
const saveDay = (d, delay) => { d.updatedAt = nowISO(); persist('days/' + d.date, d, delay); };
const saveProject = delay => { if(!PROJECT) return; PROJECT.updatedAt = nowISO(); persist('project/plan', PROJECT, delay); };
const saveTask = (t, delay) => { t.updatedAt = nowISO(); persist('tasks/' + t.id, t, delay); };
let cacheOK = true;
async function saveLocal(){
  clearTimeout(localTimer);
  try { await IDB.set('planner', JSON.parse(JSON.stringify(snapshot()))); localDirty = false; cacheOK = true; }
  catch(e){ cacheOK = false; }
  renderSaveState();
}
function applyData(data){
  let changed = false;
  if(!data) return false;
  const days = data.days || {}, tasks = data.tasks || {};
  Object.keys(days).forEach(k => { const cur = DAYS.get(k); if(cur !== days[k]){ DAYS.set(k, normDay(clone(days[k]), k)); changed = true; } });
  [...DAYS.keys()].forEach(k => { if(!days[k] && (DAYS.get(k).updatedAt || DAYS.get(k).blocks.length)){ DAYS.delete(k); changed = true; } });
  Object.keys(tasks).forEach(k => { const cur = TASKS.get(k); if(cur !== tasks[k]){ TASKS.set(k, normTask(clone(tasks[k]), k)); changed = true; } });
  [...TASKS.keys()].forEach(k => { if(!tasks[k]){ TASKS.delete(k); changed = true; } });
  if(data.project !== PROJECT){ PROJECT = data.project ? clone(data.project) : PROJECT; changed = true; }
  DELETED = Object.assign({}, data.deleted || {});
  if(data.importedOld) META.importedOld = true;
  return changed;
}
// Newest copy of each day, task and the project wins; deletions win over older copies.
function mergeData(local, remote){
  if(!remote) return local;
  const del = Object.assign({}, remote.deleted || {});
  Object.keys(local.deleted || {}).forEach(k => { if(!del[k] || local.deleted[k] > del[k]) del[k] = local.deleted[k]; });
  const old = addDays(today(), -120);
  Object.keys(del).forEach(k => { if(del[k].slice(0, 10) < old) delete del[k]; });
  const pick = (a, b) => !a ? b : !b ? a : ((a.updatedAt || '') >= (b.updatedAt || '') ? a : b);
  const out = { v:1, days:{}, tasks:{}, project: pick(local.project, remote.project), deleted: del, importedOld: !!(local.importedOld || remote.importedOld) };
  ['days', 'tasks'].forEach(col => {
    const L = local[col] || {}, R = remote[col] || {};
    new Set([...Object.keys(L), ...Object.keys(R)]).forEach(k => {
      const e = pick(L[k], R[k]), gone = del[col + '/' + k];
      if(gone && gone >= (e.updatedAt || '')) return;
      out[col][k] = e;
    });
  });
  return out;
}
function schedulePush(ms){ if(!driveOn) return; clearTimeout(pushTimer); pushTimer = setTimeout(() => { pushTimer = null; push(); }, ms == null ? 1500 : ms); }
// Reads Drive's copy, merges it with this one, and writes the result back.
async function push(){
  if(!driveOn) return;
  if(pushing){ await pushing; if(!driveDirty) return; }
  pushing = (async () => {
    syncState = 'saving'; renderSaveState();
    try {
      await Drive.ensureRoot();
      driveDirty = false;
      const local = snapshot();
      const remote = Drive.plannerId ? await Drive.readJSON(Drive.plannerId) : null;
      const merged = mergeData(local, remote);
      if(applyData(merged)) scheduleRender();
      const blob = new Blob([JSON.stringify(Object.assign({}, merged, { savedAt: nowISO() }))], { type:'application/json' });
      if(Drive.plannerId) await Drive.update(Drive.plannerId, blob);
      else { const r = await Drive.upload({ name:'planner.json', parents:[Drive.rootId], appProperties:{ dw:'planner' } }, blob); Drive.plannerId = r.id; }
      syncState = 'saved'; lastSync = nowISO();
      saveLocal();
    } catch(e){ driveDirty = true; syncError(e); }
    renderSaveState();
  })();
  try { await pushing; } finally { pushing = null; }
}
// What a copy holds, by item and time: two copies with the same signature need no sync.
function sig(d){
  if(!d) return '';
  const a = [];
  ['days', 'tasks'].forEach(c => Object.keys(d[c] || {}).sort().forEach(k => a.push(c + '/' + k + '@' + ((d[c][k] && d[c][k].updatedAt) || ''))));
  Object.keys(d.deleted || {}).sort().forEach(k => a.push('x/' + k));
  a.push('p@' + ((d.project && d.project.updatedAt) || ''), d.importedOld ? 'i' : '');
  return a.join('|');
}
// Picks up changes made on your other devices.
async function pull(){
  if(!driveOn || pushing || pushTimer || !Drive.plannerId) return;
  try {
    const remote = await Drive.readJSON(Drive.plannerId);
    const local = snapshot(), merged = mergeData(local, remote);
    if(applyData(merged)){ scheduleRender(); saveLocal(); }
    if(sig(merged) !== sig(remote)){ driveDirty = true; schedulePush(500); }
    syncState = 'saved'; lastSync = nowISO(); renderSaveState();
  } catch(e){ syncError(e); }
}
function syncError(e){
  if(e && e.code === 'auth'){ driveOn = false; syncState = 'reconnect'; renderAll(); }
  else if(e && e.code === 'network'){ syncState = 'offline'; schedulePush(15000); }
  else { syncState = 'error'; console.warn('Drive', e); schedulePush(30000); }
  renderSaveState();
}
function renderSaveState(){
  const s = shell.save; if(!s) return;
  const busy = localDirty || driveDirty || syncState === 'saving';
  s.className = 'save-state' + (['offline', 'error', 'reconnect'].includes(syncState) ? ' err' : '');
  s.textContent = mode === 'connecting' ? 'Loading…'
    : !canWrite ? 'View only'
    : syncState === 'reconnect' ? 'Reconnect Google Drive'
    : !driveOn ? (cacheOK ? 'Saved in this browser' : 'Not saved')
    : syncState === 'offline' ? 'Offline · will sync'
    : syncState === 'error' ? 'Not synced yet'
    : busy ? 'Saving…' : 'Saved to Drive';
}
let renderQueued = false;
function scheduleRender(){ if(renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false; renderAll(true); }); }

// Gantt tasks from the earlier version of Anium.planning come onto the timeline once.
// Their ids are derived from the old ones, so importing from this browser and from Drive never doubles them.
function importOldProjects(list){
  let n = 0;
  const multi = list.length > 1;
  list.forEach(p => {
    const g = p && p.mods && p.mods.gantt && p.mods.gantt.data;
    if(!g || !Array.isArray(g.phases)) return;
    const start = isDay(g.start) ? g.start : localDay(new Date(p.createdAt || Date.now()));
    PROJECT = PROJECT || newProject();
    PROJECT.phases = phases().slice();
    if(!PROJECT.name || PROJECT.name === 'My project') PROJECT.name = p.name || PROJECT.name;
    g.phases.forEach((ph, i) => {
      const pid = 'o' + p.id + '-' + ph.id;
      if(!PROJECT.phases.some(x => x.id === pid)) PROJECT.phases.push({ id: pid, name: (multi ? (p.name || 'Project') + ' · ' : '') + (ph.name || 'Phase'), color: ph.color || COLORS[i % COLORS.length] });
      (ph.tasks || []).forEach(t => {
        const id = 'o' + p.id + '-' + t.id;
        if(TASKS.has(id)) return;
        const files = (t.files || []).map(f => {
          if(f.kind === 'link') return { id: f.id || uid(), kind:'link', url: f.url, name: f.name, addedAt: f.addedAt };
          const m = p.files && p.files[f.id];
          return m && m.driveId ? { id: f.id, kind:'file', name: f.name || m.name, size: m.size, type: m.type, addedAt: m.addedAt, driveId: m.driveId, url:'https://drive.google.com/file/d/' + m.driveId + '/view' } : null;
        }).filter(Boolean);
        const task = normTask({ name: t.name, phaseId: pid, start: addDays(start, +t.start || 0), end: addDays(start, +t.end || 0), status: t.done ? 'done' : t.status === 'doing' ? 'doing' : 'todo',
          priority: t.priority, milestone: t.milestone, note: t.note, files, doneAt: t.doneAt, startedAt: t.startedAt, createdAt: p.createdAt || nowISO(), updatedAt: nowISO() }, id);
        TASKS.set(id, task); n++;
      });
    });
  });
  if(n){ PROJECT.updatedAt = nowISO(); META.importedOld = true; persist('import'); }
  return n;
}
async function importOldFromDrive(){
  const ix = await Drive.findOne("appProperties has { key='dw' and value='index' }");
  if(!ix) return 0;
  const index = await Drive.readJSON(ix.id);
  const ids = ((index && index.order) || Object.keys((index && index.projects) || {})).filter(id => index.projects && index.projects[id]);
  const list = [];
  for(const id of ids){ try { list.push(await Drive.readJSON(index.projects[id].fileId)); } catch(e){ if(e && e.code === 'auth') throw e; } }
  return importOldProjects(list);
}
async function connectDrive(){ await saveLocal(); Drive.connect(); }
async function signOutDrive(){
  await push();
  await Drive.signOut();
  driveOn = false; syncState = 'local';
  renderAll();
  toast('Signed out of Google Drive. Your planner stays saved in your Drive.', 4500);
}
// Tries the saved sign-in; quietly keeps retrying while offline.
function resumeDrive(){
  Drive.refresh().then(startSync, e => {
    if(e && e.code === 'network'){ setTimeout(resumeDrive, 15000); return; }
    if(LS.get('dw-drive') === '1'){ syncState = 'reconnect'; renderAll(); }
  });
}
async function startSync(){
  driveOn = true; syncState = 'saving'; renderAll();
  try {
    await Drive.ensureRoot();
    if(Drive.plannerId){
      const remote = await Drive.readJSON(Drive.plannerId);
      if(applyData(mergeData(snapshot(), remote))) scheduleRender();
      if(remote && remote.importedOld) META.importedOld = true;
    }
    if(!META.importedOld){
      const n = await importOldFromDrive();
      META.importedOld = true;
      if(n) toast(plural(n, 'task') + ' from your earlier Gantt chart are now on your Timeline.', 6000);
    }
    driveDirty = true; await push();
    renderAll();
  } catch(e){ syncError(e); }
}

const fmtISOClock = iso => { const d = new Date(iso); return fmtT(d.getHours() * 60 + d.getMinutes()); };
function openAccount(anchor){
  const theme = LS.get('anium-theme') || 'system';
  const body = el('div', { class:'rep-pop' },
    el('div', { class:'rep-h', text: driveOn ? 'Google Drive' : 'Save to Google Drive' }),
    el('div', { class:'acct-tx', text: driveOn

// Turns Claude's answer into rows the person reviews. Anything malformed is dropped.
function readPlan(out, c){

    if(!x || typeof x !== 'object') return;

    const ref = String(x.ref || 'L' + (i + 1));
    const s = okDay(x.start) ? x.start : c.date;
    let e = okDay(x.end) ? x.end : s; if(e < s) e = s;
    const phase = String(x.phase || '').trim();
    const ph = c.phases.find(p => p.id === phase || p.name.toLowerCase() === phase.toLowerCase());
    longs[ref] = true;
    rows.push({ kind:'long', ref, name, s, e, phaseId: ph ? ph.id : null, phaseName: ph ? ph.name : (phase.slice(0, 40) || 'Ongoing work'), on:true,
      label:'Timeline', text: name, sub: fmtDay(s) + (e > s ? ' – ' + fmtDay(e) : '') + ' · ' + (ph ? ph.name : 'new phase “' + (phase.slice(0, 40) || 'Ongoing work') + '”') });
  });
  (Array.isArray(out.taskUpdates) ? out.taskUpdates.slice(0, 10) : []).forEach(x => {
    const t = x && taskById(String(x.taskId || '')); if(!t) return;
    const s = okDay(x.start) ? x.start : t.start;
    let e = okDay(x.end) ? x.end : t.end; if(e < s) e = s;
    if(s === t.start && e === t.end) return;
    rows.push({ kind:'extend', taskId: t.id, s, e, on:true, label:'Timeline', text: t.name || 'Untitled task', sub:'New dates ' + fmtDay(s) + (e > s ? ' – ' + fmtDay(e) : '') });
  });

    if(e == null || e <= s) e = s + 30;

    if(ref) seen.add(ref);
    const title = String(x.title || '').trim().slice(0, 80);
    if(!title && !ex && !carry) return;
    const tk = String(x.task || x.taskId || '');
    const long = longs[tk] ? tk : null, taskId = !long && taskById(tk) ? tk : null;
    const steps = Array.isArray(x.steps) ? x.steps.slice(0, 8).map(st => ({ text: String(typeof st === 'string' ? st : (st && st.text) || '').trim().slice(0, 120), mins: clamp(Math.round(+((st && st.mins) || 0)), 0, 480) || null })).filter(st => st.text) : [];

    const finalTitle = title || (ex ? ex.title : carry.b.title);

      label: kind === 'same' ? 'Already planned' : kind === 'move' ? (ex.start !== s || ex.end !== e ? 'Moved' : 'Updated') : kind === 'carry' ? 'From ' + dayShort(carry.day) : done ? 'Done' : 'New',
      text: finalTitle, time: fmtRange(s, e),
      sub: [linkName ? 'Timeline: ' + linkName : '', steps.length && !(ex && ex.steps.length) ? plural(steps.length, 'step') + ': ' + steps.map(st => st.text).join(' · ') : '', note].filter(Boolean).join(' — ') });
  });

    .map(r => ({ kind:'remove', ref: r, on:true, label:'Remove', text: byRef.get(r).title || 'Untitled block', time: fmtRange(byRef.get(r).start, byRef.get(r).end) }));

}

function needDrive(what){

async function addFiles(files){
  const items = [], skipped = [];
  if(needDrive('attach files')) return items;
  for(const file of files){
    if(!(file instanceof Blob)) continue;
    const name = file.name || 'file';
    if(file.size > MAX_ATTACH){ skipped.push(name); continue; }
    try {
      const parent = await Drive.ensureFilesFolder();
      const r = await Drive.uploadLarge({ name, parents:[parent] }, file);
      items.push({ id: uid(), driveId: r.id, name, type: file.type || '', size: file.size, addedAt: nowISO(), url:'https://drive.google.com/file/d/' + r.id + '/view' });
    } catch(e){ driveFail(e, '“' + name + '”'); return items; }
  }
  const saved = items.length ? (items.length === 1 ? 'Saved to' : items.length + ' files saved to') + ' your Google Drive (Anium.planning › Attachments). ' : '';
  const tooBig = skipped.length ? (skipped.length === 1 ? '“' + skipped[0] + '” is' : skipped.length + ' files are') + ' over 200 MB. Put ' + (skipped.length === 1 ? 'it' : 'them') + ' in Google Drive yourself and attach the link.' : '';

}

/* --- what goes into reports --- */
function timelineOf(){
  const tasks = [...TASKS.values()]; if(!tasks.length) return null;
  const t = today(), wk = addDays(t, -7), byStart = (a, b) => a.start.localeCompare(b.start);
  const open = tasks.filter(x => x.status !== 'done');
  return {
    tasks, open,
    doing: tasks.filter(x => x.status === 'doing').sort(byStart),
    overdue: open.filter(x => x.end < t).sort(byStart),
    upNext: open.filter(x => x.status !== 'doing' && x.start <= addDays(t, 7) && x.end >= t).sort(byStart),
    finished: tasks.filter(x => x.status === 'done' && x.doneAt && localDay(new Date(x.doneAt)) > wk).sort((a, b) => String(b.doneAt).localeCompare(String(a.doneAt))),
    nextMilestone: open.filter(x => x.milestone && x.start >= t).sort(byStart)[0] || null
  };
}
function recentWork(n){
  const t = today(), out = [];
  for(let i = n - 1; i >= 0; i--){
    const date = addDays(t, -i), d = getDay(date);

  }
  return out;
}

    h2('Timeline by phase');
    const recent = addDays(t0, -30);
    phases().map(p => ({ p, list: T.tasks.filter(t => t.phaseId === p.id) })).concat([{ p:null, list: T.tasks.filter(t => !phaseOf(t)) }]).forEach(({ p, list }) => {
      if(!list.length) return;
      const shownList = list.filter(t => t.status !== 'done' || (t.doneAt && localDay(new Date(t.doneAt)) >= recent) || t.end >= recent).sort((a, b) => a.start.localeCompare(b.start));
      out.push('<h3>' + esc(p ? p.name : 'No phase') + ' — ' + list.filter(t => t.status === 'done').length + '/' + list.length + ' done</h3>');
      if(shownList.length) out.push('<table border="1" cellpadding="4"><tr><th>Task</th><th>Status</th><th>Dates</th><th>Priority</th><th>Time logged</th><th>Details</th><th>Files</th></tr>'
        + shownList.map(t => '<tr><td>' + esc(t.name || 'Untitled task') + (t.milestone ? ' (milestone)' : '') + '</td><td>' + STATUS[t.status] + '</td><td>' + esc(taskSpan(t)) + '</td><td>' + PRIORITY[t.priority] + '</td><td>' + (loggedFor(t.id).length ? loggedHours(t) : '') + '</td><td>' + esc(t.note || '').replace(/\n/g, '<br>') + '</td><td>' + attachmentLinks(t.files) + '</td></tr>').join('') + '</table>');
      const older = list.length - shownList.length;
      if(older) out.push('<p>' + plural(older, 'older finished task') + ' not listed.</p>');
    });
  }
  return '<!doctype html><html><head><meta charset="utf-8"><title>' + esc(projName()) + ' — Status report</title></head><body>' + out.join('\n') + '</body></html>';
}
async function refreshReport(){
  await Drive.ensureRoot();
  const name = projName() + ' — Status report';
  const blob = new Blob([reportHTML()], { type:'text/html' });
  const d = driveRec();
  if(d.reportId){
    try {
      await Drive.update(d.reportId, blob);
      if(d.reportName !== name) await Drive.json('PATCH', '/files/' + d.reportId + '?fields=id', { name });
      setDrive({ reportName: name, reportAt: nowISO() });
      return d.reportId;
    } catch(e){ if(!(e && e.status === 404)) throw e; }
  }
  const r = await Drive.upload({ name, mimeType:'application/vnd.google-apps.document', parents:[Drive.rootId], appProperties:{ dw:'report' } }, blob);
  setDrive({ reportId: r.id, reportName: name, reportAt: nowISO() });
  return r.id;
}
// One Google Doc, rewritten with the latest each time you open it.
function makeReport(){
  if(needDrive('make a status report')) return;
  openWhenReady('Updating your status report', async () => 'https://docs.google.com/document/d/' + await refreshReport() + '/edit');
}

/* --- status slides: built as PowerPoint here, converted to Google Slides by Drive --- */
let pptxLib = null;
function loadPptx(){
  return pptxLib || (pptxLib = new Promise((res, rej) => {
    const s = el('script', { src:'/vendor/pptxgen.bundle.js' });
    s.onload = () => window.PptxGenJS ? res(window.PptxGenJS) : rej(new Error('pptx'));
    s.onerror = () => { pptxLib = null; rej(new Error('pptx')); };
    document.head.append(s);
  }));
}
async function buildDeck(){
  const PptxGenJS = await loadPptx();
  const T = timelineOf(), W = recentWork(7), t0 = today(), now = new Date();
  const wDone = W.flatMap(w => w.done);
  const pptx = new PptxGenJS(); pptx.layout = 'LAYOUT_WIDE'; pptx.title = projName() + ' — Status update';
  const C = { ink:'2C2C2B', muted:'7D7A75', line:'E6E5E3', soft:'F4F3F1', acc:'2783DE', ok:'46A171', warn:'D5803B' }, F = 'Arial', Wd = 13.333;
  const hex = c => /^#?[0-9a-f]{6}$/i.test(String(c || '')) ? String(c).replace('#', '').toUpperCase() : C.muted;
  pptx.defineSlideMaster({ title:'BODY', background:{ color:'FFFFFF' },
    objects:[ { rect:{ x:0, y:7.12, w:Wd, h:0.38, fill:{ color:C.soft } } }, { text:{ text: projName() + '  ·  Status update ' + fmtD(now), options:{ x:0.5, y:7.16, w:9, h:0.3, fontSize:9, color:C.muted, fontFace:F } } } ],
    slideNumber:{ x:12.2, y:7.16, w:0.7, h:0.3, fontSize:9, color:C.muted, fontFace:F } });
  const head = (s, t, sub) => { s.addText(t, { x:0.5, y:0.32, w:Wd - 1, h:0.62, fontSize:26, bold:true, color:C.ink, fontFace:F }); if(sub) s.addText(sub, { x:0.5, y:0.92, w:Wd - 1, h:0.36, fontSize:13, color:C.muted, fontFace:F }); };
  const dot = (s, x, y, color) => s.addShape(pptx.ShapeType.ellipse, { x, y, w:0.14, h:0.14, fill:{ color:hex(color) }, line:{ color:hex(color) } });
  const taskSlides = (titleText, items, empty, extra) => {
    for(let i = 0; i < Math.max(1, items.length); i += 6){
      const s = pptx.addSlide({ masterName:'BODY' });
      head(s, titleText + (i ? ' (continued)' : ''), items.length ? plural(items.length, 'task') : null);
      if(!items.length){ s.addText(empty, { x:0.5, y:1.6, w:Wd - 1, h:0.5, fontSize:16, color:C.muted, fontFace:F }); return; }
      items.slice(i, i + 6).forEach((t, k) => {
        const y = 1.55 + k * 0.9, ph = phaseOf(t);
        dot(s, 0.55, y + 0.12, taskColor(t));
        s.addText((t.name || 'Untitled task') + (t.milestone ? '  ◆' : ''), { x:0.85, y, w:7.6, h:0.36, fontSize:16, bold:true, color:C.ink, fontFace:F });
        s.addText([ph ? ph.name : '', taskSpan(t), extra ? extra(t) : (t.priority === 'h' ? 'High priority' : '')].filter(Boolean).join('   ·   '), { x:8.6, y, w:4.2, h:0.36, fontSize:11, color:C.muted, align:'right', fontFace:F });
        if(t.note) s.addText(t.note.replace(/\s+/g, ' ').slice(0, 180) + (t.note.length > 180 ? '…' : ''), { x:0.85, y:y + 0.36, w:Wd - 1.5, h:0.4, fontSize:12, color:C.muted, fontFace:F });
      });
    }
  };
  let s = pptx.addSlide();
  s.addShape(pptx.ShapeType.rect, { x:0, y:0, w:0.2, h:7.5, fill:{ color:C.acc }, line:{ color:C.acc } });
  s.addText(projName(), { x:0.9, y:2.2, w:11.6, h:1.3, fontSize:44, bold:true, color:C.ink, fontFace:F });
  s.addText('Status update · ' + fmtLong(now), { x:0.9, y:3.5, w:11.6, h:0.6, fontSize:20, color:C.muted, fontFace:F });
  s.addText(fmtHours(minsOf(wDone)) + ' of work done in the last 7 days' + (T ? '   ·   ' + T.doing.length + ' tasks in progress' : ''), { x:0.9, y:4.2, w:11.6, h:0.5, fontSize:14, color:C.muted, fontFace:F });
  s = pptx.addSlide({ masterName:'BODY' }); head(s, 'At a glance', 'The last 7 days');
  const tiles = [[String(wDone.length), 'Blocks done', C.ok], [fmtHours(minsOf(wDone)), 'Hours of work', C.acc]].concat(T ? [[String(T.doing.length), 'Tasks in progress', C.warn], [String(T.finished.length), 'Tasks finished', C.ink]] : []);
  tiles.forEach(([v, l, c], i) => {
    const x = 0.5 + i * 3.1;
    s.addShape(pptx.ShapeType.roundRect, { x, y:1.6, w:2.9, h:1.7, fill:{ color:C.soft }, line:{ color:C.line }, rectRadius:0.12 });
    s.addText(v, { x, y:1.8, w:2.9, h:0.85, fontSize:36, bold:true, color:c, align:'center', fontFace:F });
    s.addText(l.toUpperCase(), { x, y:2.65, w:2.9, h:0.4, fontSize:11, color:C.muted, align:'center', charSpacing:2, fontFace:F });
  });
  const bullets = [T && T.nextMilestone ? 'Next milestone: ' + T.nextMilestone.name + ' — ' + fmtDay(T.nextMilestone.start) : null,
    T ? (T.overdue.length ? plural(T.overdue.length, 'task') + (T.overdue.length === 1 ? ' is' : ' are') + ' past the planned end date' : 'On schedule — no open task is past its end date') : null,
    W.length ? 'Days planned this week: ' + W.map(w => dayShort(w.date)).join(', ') : null].filter(Boolean);
  if(bullets.length) s.addText(bullets.map(t => ({ text:t, options:{ bullet:true } })), { x:0.5, y:3.8, w:12.3, h:2.6, fontSize:16, color:C.ink, fontFace:F, valign:'top', paraSpaceAfter:8 });
  const worked = W.filter(w => w.done.length);
  for(let i = 0; i < worked.length; i += 3){
    s = pptx.addSlide({ masterName:'BODY' }); head(s, 'Work done' + (i ? ' (continued)' : ''), 'Finished blocks, day by day');
    worked.slice(i, i + 3).forEach((w, k) => {
      const x = 0.5 + k * 4.15;
      s.addText(dayShort(w.date), { x, y:1.5, w:3.95, h:0.4, fontSize:16, bold:true, color:C.ink, fontFace:F });
      s.addText(w.done.length + ' done · ' + fmtHours(minsOf(w.done)), { x, y:1.88, w:3.95, h:0.3, fontSize:11, color:C.muted, fontFace:F });
      const items = w.done.slice(0, 8).map(b => ({ text: (b.title || 'Untitled block') + '  ' + fmtRange(b.start, b.end), options:{ bullet:true } }));
      if(w.done.length > 8) items.push({ text: '+' + (w.done.length - 8) + ' more', options:{ bullet:false } });
      s.addText(items, { x, y:2.3, w:3.95, h:4.5, fontSize:12, color:C.ink, fontFace:F, valign:'top', paraSpaceAfter:5 });
    });
  }
  if(T){
    // Timeline: last week through the next four
    const w0 = addDays(weekStart(t0), -7), N = 35, w1 = addDays(w0, N - 1);
    s = pptx.addSlide({ masterName:'BODY' }); head(s, 'Timeline', fmtDay(w0) + ' – ' + fmtDay(w1));
    const rows = [];
    phases().map(p => ({ p, list: T.tasks.filter(t => t.phaseId === p.id) })).concat([{ p:null, list: T.tasks.filter(t => !phaseOf(t)) }]).forEach(({ p, list }) => {
      const inWin = list.filter(t => t.end >= w0 && t.start <= w1).sort((a, b) => a.start.localeCompare(b.start));
      if(!inWin.length) return;
      rows.push({ p }); inWin.forEach(t => rows.push({ p, t }));
    });
    const list = rows.slice(0, 22);
    const gx = 3.6, gw = Wd - 0.5 - gx, dw = gw / N, gy = 1.75, rh = Math.min(0.3, 4.9 / Math.max(1, list.length));
    for(let i = 0; i < N; i += 7) s.addText(fmtD(parseDay(addDays(w0, i))), { x:gx + i * dw, y:1.35, w:dw * 7, h:0.35, fontSize:10, color:C.muted, fontFace:F });
    for(let i = 0; i < N; i++){ const d = parseDay(addDays(w0, i)); if(d.getDay() % 6 === 0) s.addShape(pptx.ShapeType.rect, { x:gx + i * dw, y:gy - 0.05, w:dw, h:rh * list.length + 0.1, fill:{ color:'FAF9F7' }, line:{ color:'FAF9F7' } }); }
    list.forEach((r, i) => {
      const y = gy + i * rh;
      if(!r.t){ s.addText(r.p ? r.p.name : 'No phase', { x:0.5, y, w:gx - 0.6, h:rh, fontSize:10, bold:true, color: r.p ? hex(r.p.color) : C.muted, fontFace:F, valign:'middle' }); return; }
      const t = r.t, a = Math.max(0, daysBetween(w0, t.start)), b = Math.min(N - 1, daysBetween(w0, t.end));
      s.addText(t.name || 'Untitled task', { x:0.5, y, w:gx - 0.6, h:rh, fontSize:9.5, color:C.ink, fontFace:F, valign:'middle' });
      if(t.milestone) s.addShape(pptx.ShapeType.diamond, { x:gx + a * dw + dw / 2 - rh * 0.3, y:y + rh * 0.2, w:rh * 0.6, h:rh * 0.6, fill:{ color:hex(taskColor(t)) }, line:{ color:hex(taskColor(t)) } });
      else s.addShape(pptx.ShapeType.roundRect, { x:gx + a * dw + 0.02, y:y + rh * 0.2, w:Math.max(0.05, (b - a + 1) * dw - 0.04), h:rh * 0.6, fill:{ color:hex(taskColor(t)), transparency: t.status === 'done' ? 55 : 0 }, line:{ color:hex(taskColor(t)) }, rectRadius:0.05 });
    });
    const ti = daysBetween(w0, t0);
    s.addShape(pptx.ShapeType.line, { x:gx + ti * dw + dw / 2, y:gy - 0.05, w:0, h:rh * Math.max(1, list.length) + 0.1, line:{ color:C.acc, width:1.5 } });
    if(rows.length > list.length) s.addText('Showing the first ' + list.length + ' rows. The status report lists every task.', { x:0.5, y:6.7, w:Wd - 1, h:0.3, fontSize:10, color:C.muted, fontFace:F });
    if(!rows.length) s.addText('No tasks in these weeks.', { x:0.5, y:2, w:Wd - 1, h:0.5, fontSize:16, color:C.muted, fontFace:F });
    taskSlides('In progress', T.doing, 'Nothing is marked in progress yet.');
    taskSlides('Finished this week', T.finished, 'No timeline tasks finished in the last 7 days.', t => t.doneAt ? 'Done ' + fmtD(new Date(t.doneAt)) : 'Done');
    taskSlides('Coming up — next 7 days', T.upNext, 'Nothing scheduled to start in the next week.');
    if(T.overdue.length) taskSlides('Needs attention', T.overdue, '', t => 'Planned end ' + fmtDay(t.end));
  }
  return pptx.write({ outputType:'blob' });
}
function makeSlides(){
  const name = projName() + ' — Status update ' + today();
  if(!driveOn){
    buildDeck().then(blob => {
      const a = el('a', { href: URL.createObjectURL(blob), download: name + '.pptx' }); document.body.append(a); a.click(); a.remove();
      toast('Downloaded. Open Google Slides → File → Import slides to use it there.', 7000);
    }, () => toast('Couldn’t build the slides. Try again.', 4000));
    return;
  }
  openWhenReady('Building your status slides', async () => {
    await Drive.ensureRoot();
    const blob = new Blob([await buildDeck()], { type: PPTX_TYPE });
    const r = await Drive.uploadLarge({ name, mimeType:'application/vnd.google-apps.presentation', parents:[Drive.rootId] }, blob);
    const url = 'https://docs.google.com/presentation/d/' + r.id + '/edit';
    setDrive({ slides: { id: r.id, url, at: nowISO() } });
    return url;
  });
}
function openProgress(anchor){
  const d = driveRec();
  const item = (title, text, btn, extra) => el('div', { class:'rep-item' }, el('div', { class:'rep-tx' }, el('strong', { text: title }), el('span', { text }), extra || null), btn);
  const latest = (url, at, label) => url ? el('a', { class:'rep-link', href: url, target:'_blank', rel:'noopener', text: label + (at ? ' · ' + fmtD(new Date(at)) : '') }) : null;
  popover(anchor, el('div', { class:'rep-pop' }, el('div', { class:'rep-h', text:'Progress in Google' }),

      el('button', { class:'btn', onclick(){ closePop(); driveOn ? makeReport() : connectDrive(); } }, driveOn ? 'Open' : 'Connect'),
      latest(d.reportId ? 'https://docs.google.com/document/d/' + d.reportId + '/edit' : null, d.reportAt, 'Last updated')),
    item('Status slides · Google Slides', 'A fresh deck: overview, work done by day, the weeks around today, and what’s next.',
      el('button', { class:'btn primary', onclick(){ closePop(); makeSlides(); } }, driveOn ? 'Make slides' : 'Download'),
      latest(d.slides && d.slides.url, d.slides && d.slides.at, 'Latest deck')),
    el('div', { class:'rep-tip' }, driveOn && folderURL() ? [el('a', { href: folderURL(), target:'_blank', rel:'noopener', text:'Open the Anium.planning folder' }), '. ']
      : driveOn ? '' : 'Connect Google Drive to make these in your Drive; without it, slides download as a PowerPoint file. ',
      'Tip: give the status report to Gemini or NotebookLM and ask “Write a status update for my boss.”')));
}

async function loadAndStart(){
  let saved = null;
  try { saved = await IDB.get('planner'); } catch(e){ cacheOK = false; }
  if(saved) applyData(saved);
  else {
    let old = null; try { old = await IDB.get('workspace'); } catch(e){}
    if(old && Array.isArray(old.projects)) importOldProjects(old.projects);
  }
  mode = 'ready'; loaded = { days:true, project:true, tasks:true };
  renderAll();
  const auth = new URLSearchParams(location.search).get('auth');
  if(auth){ history.replaceState(null, '', location.pathname); toast(auth === 'cancelled' ? 'Google sign-in was cancelled.' : 'Google sign-in didn’t finish. Try again.', 5000); }
  resumeDrive();
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') pull(); else if(localDirty) saveLocal(); });
  setInterval(() => { if(document.visibilityState === 'visible') pull(); }, 60000);
  window.addEventListener('beforeunload', e => { if(driveOn && (driveDirty || pushing)){ push(); e.preventDefault(); e.returnValue = ''; } });
}
(function boot(){
  let st = null; try { st = JSON.parse(SS.get('anium-planner:ui') || 'null'); } catch(e){}
  const savedTab = LS.get('anium-planner:tab');
  if(st && st.on === today()){ ui.tab = st.tab || 'day'; if(/^\d{4}-\d{2}-\d{2}$/.test(st.date || '')) ui.date = st.date; }
  else if(savedTab) ui.tab = savedTab;
  if(ui.tab === 'project') ui.tab = 'timeline';
  if(!['day', 'log', 'timeline'].includes(ui.tab)) ui.tab = 'day';
  buildShell(); renderAll();
  window.addEventListener('pagehide', stashUI);
  let rw = null; window.addEventListener('resize', () => { clearTimeout(rw); rw = setTimeout(() => { if(!drag) renderView(); }, 150); });
  let lastDay = today();
  setInterval(() => {
    if(drag) return;
    const t = today();
    if(t !== lastDay){ if(ui.date === lastDay) ui.date = t; lastDay = t; scrolledFor = null; renderAll(); return; }
    if(ui.tab === 'day' && ui.date === t) renderView();
  }, 60000);
  applyTheme();
  loadAndStart();
})();
})();
